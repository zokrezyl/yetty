exposed:
  - source_file: src/yetty/ynet/capture.c
    name: yetty_ynet_emit_osc
    return_type: struct yetty_ycore_void_result
    args:
      - name: list
        type: "const struct yetty_ydraw_drawable_list *"
      - name: fd
        type: int
    doc: "/* Serialize a rendered drawable list as a YDRAW_BIN DCS envelope on `fd` — the
 * scrolling-layer figure path (mirrors yflame's emit_osc). */"

methods:
  - slot: load_file
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: path
        type: "const char *"
    doc: "/* Load a pcap / pcapng file. Reads every packet, dissects it for the summary
 * columns + 5-tuple, copies its bytes into the arena, and folds it into the
 * flow table. Uses libpcap offline reading — no root, no live interface. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: packet_count
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: uint32_t
  - slot: packet_time
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_float_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: float
  - slot: packet_length
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: uint32_t
  - slot: packet_protocol
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: packet_source
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: packet_destination
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: packet_info
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: packet_bytes
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_uint8_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const uint8_t *"
  - slot: packet_caplen
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: uint32_t
  - slot: flow_count
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: uint32_t
  - slot: flow_summary
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: index
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: render
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width
        type: uint32_t
      - name: height
        type: uint32_t
    doc: "/* Render the capture's conversations as a topology figure. `width`/`height` are
 * the figure's pixel size (0 → defaults). Returns a ydraw drawable list the
 * caller emits and then destroys. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: destroy
    domain: ynet
    owning_class: capture
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null

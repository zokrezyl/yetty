methods:
  - slot: feed
    domain: ymux
    owning_class: vtsink
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: generation
        type: uint64_t
      - name: bytes
        type: struct yetty_ycore_buffer
    doc: "/* The ordered terminal-byte push the daemon calls over the relay. Synchronous
 * (request/response) so the reply is the application ACK the daemon's VT flow
 * control waits on — a oneway call would swallow write errors and turn a frozen
 * sink into an invisible stall. */"
    local: false
    oneway: false
    return_payload_type: null

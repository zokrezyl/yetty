        slot_domain: ycircuit
        impl: circuit_add_component
      - slot: add_wire
        slot_domain: ycircuit
        impl: circuit_add_wire
      - slot: add_junction
        slot_domain: ycircuit
        impl: circuit_add_junction
      - slot: add_label
        slot_domain: ycircuit
        impl: circuit_add_label
      - slot: render
        slot_domain: ycircuit
        impl: circuit_render
      - slot: hit_test
        slot_domain: ycircuit

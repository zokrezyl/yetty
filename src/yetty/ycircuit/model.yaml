methods:
  - slot: configure
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: grid_px
        type: float
      - name: flags
        type: uint32_t
    doc: "/* configure: set the grid pitch in px and render flags. 0 selects the
 * default. A `grid` directive in the parsed document takes precedence. Call
 * after create(), before render(). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: parse
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* parse: ingest schematic-DSL text and build the circuit model. Resets the
 * model and clears any selection. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: clear
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* clear: drop every element, the title and the selection (configuration is
 * kept). The programmatic counterpart of parse(\"\"). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: add_component
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: kind
        type: "const char *"
      - name: x
        type: float
      - name: y
        type: float
      - name: rotation_deg
        type: int32_t
      - name: name
        type: "const char *"
      - name: value
        type: "const char *"
    doc: "/* add_component: append a component (kind by name: \"resistor\", \"diode\",
 * \"npn\", ...; rotation in degrees, multiples of 90; name/value may be NULL or
 * empty). Returns the new element id. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: add_ic
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: rotation_deg
        type: int32_t
      - name: name
        type: "const char *"
      - name: value
        type: "const char *"
      - name: pins_left
        type: "const char *"
      - name: pins_right
        type: "const char *"
      - name: pins_top
        type: "const char *"
      - name: pins_bottom
        type: "const char *"
    doc: "/* add_ic: append a generic IC body with named pins per side (comma-separated
 * lists like \"GND,TRIG,OUT\"; NULL or empty = no pins on that side). The body
 * grows to fit the longest side. Returns the new element id. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: add_wire
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x0
        type: float
      - name: y0
        type: float
      - name: x1
        type: float
      - name: y1
        type: float
    doc: "/* add_wire: append one straight wire segment. Returns the new element id. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: add_junction
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: "/* add_junction: append a connection dot. Returns the new element id. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: add_label
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: text
        type: "const char *"
    doc: "/* add_label: append a free text label anchored at (x,y). Returns the new
 * element id. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: render
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* render: lay out the circuit and emit it as a fresh ydraw drawable list
 * (caller owns it). Pointer return -> local-only. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: hit_test
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: "/* hit_test: id of the element whose bounding box contains content (x,y), or
 * YETTY_YCIRCUIT_NO_ELEMENT. Requires a prior render() for the layout. On
 * overlap the most recently added element wins (it draws on top). */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: set_highlight
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: element_id
        type: int32_t
    doc: "/* set_highlight: mark an element as selected (-1 clears) for the next
 * render. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: destroy
    domain: ycircuit
    owning_class: circuit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: free the circuit model and the object. */"
    local: true
    oneway: false
    return_payload_type: null
classes:
  - name: circuit
    domain: ycircuit
    accessor: yetty_ycircuit_circuit_class_get
    type: regular
    source_file: src/yetty/ycircuit/circuit.c
    parent: null

        type: float
        get: false
        set: false
      - name: flags
        type: uint32_t
        get: false
        set: false
      - name: grid_hint
        type: float
        get: false
        set: false
      - name: title
        type: "char *"
        get: false
        set: false
      - name: elements
        type: "struct ycircuit_element *"
        get: false
        set: false
      - name: count
        type: size_t
        get: false
        set: false
      - name: cap
        type: size_t
        get: false
        set: false
      - name: highlight_id_plus_one
        type: int32_t
        get: false
        set: false
      - name: content_w
        type: float
        get: false
        set: false
      - name: content_h
        type: float
        get: false
        set: false
    ops:
      - slot: configure
        slot_domain: ycircuit
        impl: circuit_configure
      - slot: parse
        slot_domain: ycircuit
        impl: circuit_parse
      - slot: clear
        slot_domain: ycircuit
        impl: circuit_clear
      - slot: add_component
        slot_domain: ycircuit
        impl: circuit_add_component
      - slot: add_ic
        slot_domain: ycircuit
        impl: circuit_add_ic
      - slot: add_wire
        slot_domain: ycircuit
        impl: circuit_add_wire
      - slot: add_junction
        slot_domain: ycircuit
        impl: circuit_add_junction
      - slot: add_label
        slot_domain: ycircuit
        impl: circuit_add_label
      - slot: render
        slot_domain: ycircuit
        impl: circuit_render
      - slot: hit_test
        slot_domain: ycircuit
        impl: circuit_hit_test
      - slot: set_highlight
        slot_domain: ycircuit
        impl: circuit_set_highlight
      - slot: destroy
        slot_domain: ycircuit
        impl: circuit_obj_destroy
    doc: null

      - slot: set_highlight
        slot_domain: ycircuit
        impl: circuit_set_highlight
      - slot: destroy
        slot_domain: ycircuit
        impl: circuit_obj_destroy
exposed:
  - source_file: src/yetty/ycircuit/circuit.c
    verbatim: "/* render() returns struct yetty_ydraw_drawable_list_result by value, so the
 * generated circuit.h (and the dispatch TU that includes it) needs the
 * complete type — pull its defining header into the public header. */
#include <yetty/ydraw-core/drawable-list.h>
/* Public constants — copied verbatim into the generated circuit.h. */
#define YETTY_YCIRCUIT_NO_ELEMENT (-1) /* hit_test: no element under the point */
#define YETTY_YCIRCUIT_FLAG_NONE 0x0u  /* reserved render flags */"
  - source_file: src/yetty/ycircuit/circuit.c
    name: yetty_ycircuit_emit_osc
    return_type: struct yetty_ycore_void_result
    args:
      - name: list
        type: "const struct yetty_ydraw_drawable_list *"
      - name: fd
        type: int

methods:
  - slot: pack
    domain: ydrawlist2
    owning_class: drawable
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: list
        type: "struct yetty_ydraw_drawable_list *"
    doc: "/* pack: append this drawable's record to `list`. The base impl is abstract —
 * every concrete drawable (font, text, the ysdf2 shapes) overrides it. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_name
    domain: ydrawlist2
    owning_class: font
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: name
        type: "const char *"
    doc: "/* set_name: the installed face name (e.g. \"Emmentaler\"). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_body
    domain: ydrawlist2
    owning_class: text
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: body
        type: "const char *"
    doc: "/* set_body: the UTF-8 text of the run. Named `body` so the binding
 * generators treat it as the class's primary content (positional in the
 * generated constructors, like api_yplot's Function). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_color
    domain: ydrawlist2
    owning_class: text
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: color
        type: "const char *"
    doc: "/* set_color: text color as \"#RRGGBB\" / \"#RRGGBBAA\" (the u32 `color`
 * property remains for numeric callers). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: add
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: drawable
        type: "struct yetty_yclass_object *"
    doc: "/* add: pack `drawable`'s record into this list, immediately, in call order. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: begin_group
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: group_id
        type: uint32_t
    doc: "/* begin_group: open a named entity scope — drawables added until the
 * matching end_group land inside GROUP(group_id)'s payload. On a receiver
 * with an entity model (the terminal's rolling rich store, scene-canvas) a
 * live group id can later be replaced in place by re-emitting GROUP(id, …)
 * or removed with delete_group(id). Groups nest. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: end_group
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* end_group: close the innermost open group (back-patches its payload
 * size). Every begin_group needs its end_group before emit. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: delete_group
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: group_id
        type: uint32_t
    doc: "/* delete_group: append DELETE(group_id) — the receiver removes the named
 * live group's whole subtree (figures included). The terminal keeps the
 * block's reserved rows; content sealed into scrollback is out of reach
 * and reports nothing. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: update
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
      - name: payload
        type: struct yetty_ycore_buffer
    doc: "/* update: append CMD_UPDATE(id, payload) — deliver an opaque payload to the
 * addressable complex bound to `id` (the figure created with that id, e.g.
 * Plot(id=7) → update(7, …)). The payload schema belongs to the target
 * figure; for a yplot data buffer it is
 *   [buffer_index u32][sample_offset u32][count u32][f32 samples...]
 * — the streaming-plot path. Emit it in its own envelope after the figure's
 * creation envelope. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: path
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: prefix
        type: struct yetty_ycore_buffer
    doc: "/* path: the ABSOLUTE ancestor path for the NEXT update/delete in this list —
 * the command's own id is the final path component (CMD_PATH on the wire).
 * `prefix` is the packed little-endian u32 id sequence, outermost first
 * (e.g. struct.pack(\"<II\", 7, 2) addresses under path 7.2). Not needed for
 * depth-1 targets. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: reserve
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: height_px
        type: uint32_t
    doc: "/* reserve: declare this batch's insertion row span (a VIEWPORT) from a pixel
 * height. Content taller than the declared span never extends the
 * reservation — it clips; pan it with the enclosing group's offset. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: dcs_emit
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* dcs_emit: serialize the list, wrap it in the YETTY_DCS_YDRAW_BIN envelope
 * and write it to stdout — the enclosing yetty renders it, anything else
 * discards it. Flushes so the envelope reaches the terminal immediately. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: destroy
    domain: ydrawlist2
    owning_class: drawable_list
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: release the wrapped list and the object. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_fill
    domain: ydrawlist2
    owning_class: shape
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: color
        type: "const char *"
    doc: "/* set_fill: fill color as \"#RRGGBB\" / \"#RRGGBBAA\". */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_stroke
    domain: ydrawlist2
    owning_class: shape
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: color
        type: "const char *"
    doc: "/* set_stroke: stroke color as \"#RRGGBB\" / \"#RRGGBBAA\". */"
    local: true
    oneway: false
    return_payload_type: null
classes:
  - name: drawable
    domain: ydrawlist2
    accessor: yetty_ydrawlist2_drawable_class_get
    type: regular
    source_file: src/yetty/ydrawlist2/drawable.c
    parent: null
    mixins: []
    data: struct yetty_ydrawlist2_drawable
    data_fields:
      - name: base_reserved
        type: uint32_t
        get: false
        set: false
    ops:
      - slot: pack
        slot_domain: ydrawlist2
        slot_class: drawable
        impl: drawable_pack
    internal: false
    doc: "/* The abstract drawable base. It has no state of its own — the member below
 * only keeps the struct non-empty for strict C; it is not a property and
 * never reaches the wire. */"
  - name: font
    domain: ydrawlist2
    accessor: yetty_ydrawlist2_font_class_get
    type: regular
    source_file: src/yetty/ydrawlist2/drawable.c
    parent:
      domain: ydrawlist2
      name: drawable
    mixins: []
    data: struct yetty_ydrawlist2_font
    data_fields:
      - name: font_id
        type: int32_t
        get: true
        set: true
      - name: name
        type: "char[128]"
        get: false
        set: false
    ops:
      - slot: set_name
        slot_domain: ydrawlist2
        slot_class: font
        impl: font_set_name
      - slot: pack
        slot_domain: ydrawlist2
        slot_class: drawable
        impl: font_pack
    internal: false
    doc: "/* A FONT resource record. The wire record carries an EXPLICIT i32 font_id
 * field — a plain property of this object, chosen by the user; Text records
 * reference it by the same int. v2 scope: installed-face references only
 * (no embedded TTF bytes yet). */"
  - name: text
    domain: ydrawlist2
    accessor: yetty_ydrawlist2_text_class_get
    type: regular
    source_file: src/yetty/ydrawlist2/drawable.c
    parent:
      domain: ydrawlist2
      name: drawable
    mixins: []
    data: struct yetty_ydrawlist2_text
    data_fields:
      - name: x
        type: float
        get: true
        set: true
      - name: y
        type: float
        get: true
        set: true
      - name: font_size
        type: float
        get: true
        set: true
      - name: color
        type: uint32_t
        get: true
        set: true
      - name: layer
        type: int32_t
        get: true
        set: true
      - name: font_id
        type: int32_t
        get: true
        set: true
      - name: rotation
        type: float
        get: true
        set: true
      - name: body_len
        type: uint32_t
        get: false
        set: false
      - name: body
        type: "char[2048]"
        get: false
        set: false
    ops:
      - slot: set_body
        slot_domain: ydrawlist2
        slot_class: text
        impl: text_set_body
      - slot: set_color
        slot_domain: ydrawlist2
        slot_class: text
        impl: text_set_color
      - slot: pack
        slot_domain: ydrawlist2
        slot_class: drawable
        impl: text_pack
    internal: false
    doc: "/* A TEXT run record: a UTF-8 span at (x, y) referencing a font by id
 * (-1 = the terminal's default face). Shaping and glyph resolution stay
 * server-side; @name shader glyphs are ordinary PUA codepoints in the body.
 * The body is inline — the cap bounds one RECORD, not the drawing. */"
    primary_slot: set_body
  - name: drawable_list
    domain: ydrawlist2
    accessor: yetty_ydrawlist2_drawable_list_class_get
    type: regular
    source_file: src/yetty/ydrawlist2/list.c
    parent: null
    mixins: []
    data: struct yetty_ydrawlist2_drawable_list
    data_fields:
      - name: list
        type: "struct yetty_ydraw_drawable_list *"
        get: false
        set: false
      - name: group_markers
        type: "uint32_t[8]"
        get: false
        set: false
      - name: group_marker_depth
        type: uint32_t
        get: false
        set: false
    ops:
      - slot: add
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_add
      - slot: begin_group
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_begin_group
      - slot: end_group
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_end_group
      - slot: delete_group
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_delete_group
      - slot: update
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_update
      - slot: path
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_path
      - slot: reserve
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_reserve
      - slot: dcs_emit
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_dcs_emit
      - slot: destroy
        slot_domain: ydrawlist2
        slot_class: drawable_list
        impl: list_destroy
    internal: false
    doc: null
  - name: shape
    domain: ydrawlist2
    accessor: yetty_ydrawlist2_shape_class_get
    type: regular
    source_file: src/yetty/ydrawlist2/shape.c
    parent:
      domain: ydrawlist2
      name: drawable
    mixins: []
    data: struct yetty_ydrawlist2_shape
    data_fields:
      - name: id
        type: uint32_t
        get: true
        set: true
      - name: layer
        type: int32_t
        get: true
        set: true
      - name: fill
        type: uint32_t
        get: true
        set: true
      - name: stroke
        type: uint32_t
        get: true
        set: true
      - name: stroke_width
        type: float
        get: true
        set: true
    ops:
      - slot: set_fill
        slot_domain: ydrawlist2
        slot_class: shape
        impl: shape_set_fill
      - slot: set_stroke
        slot_domain: ydrawlist2
        slot_class: shape
        impl: shape_set_stroke
    internal: false
    doc: "/* `id` follows the wire rule: 0 = anonymous record, nonzero = addressable
 * (the type word gains the HAS_ID flag and the id word follows it). Colors
 * are 0xAARRGGBB words. */"
exposed:
  - source_file: src/yetty/ydrawlist2/list.c
    name: yetty_ydrawlist2_drawable_list_release_raw
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Transfer the wrapped RAW drawable list out: ownership moves to the
 * caller (e.g. ygui2's ydraw_embed adoption) and the v2 object is left
 * empty — the next add() lazily creates a fresh list, so the object stays
 * reusable. Errors when nothing was ever added (no list to hand over). */"
  - source_file: src/yetty/ydrawlist2/list.c
    name: yetty_ydrawlist2_drawable_list_adopt_raw
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: raw
        type: "struct yetty_ydraw_drawable_list *"
    doc: "/* Adopt a RAW drawable list INTO the wrapper (ownership moves in). The
 * inverse of release_raw — the restore path when a consumer (ygui2 embed
 * adoption) rejects a transferred list and hands it back. Errors when the
 * wrapper already holds a list (nothing is silently dropped). */"

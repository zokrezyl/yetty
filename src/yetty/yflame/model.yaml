methods:
  - slot: configure
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width
        type: float
      - name: frame_height
        type: float
      - name: min_width
        type: float
      - name: flags
        type: uint32_t
    local: true
  - slot: parse
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input
        type: "const char *"
      - name: len
        type: size_t
    local: true
  - slot: render
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: true
  - slot: hit_test
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_int_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    local: true
  - slot: focus
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: node_id
        type: int32_t
    local: true
  - slot: focus_parent
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: true
  - slot: reset
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: true
  - slot: set_highlight
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: node_id
        type: int32_t
    local: true
  - slot: destroy
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: true
classes:
  - name: flame
    domain: yflame
    accessor: yetty_yflame_flame_class_get
    type: regular
    source_file: src/yetty/yflame/flame.c
    parent: null
    mixins: []
    data: struct flame_data
    data_fields:
      - name: width
        type: float
        get: false
        set: false
      - name: frame_height
        type: float
        get: false
        set: false
      - name: min_width
        type: float
        get: false
        set: false
      - name: flags
        type: uint32_t
        get: false
        set: false
      - name: root
        type: "struct yflame_frame *"
        get: false
        set: false
      - name: nodes
        type: "struct yflame_frame **"
        get: false
        set: false
      - name: node_count
        type: uint32_t
        get: false
        set: false
      - name: focus_id
        type: int32_t
        get: false
        set: false
      - name: highlight_id
        type: int32_t
        get: false
        set: false
      - name: max_depth
        type: uint32_t
        get: false
        set: false
      - name: total_height
        type: float
        get: false
        set: false
    ops:
      - slot: configure
        slot_domain: yflame
        impl: flame_configure
      - slot: parse
        slot_domain: yflame
        impl: flame_parse
      - slot: render
        slot_domain: yflame
        impl: flame_render
      - slot: hit_test
        slot_domain: yflame
        impl: flame_hit_test
      - slot: focus
        slot_domain: yflame
        impl: flame_focus
      - slot: focus_parent
        slot_domain: yflame
        impl: flame_focus_parent
      - slot: reset
        slot_domain: yflame
        impl: flame_reset
      - slot: set_highlight
        slot_domain: yflame
        impl: flame_set_highlight
      - slot: destroy
        slot_domain: yflame
        impl: flame_obj_destroy
exposed:
  - source_file: src/yetty/yflame/flame.c
    verbatim: "/* Public flags — copied verbatim into the generated flame.h. */
#define YETTY_YFLAME_FLAG_LABELS 0x1u /* draw truncated frame-name labels */
#define YETTY_YFLAME_FLAG_ICICLE 0x2u /* root at top, growing down (vs flame: bottom-up) */
/* hit_test returns these (in place of a node id) when a navigation button is
 * under the point: the caller should focus the parent / reset to root. */
#define YETTY_YFLAME_HIT_UP (-2)
#define YETTY_YFLAME_HIT_ROOT (-3)"
  - source_file: src/yetty/yflame/flame.c
    name: yetty_yflame_emit_osc
    return_type: struct yetty_ycore_void_result
    args:
      - name: list
        type: "const struct yetty_ydraw_drawable_list *"
      - name: fd
        type: int

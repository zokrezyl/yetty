methods:
  - slot: configure
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width
        type: float
      - name: frame_height
        type: float
      - name: min_width
        type: float
      - name: flags
        type: uint32_t
    doc: "/* configure: set graph width, row height, min visible box width, and flags.
 * 0 selects the default for each. Call after create(), before parse(). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: parse
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* parse: ingest folded-stack text, build the call tree, index it. Resets focus
 * to the root and clears any hover highlight. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: render
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* render: lay out the focus subtree and emit it as a fresh ydraw drawable list
 * (caller owns it). Pointer return -> local-only. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: hit_test
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: "/* hit_test: id of the frame at content-coordinate (x,y) in the current focus
 * layout, or -1 if none. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: focus
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: node_id
        type: int32_t
    doc: "/* focus: zoom so the given node fills the full width (its subtree is shown). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: focus_parent
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* focus_parent: zoom out one level (focus the current node's parent). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: reset
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* reset: zoom back out to the whole graph (root). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_highlight
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: node_id
        type: int32_t
    doc: "/* set_highlight: mark a node as hovered (-1 clears) for the next render. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: highlight_name
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: name
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* highlight_name: paint every frame whose name contains `name` (case-insensitive)
 * magenta — drives both free-text search and the symbol-table cross-highlight.
 * NULL / zero-length clears the highlight. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: focus_name
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: name
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* focus_name: zoom so the heaviest frame whose name exactly equals `name` fills
 * the width. Used to jump the flame to a symbol picked in the table. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_baseline
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: folded
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* set_baseline: load a second folded profile as a diff baseline; frames then
 * colour by the delta of their sample fraction (red = grew, blue = shrank).
 * NULL / zero-length clears diff mode. Call after parse(). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: node_name
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: int32_t
    doc: "/* node_name: borrowed name of the node with this id (valid until the next
 * parse), or \"\" for an invalid id — used to build hover detail. */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: node_value
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: int32_t
    doc: "/* node_value: total samples passing through the node with this id (0 if bad). */"
    local: true
    oneway: false
    return_payload_type: uint64_t
  - slot: root_value
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* root_value: total samples in the whole profile — the percent denominator. */"
    local: true
    oneway: false
    return_payload_type: uint64_t
  - slot: destroy
    domain: yflame
    owning_class: flame
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: free the tree, the node index, and the object. */"
    local: true
    oneway: false
    return_payload_type: null

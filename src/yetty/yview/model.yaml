methods:
  - slot: configure
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: fd
        type: int
      - name: child_id
        type: uint32_t
      - name: kind
        type: uint32_t
      - name: bg_color
        type: uint32_t
      - name: min_x
        type: float
      - name: min_y
        type: float
      - name: max_x
        type: float
      - name: max_y
        type: float
    doc: "/* configure: set the output fd, figure id/kind, opaque background, and rect.
 * Call once after create(), before set_content(). */"
    local: true
    return_payload_type: null
  - slot: set_content
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: content
        type: "const struct yetty_ydraw_drawable_list *"
    doc: null
    local: true
    return_payload_type: null
  - slot: set_text
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: text
        type: "const char *"
      - name: font_size
        type: float
    doc: "/* set_text: render a UTF-8 string (newline-split into lines) as the view's
 * content using the server figure's default font. The convenience FFI callers
 * want when they have text but no drawable list (the pager / nvim case).
 * font_size <= 0 selects a default. */"
    local: true
    return_payload_type: null
  - slot: set_plot
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: expr
        type: "const char *"
      - name: x_min
        type: float
      - name: x_max
        type: float
      - name: y_min
        type: float
      - name: y_max
        type: float
    doc: "/* set_plot: render a yplot expression (yexpr-plot syntax — \"sin(x)\", or
 * \"f=sin(x); g=cos(x)\") as the view's content: one yplot figure filling the
 * rect (a plot doesn't scroll). x_max<=x_min or y_max<=y_min selects yplot's
 * default ranges. The ygrid figure renders the yplot composite prim via the
 * terminal's composite factory. */"
    local: true
    return_payload_type: null
  - slot: set_content_size
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: content_w
        type: float
      - name: content_h
        type: float
    doc: null
    local: true
    return_payload_type: null
  - slot: scroll_to
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: scroll_x
        type: float
      - name: scroll_y
        type: float
    doc: null
    local: true
    return_payload_type: null
  - slot: scroll_by
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: delta_x
        type: float
      - name: delta_y
        type: float
    doc: null
    local: true
    return_payload_type: null
  - slot: set_rect
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: min_x
        type: float
      - name: min_y
        type: float
      - name: max_x
        type: float
      - name: max_y
        type: float
    doc: null
    local: true
    return_payload_type: null
  - slot: destroy
    domain: yview
    owning_class: view
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: clear the surface (DELETE_CHILD) and free the object. */"
    local: true
    return_payload_type: null
classes:
  - name: view
    domain: yview
    accessor: yetty_yview_view_class_get
    type: regular
    source_file: src/yetty/yview/view.c
    parent: null
    mixins: []
    data: struct yetty_yview_view
    data_fields:
      - name: fd
        type: int
        get: false
        set: false
      - name: child_id
        type: uint32_t
        get: false
        set: false
      - name: kind
        type: uint32_t
        get: false
        set: false
      - name: bg_color
        type: uint32_t
        get: false
        set: false
      - name: rect
        type: struct yetty_ycore_rectangle
        get: false
        set: false
      - name: content_w
        type: float
        get: false
        set: false
      - name: content_h
        type: float
        get: false
        set: false
      - name: scroll_x
        type: float
        get: false
        set: false
      - name: scroll_y
        type: float
        get: false
        set: false
    ops:
      - slot: configure
        slot_domain: yview
        impl: view_configure
      - slot: set_content
        slot_domain: yview
        impl: view_set_content
      - slot: set_text
        slot_domain: yview
        impl: view_set_text
      - slot: set_plot
        slot_domain: yview
        impl: view_set_plot
      - slot: set_content_size
        slot_domain: yview
        impl: view_set_content_size
      - slot: scroll_to
        slot_domain: yview
        impl: view_scroll_to
      - slot: scroll_by
        slot_domain: yview
        impl: view_scroll_by
      - slot: set_rect
        slot_domain: yview
        impl: view_set_rect
      - slot: destroy
        slot_domain: yview
        impl: view_destroy
    doc: null

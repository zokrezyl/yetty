methods:
  - slot: set_path
    domain: ycomplex2
    owning_class: image
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: path
        type: "const char *"
    doc: "/* set_path: the image file (PNG/JPG/… — whatever stb decodes). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_glb
    domain: ycomplex2
    owning_class: mesh
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: path
        type: "const char *"
    doc: "/* set_glb: the glTF 2.0 binary file. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_source
    domain: ycomplex2
    owning_class: shadertoy
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: wgsl
        type: "const char *"
    doc: "/* set_source: the WGSL shader source, inline. Empty/NULL selects the
 * receiver's built-in default shader (animated gradient). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_wgsl_path
    domain: ycomplex2
    owning_class: shadertoy
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: path
        type: "const char *"
    doc: "/* set_wgsl_path: read the shader source from a file — the class's primary
 * content (Shadertoy(\"plasma.wgsl\", …)); set_wgsl takes inline source. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_h264
    domain: ycomplex2
    owning_class: video
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: path
        type: "const char *"
    doc: "/* set_h264: the raw Annex-B H.264 byte stream file (.h264/.264). */"
    local: true
    oneway: false
    return_payload_type: null

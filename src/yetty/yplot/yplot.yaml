# YPlot composite schema
# Generator produces: C serializer, WGSL accessors, GPU resource set logic

name: yplot
type_id: 0x80000003
description: |
  Function plotter. Renders any mix of:
    - mathematical expressions (compiled to yfsvm bytecode, evaluated per
      pixel on the GPU)
    - precomputed sample buffers (f32 arrays, e.g. live audio waveforms)
  Expressions and buffers coexist in one instance. Each curve picks its
  color from the shared 8-slot palette: expressions consume slots
  0..function_count-1, buffers consume slots function_count..(modulo 8).

# Shader libraries (concatenated before main shader)
libraries:
  - yfsvm

# NOTE: yplot's gen files (yplot-gen.{c,h,wgsl,wire.c}) contain hand-
# extensions the generator can't currently produce — the `data` array
# of buffers (yplot-gen.h:struct yetty_yplot_data_buffer), the
# yetty_yplot_update_data_chunk impl, and a few server-side uniform
# slots (notably `time`, populated by yplot-time.c on each timer tick
# when the compiled bytecode references LOAD_T). Re-running
# ydraw-gen/generate.py will WIPE those extensions; the generator
# needs to learn about `array: true` buffers and external uniform
# slots before regen is safe again.

# Fixed-size uniforms (serialized first)
uniforms:
  - name: bounds_x
    type: f32
    default: 0.0
  - name: bounds_y
    type: f32
    default: 0.0
  - name: bounds_w
    type: f32
    default: 300.0
  - name: bounds_h
    type: f32
    default: 200.0
  - name: x_min
    type: f32
    default: -3.14159
  - name: x_max
    type: f32
    default: 3.14159
  - name: y_min
    type: f32
    default: -1.5
  - name: y_max
    type: f32
    default: 1.5
  - name: flags
    type: u32
    default: 7
  - name: function_count
    type: u32
    default: 0
  - name: colors
    type: u32
    count: 8

  # NOTE: `time` is a server-side uniform — not on the wire. yplot-time.c
  # writes it on each timer tick when YETTY_YPLOT_FLAG_USES_TIME is set
  # on the wire `flags`. See yplot-gen.c populate_rs slot 26 + the
  # yplot_get_time accessor in yplot-gen.wgsl.

# Variable-size storage. Two logical buffers:
#
#   bytecode  : single u32 array — yfsvm program for the expressions
#   data      : variable-count array of f32 sample buffers
#
# Both physically share ONE GPU storage binding (binder concatenates in
# declaration order). The shader walks the merged layout at runtime — no
# const offsets are baked into the WGSL, so the pipeline never recompiles
# when an instance changes its data-buffer count or sizes.
#
# Storage layout (u32 words):
#   [0]                              bytecode_len  (in u32 words)
#   [1 .. bytecode_len]              bytecode      (yfsvm program)
#   [bytecode_len + 1]               data_count
#   for each data buffer i:
#     [len_i]                                        (in f32 samples)
#     [samples_i...]                                 (f32 bitcast u32)
buffers:
  - name: bytecode
    element_type: u32
    # array: false (default) — single fixed buffer
  - name: data
    element_type: f32
    array: true
    # array: true → variable-count list of buffers, count-prefixed on the
    # wire and self-describing in the merged storage region.

# YAML input mapping (array inputs -> uniform fields)
yaml_mapping:
  position: [bounds_x, bounds_y]
  size: [bounds_w, bounds_h]
  x_range: [x_min, x_max]
  y_range: [y_min, y_max]

# Boolean flags from YAML
yaml_flags:
  show_grid: 0x01
  show_axes: 0x02
  show_labels: 0x04

# YPlot composite schema
# Generator produces: C serializer, WGSL accessors, GPU resource set logic

name: yplot
type_id: 0x80000003
description: |
  Function plotter. Renders any mix of:
    - mathematical expressions (compiled to yfsvm bytecode, evaluated per
      pixel on the GPU)
    - precomputed sample buffers (f32 arrays, e.g. live audio waveforms)
  Expressions and buffers coexist in one instance. Each curve picks its
  color from the shared 8-slot palette: expressions consume slots
  0..function_count-1, buffers consume slots function_count..(modulo 8).

# Shader libraries (concatenated before main shader)
libraries:
  - yfsvm

# Regen is SAFE for this module: everything yplot-specific that used to be
# hand-patched into the generated files now flows from this schema —
#   array: true      → the `data` variable-count buffer list + merged storage
#   external_uniforms → the server-side `time` slot (written by yplot-time.c)
#   update: extern    → ops->update = yetty_yplot_instance_update (yplot-update.c)
#   lifecycle_extern  → create/destroy callouts (timer attach/detach)
#   yaml_factory: manual → hand-written yplot-yaml.c (yexpr/yfsvm parsing)

# CMD_UPDATE handling and the chunked sample-update API live in the
# hand-written yplot-update.c; the animation timer lives in yplot-time.c.
update: extern
lifecycle_extern: true
yaml_factory: manual

# Fixed-size uniforms (serialized first)
uniforms:
  - name: bounds_x
    type: f32
    default: 0.0
  - name: bounds_y
    type: f32
    default: 0.0
  - name: bounds_w
    type: f32
    default: 300.0
  - name: bounds_h
    type: f32
    default: 200.0
  - name: x_min
    type: f32
    default: -3.14159
  - name: x_max
    type: f32
    default: 3.14159
  - name: y_min
    type: f32
    default: -1.5
  - name: y_max
    type: f32
    default: 1.5
  # Tick spacing in DATA units, matching the client-side tick labels, so the
  # shader grid lands exactly under the labelled ticks. 0 = no tick info
  # (shader falls back to the legacy fixed 10-division grid). Ignored on a
  # log-scaled axis (the shader grids log axes at decade lines).
  - name: x_step
    type: f32
    default: 0.0
  - name: y_step
    type: f32
    default: 0.0
  # Field/heatmap rendering: which colormap (0 viridis, 1 plasma, 2 magma,
  # 3 inferno) and the value range mapped onto it. min == max means unset
  # (the shader falls back to the historical -1..1 mapping).
  - name: colormap_id
    type: u32
    default: 0
  - name: field_min
    type: f32
    default: -1.0
  - name: field_max
    type: f32
    default: 1.0
  - name: flags
    type: u32
    default: 7
  - name: function_count
    type: u32
    default: 0
  - name: colors
    type: u32
    count: 8
  # Uncertainty display, indexed by color slot: 0 = none, else
  # (lo_slot + 1) | (hi_slot + 1) << 8 | style << 16, where lo/hi are data
  # buffer slots feeding the envelope and style is 0 = translucent band,
  # 1 = whisker error bars at decimated sample positions.
  - name: band_slots
    type: u32
    count: 8
  # Bit i set = data buffer slot i is band input only — its own line curve
  # is not drawn.
  - name: hidden_mask
    type: u32
    default: 0
  # Ring-buffer mode per data-buffer slot: 0 = linear, else (head + 1)
  # where head is the physical index of the OLDEST sample. The shader
  # unwraps so the newest sample always sits at the right edge; producers
  # advance the head via the CMD_UPDATE head op (sample_offset sentinel
  # 0xFFFFFFFF — see yplot-update.c).
  - name: ring_heads
    type: u32
    count: 8

# Server-side uniforms — RS slots the wire never carries. yplot-time.c
# writes `time` on each timer tick when YETTY_YPLOT_FLAG_USES_TIME is set
# on the wire `flags` (slot constant: YETTY_YPLOT_UNIFORM_TIME_SLOT in the
# generated header; accessor: yplot_get_time in yplot-gen.wgsl).
external_uniforms:
  - name: time
    type: f32

# Variable-size storage. Two logical buffers:
#
#   bytecode  : single u32 array — yfsvm program for the expressions
#   data      : variable-count array of f32 sample buffers
#
# Both physically share ONE GPU storage binding (binder concatenates in
# declaration order). The shader walks the merged layout at runtime — no
# const offsets are baked into the WGSL, so the pipeline never recompiles
# when an instance changes its data-buffer count or sizes.
#
# Storage layout (u32 words):
#   [0]                              bytecode_len  (in u32 words)
#   [1 .. bytecode_len]              bytecode      (yfsvm program)
#   [bytecode_len + 1]               data_count
#   for each data buffer i:
#     [len_i]                                        (in f32 samples)
#     [samples_i...]                                 (f32 bitcast u32)
buffers:
  - name: bytecode
    element_type: u32
    # array: false (default) — single fixed buffer
  - name: data
    element_type: f32
    array: true
    # array: true → variable-count list of buffers, count-prefixed on the
    # wire and self-describing in the merged storage region.

# YAML input mapping (array inputs -> uniform fields)
yaml_mapping:
  position: [bounds_x, bounds_y]
  size: [bounds_w, bounds_h]
  x_range: [x_min, x_max]
  y_range: [y_min, y_max]

# Boolean flags from YAML
yaml_flags:
  show_grid: 0x01
  show_axes: 0x02
  show_labels: 0x04

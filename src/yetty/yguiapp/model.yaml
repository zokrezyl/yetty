methods:
  - slot: build
    domain: yguiapp
    owning_class: app
    return_type: struct yetty_ycore_void_result
    args:
      - name: app
        type: "struct yetty_yclass_object *"
      - name: root
        type: "struct yetty_yclass_object *"
    doc: "/*===========================================================================
 * build — the widget-tree population hook. A ygui app subclasses yguiapp:app
 * and overrides this to add widgets under `root`. Local-only: `root` is a
 * live in-process widget object, never wire-marshalled. The default is empty.
 *=========================================================================*/"
    local: true
    oneway: false
    return_payload_type: null
classes:
  - name: app
    domain: yguiapp
    accessor: yetty_yguiapp_app_class_get
    type: regular
    source_file: src/yetty/yguiapp/app.c
    parent:
      domain: yapp
      name: app
    mixins: []
    data: struct yetty_yguiapp_app
    data_fields:
      - name: engine
        type: "struct yetty_yclass_object *"
        get: false
        set: false
      - name: root
        type: "struct yetty_yclass_object *"
        get: true
        set: false
      - name: root_container
        type: "struct yetty_yclass_object *"
        get: false
        set: false
      - name: yframework
        type: "struct yetty_yframework *"
        get: false
        set: false
      - name: figure_registry
        type: "struct yetty_yfigure_registry *"
        get: false
        set: false
      - name: complex_factory
        type: "struct yetty_ydraw_complex_factory *"
        get: false
        set: false
      - name: font
        type: "struct yetty_yfont_font *"
        get: false
        set: false
      - name: figure_args
        type: struct yetty_yscene_factory_args
        get: false
        set: false
      - name: local_figure_args
        type: struct yetty_yscene_factory_args
        get: false
        set: false
      - name: render_target
        type: "struct yetty_ydraw_target *"
        get: false
        set: false
      - name: listener
        type: struct yetty_yevent_event_listener
        get: false
        set: false
      - name: frame_listener
        type: struct yetty_yevent_event_listener
        get: false
        set: false
      - name: frame_timer
        type: yetty_yevent_timer_id
        get: false
        set: false
      - name: chrome_enabled
        type: int
        get: false
        set: false
      - name: chrome
        type: "struct yetty_yclass_object *"
        get: false
        set: false
      - name: chrome_caption
        type: "struct yetty_yscene_scene *"
        get: false
        set: false
      - name: chrome_last_hover
        type: int
        get: false
        set: false
    ops:
      - slot: build
        slot_domain: yguiapp
        slot_class: app
        impl: yguiapp_default_build
      - slot: init
        slot_domain: yapp
        slot_class: app
        impl: yguiapp_init
      - slot: run
        slot_domain: yapp
        slot_class: app
        impl: yguiapp_run
      - slot: quit
        slot_domain: yapp
        slot_class: app
        impl: yguiapp_quit
    internal: false
    doc: "/*===========================================================================
 * Class data slice. The host owns the whole environment; the per-instance
 * pointers below are created in run() and torn down at the end of run().
 *=========================================================================*/"
exposed:
  - source_file: src/yetty/yguiapp/app.c
    name: yetty_yguiapp_app_quit
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Stop the app's event loop — the clean-quit path for app subclasses that
 * install their own key handler (e.g. an Esc-to-quit demo) and so bypass the
 * default 'q'/Ctrl-C quit above. A no-op when no loop is present (headless). */"
types:
  - name: yetty_yclass_object_ptr_result
    kind: result
    fields:
      - name: ok
        type: int
      - name: ""
        kind: union
        fields:
          - name: value
            type: "struct yetty_yclass_object *"
          - name: error
            type: struct yetty_ycore_error
  - name: yetty_ycore_error
    kind: struct
    fields:
      - name: msg
        type: "const char *"
      - name: file
        type: "const char *"
      - name: func
        type: "const char *"
      - name: line
        type: int
      - name: cause
        type: "struct yetty_ycore_error *"
  - name: yetty_ycore_void_result
    kind: result
    fields:
      - name: ok
        type: int
      - name: ""
        kind: union
        fields:
          - name: value
            type: int
          - name: error
            type: struct yetty_ycore_error
  - name: yetty_yevent_event_listener
    kind: struct
    fields:
      - name: handler
        type: yetty_ycore_event_handler
  - name: yetty_yscene_factory_args
    kind: struct
    fields:
      - name: complex_factory
        type: "struct yetty_ydraw_complex_factory *"
      - name: default_font
        type: "struct yetty_yfont_font *"
      - name: bold_font
        type: "struct yetty_yfont_font *"
      - name: italic_font
        type: "struct yetty_yfont_font *"
      - name: bold_italic_font
        type: "struct yetty_yfont_font *"
      - name: absolute_coords
        type: int
local_types:
  yetty_yguiapp_app: src/yetty/yguiapp/app.c
  yetty_yguiapp_app_ptr_result: src/yetty/yguiapp/app.c
local_typedefs:
  __int128_t:
    source_file: src/yetty/yguiapp/app.c
    text: typedef __int128 __int128_t;
  __uint128_t:
    source_file: src/yetty/yguiapp/app.c
    text: typedef unsigned __int128 __uint128_t;
  __NSConstantString:
    source_file: src/yetty/yguiapp/app.c
    text: typedef struct __NSConstantString_tag __NSConstantString;
  __builtin_ms_va_list:
    source_file: src/yetty/yguiapp/app.c
    text: "typedef char *__builtin_ms_va_list;"
  __builtin_va_list:
    source_file: src/yetty/yguiapp/app.c
    text: "typedef struct __va_list_tag[1] __builtin_va_list;"
  yetty_yguiapp_terminal_build_fn:
    source_file: include/yetty/yguiapp/run.h
    text: "typedef struct yetty_ycore_void_result (*yetty_yguiapp_terminal_build_fn)(struct yetty_yclass_object *, void *);"
  yetty_yguiapp_build_fn:
    source_file: src/yetty/gen/impl/yguiapp/app.c
    text: "typedef struct yetty_ycore_void_result (*yetty_yguiapp_build_fn)(struct yetty_yclass_object *, struct yetty_yclass_object *);"

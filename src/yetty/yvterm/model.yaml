        type: "void *"
    doc: "/* Register the figure re-materialization hook. The integration layer (which
 * owns the complex factory) supplies it; the grid replays retained wire
 * envelopes through it when an evicted history line scrolls back into view. */"
  - source_file: src/yetty/yvterm/grid.c
    name: yetty_yvterm_grid_feed

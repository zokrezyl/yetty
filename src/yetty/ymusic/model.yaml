methods:
  - slot: configure
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width
        type: float
      - name: staff_space
        type: float
      - name: flags
        type: uint32_t
    doc: "/* configure: set system width, staff-space (line gap) in px and render flags.
 * 0 selects the default for each. Call after create(), before render(). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: parse
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input
        type: "const char *"
      - name: len
        type: size_t
    doc: "/* parse: ingest LilyPond-subset text and build the score model. Resets the model
 * and clears any selection. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: render
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* render: lay out the score and emit it as a fresh ydraw drawable list (caller
 * owns it). Pointer return -> local-only. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: hit_test
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: "/* hit_test: id of the element whose column + system band contains content
 * (x,y), or YETTY_YMUSIC_NO_ELEMENT. Requires a prior render() for the layout. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: set_highlight
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: element_id
        type: int32_t
    doc: "/* set_highlight: mark an element as selected (-1 clears) for the next render. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: destroy
    domain: ymusic
    owning_class: music
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: free the score model and the object. */"
    local: true
    oneway: false
    return_payload_type: null
classes:

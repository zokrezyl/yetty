methods:
  - slot: client_open
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: base_url
        type: "const char *"
      - name: token
        type: "const char *"
    doc: "/* open: create a kernel over REST and open its WebSocket channel. `token` may be
 * \"\" for a tokenless server. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: client_execute
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: code
        type: "const char *"
      - name: tag
        type: "const char *"
    doc: "/* execute: send an execute_request for `code` on the shell channel, correlated
 * to `tag`. Returns the request msg_id (owned; caller frees). */"
    local: true
    oneway: false
    return_payload_type: "char *"
  - slot: client_poll
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: timeout_ms
        type: int
    doc: "/* poll: wait up to `timeout_ms` for the next incoming message. Returns a
 * message object (caller owns) whose kernel status has already updated the
 * session; errors on timeout or a closed connection. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_yclass_object *"
  - slot: client_kernel_state
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* kernel_state: the tracked busy/idle/... state of the kernel. */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: client_tag_for
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: parent_msg_id
        type: "const char *"
    doc: "/* tag_for: the caller tag correlated to a reply's parent_header.msg_id. */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: client_close
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* close: shut the WebSocket and delete the kernel over REST. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: client_destroy
    domain: yjupyter
    owning_class: client
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: close the connection, free the session, and the yclass allocation. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: message_build
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: msg_type
        type: "const char *"
      - name: channel
        type: "const char *"
      - name: session_id
        type: "const char *"
      - name: msg_id
        type: "const char *"
      - name: parent_msg_id
        type: "const char *"
      - name: content_json
        type: "const char *"
    doc: "/* build: populate this message as a Jupyter v5 frame. `content_json` is the
 * message content object as JSON text (or \"\" for an empty object);
 * `parent_msg_id` is \"\" for an originating request. Replaces any prior content. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: message_from_wire
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: json
        type: "const char *"
    doc: "/* from_wire: parse an incoming WebSocket JSON frame into this message. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: message_to_wire
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* to_wire: serialize the message as a WebSocket JSON frame (owned; caller frees). */"
    local: true
    oneway: false
    return_payload_type: "char *"
  - slot: message_msg_type
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* header/routing accessors (borrowed; valid while the message lives). */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: message_msg_id
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: message_parent_msg_id
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: message_channel
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: message_session
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: message_content_json
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* content_json: the message content object as JSON text (owned). */"
    local: true
    oneway: false
    return_payload_type: "char *"
  - slot: message_content_string
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: key
        type: "const char *"
    doc: "/* content_string: a string field of the content object (e.g. \"code\", \"text\",
 * \"name\", \"execution_state\", \"ename\", \"status\"); owned, \"\" when absent. */"
    local: true
    oneway: false
    return_payload_type: "char *"
  - slot: message_content_int
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: key
        type: "const char *"
    doc: "/* content_int: an integer field of the content object (e.g. \"execution_count\");
 * -1 when absent or not an integer. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: message_destroy
    domain: yjupyter
    owning_class: message
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: session_init
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: session_id
        type: "const char *"
    doc: "/* init: set the session id (a non-empty value is required — Jupyter Server keys
 * a kernel session on it). Resets counters, correlation, and kernel state. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: session_id
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: session_kernel_state
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: session_new_request
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: msg_type
        type: "const char *"
      - name: channel
        type: "const char *"
      - name: content_json
        type: "const char *"
      - name: tag
        type: "const char *"
    doc: "/* new_request: build a request message on `channel` with `content_json`,
 * assigning a fresh session-unique msg_id. When `tag` is non-empty, the
 * (msg_id -> tag) pair is recorded so replies can be correlated back with
 * tag_for(). Returns a message object the caller owns (destroy it). */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_yclass_object *"
  - slot: session_handle_wire
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: json
        type: "const char *"
    doc: "/* handle_wire: parse an incoming WebSocket frame into a message object (caller
 * owns it). When it is an IOPub `status` message, the kernel busy/idle state is
 * updated from its content.execution_state. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_yclass_object *"
  - slot: session_tag_for
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: parent_msg_id
        type: "const char *"
    doc: "/* tag_for: the caller tag recorded for the request whose msg_id is
 * `parent_msg_id` (i.e. the reply's parent_header.msg_id). \"\" when unknown —
 * an orphan the caller should route to a diagnostic stream, never an arbitrary
 * request. */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: session_destroy
    domain: yjupyter
    owning_class: session
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null

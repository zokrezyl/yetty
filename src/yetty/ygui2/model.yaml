methods:
  - slot: constructor
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: destructor
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: widget_paint
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: list
        type: "struct yetty_ydraw_drawable_list *"
    doc: "/* Paint the widget's own primitives into `list` in WIDGET-LOCAL pixels
 * (0,0 = widget top-left; the minted group's offset places them). The base
 * paints nothing. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: widget_paint_retained
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: list
        type: "struct yetty_ydraw_drawable_list *"
    doc: "/* RETAINED content (T5): emitted in the widget's CONTAINMENT group, after
 * the skin subgroup — hosted complex records whose runtime must survive
 * skin repaints, theme restyles, movement and ancestor resizes. Replaced
 * ONLY by an intentional structural reopen (set_record and friends mark
 * structure dirt). The base emits nothing. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: widget_emit_geometry
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: list
        type: "struct yetty_ydraw_drawable_list *"
    doc: "/* Geometry follow-up for retained content: called by the incremental emit
 * walk when the widget's SIZE changed (dirty_geometry), appending into
 * the SAME frame envelope. A widget hosting a resizable runtime (plot)
 * emits its addressed geometry op here — a few dozen bytes; the receiver
 * re-plans the runtime and its chrome locally, so the record and its
 * data are NEVER re-shipped on resize. The base emits nothing. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: widget_on_press
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: local_x
        type: float
      - name: local_y
        type: float
      - name: button
        type: int
      - name: mods
        type: int
    doc: "/* Pointer input (widget-local pixels). Return 1 = consumed, 0 = bubble. */"
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_on_release
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: local_x
        type: float
      - name: local_y
        type: float
      - name: button
        type: int
      - name: mods
        type: int
    doc: null
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_on_motion
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: local_x
        type: float
      - name: local_y
        type: float
      - name: buttons_held
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_on_scroll
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: local_x
        type: float
      - name: local_y
        type: float
      - name: wheel_dy
        type: float
    doc: null
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_on_key
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: key
        type: uint32_t
      - name: mods
        type: uint32_t
    doc: "/* Keyboard input for the focused widget. Return 1 = consumed. */"
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_cleanup
    domain: ygui2
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Subclass teardown hook: release owned heap state (record copies, owned
 * drawable lists) before the base free. The base owns nothing. */"
    local: false
    oneway: false
    return_payload_type: null

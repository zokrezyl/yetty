        slot_domain: yfigure
        impl: figure_process_bytes_slot
    doc: null
exposed:
  - source_file: src/yetty/yshadertoy/figure.c
    name: yetty_yshadertoy_create
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: rect
        type: struct yetty_ycore_rectangle
      - name: shader_src
        type: "const char *"
      - name: shader_len
        type: size_t
      - name: context
        type: "const struct yetty_context *"
    doc: "/* Create a yshadertoy figure directly (in-process). `shader_src` is the user
 * WGSL mainImage body; pass NULL to start with the default gradient (set the
 * real source later via set_source). `rect` is absolute pixel space within the
 * parent container. The figure reaches the GPU, event loop (anim timer +
 * repaint nudge) and config through `context`. Returns the yclass object
 * handle — pass it to set_source / as_figure. */"
  - source_file: src/yetty/yshadertoy/figure.c
    name: yetty_yshadertoy_as_figure
    return_type: struct yetty_yfigure_figure_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Upcast to the figure base handle (a Result — the object may not be of this
 * class). */"
  - source_file: src/yetty/yshadertoy/figure.c
    name: yetty_yshadertoy_set_source
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: shader_src
        type: "const char *"
      - name: shader_len
        type: size_t
    doc: "/* Replace the shader text and force a recompile on the next render. */"
  - source_file: src/yetty/yshadertoy/figure.c
    name: yetty_yshadertoy_register_factory
    return_type: struct yetty_ycore_void_result
    args:
      - name: registry
        type: "struct yetty_yfigure_registry *"
    doc: "/* Register the yshadertoy factory under YETTY_YFIGURE_KIND_YSHADERTOY.
 * No args bundle: the registry hands the host context to the factory at
 * mint time. Call from yframework's register_figure_factories (the same
 * place ymgui/yrdawn register), once per host registry. */"

methods:
  - slot: configure
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: latitude
        type: double
      - name: longitude
        type: double
      - name: zoom
        type: uint32_t
      - name: width_px
        type: uint32_t
      - name: height_px
        type: uint32_t
    doc: "/* configure: set the whole view in one call. zoom is clamped to the
 * active provider's range; viewport to the engine's sanity bounds. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_provider
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: name
        type: "const char *"
    doc: "/* set_provider: select a built-in provider by name (see
 * yetty_ymap_provider_info for enumeration). Clears any custom provider;
 * clamps the current zoom into the new provider's range. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_custom_provider
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: url_template
        type: "const char *"
      - name: is_vector
        type: int
      - name: file_extension
        type: "const char *"
      - name: max_zoom
        type: uint32_t
      - name: attribution
        type: "const char *"
    doc: "/* set_custom_provider: arbitrary XYZ tile server. `url_template` is
 * printf-style with three unsigned slots in z, x, y order (POSIX
 * positional %1$u.. reorder for z/y/x servers). `attribution` is what the
 * frontend must display; pass the provider's required credit line. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_center
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: latitude
        type: double
      - name: longitude
        type: double
    doc: "/* set_center / set_zoom / set_viewport: individual view setters. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_zoom
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: zoom
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_viewport
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width_px
        type: uint32_t
      - name: height_px
        type: uint32_t
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: pan_by_pixels
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: delta_x
        type: double
      - name: delta_y
        type: double
    doc: "/* pan_by_pixels: shift the view by a viewport-pixel delta — content
 * follows the pointer (drag right → map moves right → center moves
 * west). Latitude clamps so the viewport stays on the Mercator square. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: zoom_by_at
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: step
        type: int32_t
      - name: anchor_x
        type: double
      - name: anchor_y
        type: double
    doc: "/* zoom_by_at: zoom by `step` levels keeping the viewport pixel
 * (anchor_x, anchor_y) on the same lat/lon — the wheel-zoom feel.
 * Returns the (clamped) new zoom level. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: get_zoom
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* get_zoom: current zoom level (after clamping). */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: geolocate
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* geolocate: center the view on this machine's public-IP location (one
 * HTTPS request, city-level accuracy, see ymap's geoip notes).
 * Best-effort: on error the view is unchanged and the caller decides. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: attribution
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_const_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* attribution: the credit line the frontend MUST display with the map. */"
    local: true
    oneway: false
    return_payload_type: "const char *"
  - slot: is_vector
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* is_vector: 1 when the active provider renders through the vector
 * (SDF/MSDF) pipeline — frontends use it to pick drag-render pacing. */"
    local: true
    oneway: false
    return_payload_type: int
  - slot: overlay_geojson
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: geojson_text
        type: "const char *"
    doc: "/* overlay_geojson: load a GeoJSON document (FeatureCollection / Feature /
 * bare geometry) as the map's data overlay, replacing any previous one.
 * Point/MultiPoint become markers (radius from a numeric `mag` property
 * when present), LineString/MultiLineString become tracks, Polygon outer
 * rings become outlines. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: render
    domain: ymap
    owning_class: map
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* render: fetch the covering tiles (parallel, disk-cached) and emit the
 * visible map as a fresh ydraw drawable list (caller owns it). Pointer
 * return -> local-only. */"
    local: true
    oneway: false
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: destroy
    domain: ymap
    owning_class: map
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: free owned strings + the yclass allocation. */"
    local: true
    oneway: false
    return_payload_type: null

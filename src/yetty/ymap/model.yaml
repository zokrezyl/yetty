      - name: out_is_vector
        type: "int *"
    doc: "/* Metadata of built-in provider `index` (0..count-1). Any out pointer may
 * be NULL. Strings are static — never freed by the caller. */"
  - source_file: src/yetty/ymap/map.c
    name: yetty_ymap_emit_osc

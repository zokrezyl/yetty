      - name: obj
        type: "struct yetty_yclass_object *"
      - name: color
        type: uint32_t
    doc: "/* Text colour — selection-scoped like toggle_format, absolute (no toggle). */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_set_alignment
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: halign
        type: uint32_t
    doc: "/* Paragraph alignment (enum yetty_yrich_halign). */"
    local: false
    oneway: false

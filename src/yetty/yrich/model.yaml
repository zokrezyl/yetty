        type: "struct yetty_yclass_object *"
    doc: "/* element_destroy: free element-specific state, then the object. The base
 * owns no heap state, so the default just frees the object; concrete kinds
 * override, free their own fields and chain up via yetty_yrich_super_void. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: element_bounds

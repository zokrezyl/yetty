  - slot: ydoc_set_line_spacing
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: spacing
        type: float
    doc: "/* Line-spacing multiplier for the active paragraph (document-wide under
 * select-all): 1.0 single, 1.5, 2.0 double. Recomputes line_height and is
 * fully undoable. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_adjust_indent
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: direction
        type: int32_t
    doc: "/* Shift the active paragraph's left indent by one step (positive = increase,
 * negative = decrease; clamped at 0). Document-wide under select-all; undoable. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_set_highlight
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: bg_color
        type: uint32_t
    doc: "/* Highlight (background) color for the selection — 0 clears it. Applies to the
 * selected range, else the whole active paragraph; document-wide under
 * select-all. Fully undoable via the format snapshot. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_clear_format
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Clear character formatting (bold/italic/underline/strike, text color, and
 * highlight) from the selection — the whole active paragraph if the caret is
 * collapsed, document-wide under select-all. Fully undoable. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_set_heading
    domain: yrich

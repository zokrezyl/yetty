        type: "struct yetty_yclass_object *"
      - name: delta
        type: float
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: ydoc_set_font_size
    domain: yrich
    owning_class: ydoc
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: size
        type: float
    doc: "/* Set an absolute font size on the selection (per-run), the whole active
 * paragraph if collapsed, or document-wide under select-all. Undoable. */"
    local: false
    oneway: false
    return_payload_type: null

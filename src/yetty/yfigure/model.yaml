      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
      - name: scroll_x
        type: float
      - name: scroll_y
        type: float
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_child_content_size
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
      - name: content_w
        type: float
      - name: content_h
        type: float
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: apply_child_body
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
      - name: body
        type: struct yetty_ycore_buffer
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: clear_all
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: dump_state
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: indent
        type: int
    doc: "/* dump_state: heap text snapshot for tests. Base default yields a NULL
 * string so the yetty_yfigure_dump wrapper emits its rect fallback. */"
    local: true
    oneway: false
    return_payload_type: "char *"
  - slot: process_input
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: statemachine
        type: "struct yetty_ywire_wire_statemachine *"
    doc: "/* process_input: consume the figure's wire body straight off the SM.
 * Base default rejects — a purely visual figure ignores wire updates.
 * The container only routes here for kinds that override it (capability
 * detected via yetty_yfigure_figure_implements). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: process_bytes
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: bytes
        type: "const uint8_t *"
      - name: bytes_len
        type: size_t
    doc: "/* process_bytes: apply a buffered wire body. Base default rejects. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: reset_content
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* reset_content: drop content, keep GPU state. Base default rejects so the
 * container falls back to destroy + mint for kinds that don't support it. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_scroll
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: scroll_x
        type: float
      - name: scroll_y
        type: float
    doc: "/* set_scroll: move the figure's scroll offset (the content coordinate shown
 * at the rect's top-left). Base default rejects — a non-scrolling figure has
 * no content larger than its rect. Scrollable kinds (ygrid) override this so
 * the container can drive the offset by id from a wire SET_CHILD_SCROLL
 * record or the terminal's autonomous wheel/key handler, without re-shipping
 * content. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: set_content_size
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: content_w
        type: float
      - name: content_h
        type: float
    doc: "/* set_content_size: declare the figure's content extent in px (the rect stays
 * the visible window; content may be larger, making the figure a scroll
 * viewport). Base default rejects. Scrollable kinds override it. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: apply_scroll_anchor
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: rolling_row_offset
        type: int32_t
      - name: cell_height
        type: float
    doc: "/* apply_scroll_anchor: re-anchor a scroll-anchored figure's rendered content
 * to the terminal's current scroll position. `rolling_row_offset` is the
 * number of content rows the view has advanced since the figure was created
 * (content_root_row - creation_row); `cell_height` is the terminal cell
 * height in px, so the pixel shift is offset*cell_height. A ygrid-backed card
 * overrides this to slide its absolute-coord content by that many pixels so it
 * tracks the surrounding text. Base default is a no-op: a figure that draws
 * nothing content-relative needs no anchoring beyond its rect. */"
    local: true
    oneway: false
    return_payload_type: null

    data_fields:
      - name: rect
        type: struct yetty_ycore_rectangle
        get: true
        set: true
      - name: z
        type: int
        get: true
        set: true
      - name: hidden
        type: int
        get: true
        set: true
      - name: dirty
        type: int
        get: true
        set: true
      - name: absolute_coords
        type: int
        get: true
        set: true
    ops:
      - slot: render
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_render
      - slot: destroy
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_destroy
      - slot: process_input
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_process_input
      - slot: process_bytes
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_process_bytes
      - slot: reset_content
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_reset_content
      - slot: dump_state
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_dump_state
      - slot: set_scroll
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_set_scroll
      - slot: set_content_size
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_set_content_size
      - slot: apply_scroll_anchor
        slot_domain: yfigure
        impl: yetty_yfigure_figure_default_apply_scroll_anchor
    doc: "/* ---- figure base data slice (PRIVATE) -----------------------------------
 * The yclass data slice for the figure base class — the first slice in every
 * figure object (right after the yclass object header). The layout is not
 * exported: figure.h only forward-declares the struct. Members that other
 * classes legitimately read/write carry a `property` annotation, which makes
 * codegen emit the standardized get/set accessors plus the opaque data-block
 * handle (yetty_yfigure_figure_data_get); unannotated members stay private to
 * this TU. There is deliberately no `self_obj` member — the owning object of
 * a base handle is simply `(struct yetty_yclass_object *)handle - 1`, since
 * the base is always the first slice.
 *
 *   rect   : AABB in target pixel space; moves go through the parent's
 *            set_rect so damage tracking stays correct. (No `id` field — id is
 *            a parent-scoped name the container assigns.)
 *   z      : stacking order within the parent (higher renders later / wins
 *            hit-tests); ties break on insertion order.
 *   hidden : parent skips this child entirely (no render, no hit).
 *   dirty  : contents changed without geometry moving; the parent ORs this
 *            into its damage region next render pass and clears it.
 *   absolute_coords : the figure lays out / hit-tests / paints its content
 *            in pane-root pixel space and only scissor-clips to its rect —
 *            no per-figure re-origin (ygui chrome + scrolling sub-figures).
 *            When 0 (the default for every producer figure: yplot/yimage/…),
 *            content is local to the figure rect. The parent's hit-test reads
 *            this to decide whether to report the cursor in pane-local space
 *            (absolute) or re-origined to the figure rect (local). */"
exposed:
  - source_file: src/yetty/yfigure/container.c
    type_text: "struct yetty_yfigure_hit {
    uint32_t figure_id;
    float local_x;
    float local_y;
};"
    doc: "/* Hit-test result: the child whose rect contains the cursor, plus the cursor
 * coordinates inside that child's own pixel space (origin = child rect's
 * top-left). figure_id == 0 means \"no hit\". Iteration is back-to-front, so
 * for overlapping children the BACK-most match wins. This is an `expose`d
 * type: codegen reads this definition (it sees the whole TU during its parse
 * pass) and re-emits it into the generated container.h for consumers. The
 * definition lives HERE because this TU no longer includes container.h, so it
 * is the sole definition in the real build too — no double definition.
 * `expose` makes codegen re-emit this full definition (it is returned by
 * value from yetty_yfigure_container_hit_test, so consumers need the
 * layout, not just a forward decl) into the generated container.h. That
 * header copy and this one never share a TU — this TU does not include
 * container.h — so there is no clash. */"
  - source_file: src/yetty/yfigure/container.c
    type_text: "struct yetty_yfigure_header {
    uint32_t length;
    uint32_t id;
};"
    doc: "/* Wire record header — a child body buffer is a sequence of
 * (length, id, payload[length]) records. Length-first so a pipeline
 * linter / proxy can walk records without knowing figure semantics.
 * Part of the object-API data contract (formerly <yetty/yfigure/wire.h>). */"
  - source_file: src/yetty/yfigure/container.c
    name: yetty_yfigure_dump
    return_type: struct yetty_ycore_char_ptr_result
    args:

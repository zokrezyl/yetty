        type: uint32_t
      - name: hidden
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_child_scroll
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result

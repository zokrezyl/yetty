methods:
  - slot: destroy
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: tears down concrete state and frees the figure. The base
 * default is a no-op — the base class is never instantiated as a leaf;
 * every concrete kind overrides this and frees via object_free. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: render
    domain: yfigure
    owning_class: figure
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: target
        type: "struct yetty_ydraw_target *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: constructor
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* yclass instance layout: yclass_object header at offset 0, user data
 * (the `struct yetty_yfigure_container` body) immediately after. Cast
 * via (obj + 1) advances past the header in pointer arithmetic. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: add_child
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: child
        type: "struct yetty_yfigure_figure *"
      - name: id
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: remove_child_by_id
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: raise_child_by_id
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: create_child
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: kind_token
        type: uint32_t
      - name: id
        type: uint32_t
      - name: rect
        type: struct yetty_ycore_rectangle
      - name: init
        type: struct yetty_ycore_buffer
    doc: "/* Every mutation slot is plain request/response — a remote failure comes
 * back to the producer as the stub's Result (full cause chain), never
 * swallowed. The legacy `oneway@` fire-and-forget here hid every server-side
 * failure (bad payload, unknown child id, factory rejection) in the host's
 * log while the producer streamed on against state it believed existed —
 * the direct source of silently missing/stale figures. Round-trip latency
 * on the local transports is microseconds; if profiling ever shows the
 * lockstep wait hurting a remote producer, the answer is pipelined async
 * calls with error completion on the multiplexed connection — not
 * discarding the error channel. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: delete_child
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_child_rect
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: id
        type: uint32_t
      - name: rect
        type: struct yetty_ycore_rectangle
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_rect
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: rect
        type: struct yetty_ycore_rectangle
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_child_z
    domain: yfigure
    owning_class: container
    return_type: struct yetty_ycore_void_result

    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: wgsl
        type: struct yetty_ycore_buffer
    doc: "/* set_shader: replace the user fragment WGSL. The buffer carries the raw
 * text of `fn ydummy_fragment(uv: vec2f, time: f32) -> vec4f`; an empty
 * buffer reverts to the renderer's built-in default. Wire shape: length-
 * prefixed byte payload (`struct yetty_ycore_buffer` by value). */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_rect
    domain: ydummy
    owning_class: canvas
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: min_x
        type: float
      - name: min_y
        type: float
      - name: max_x
        type: float
      - name: max_y
        type: float
    doc: "/* set_rect: placement in target pixels. Zero-area → cover the target. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_time
    domain: ydummy
    owning_class: canvas
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: seconds
        type: float
    doc: "/* set_time: advance the animation clock the fragment sees. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: destroy
    domain: ydummy
    owning_class: canvas
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* destroy: release the owned WGSL copy and the object. */"
    local: false
    oneway: false
    return_payload_type: null

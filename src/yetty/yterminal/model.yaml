methods:
  - slot: figure_root_container
    domain: yterminal
    owning_class: terminal
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* figure_root_container: navigate from the terminal (the session root a
 * connecting tool receives) to its root figure container. Object-returning
 * wire slot — a remote tool receives a session-bound container proxy; a
 * local caller receives the real container object. */"
    local: false
    oneway: false
    return_payload_type: "struct yetty_yclass_object *"

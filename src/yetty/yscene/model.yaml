exposed:
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_create
    return_type: struct yetty_yscene_scene_ptr_result
    args:
      - name: rect
        type: struct yetty_ycore_rectangle
      - name: context
        type: "const struct yetty_context *"
    doc: "/* Create a scene figure. `context == NULL` (or a context without a
 * runtime) is HEADLESS mode — tests/tooling: no shader load, no binder;
 * the tree, adapter, derive and hit-test all work, render draws
 * nothing. With a real context the scene binds the framework's shared
 * drawable registry and builds its GPU pipeline (shared ydraw-layer
 * machinery: binder + yscene.wgsl + ysdf/effects libs). */"
  - source_file: src/yetty/yscene/scene.c
    type_text: "struct yetty_yscene_factory_args {
    struct yetty_ydraw_composite_factory * composite_factory;
    struct yetty_yfont_font * default_font;
    struct yetty_yfont_font * bold_font;
    struct yetty_yfont_font * italic_font;
    struct yetty_yfont_font * bold_italic_font;
    int absolute_coords;
};"
    doc: "/* Host inputs every wire-minted scene borrows. Lifetime: owned by the
 * host (terminal), outliving every scene minted through the registry —
 * the same contract as ygrid's factory args bundle. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_register_factory
    return_type: struct yetty_ycore_void_result
    args:
      - name: registry
        type: "struct yetty_yfigure_registry *"
      - name: args
        type: "const struct yetty_yscene_factory_args *"
    doc: "/* Register the \"yscene\" figure kind so containers can mint scenes from
 * wire CREATE_CHILD records. `args` is BORROWED for the registry's
 * lifetime (host-owned bundle); NULL registers a bare scene (no
 * composites, no default font). Call at terminal/host create time. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_register_factory_for_kind
    return_type: struct yetty_ycore_void_result
    args:
      - name: registry
        type: "struct yetty_yfigure_registry *"
      - name: kind
        type: uint32_t
      - name: args
        type: "const struct yetty_yscene_factory_args *"
    doc: "/* Register the scene factory under an arbitrary kind code — the ygrid
 * migration path: apps re-point their legacy figure kinds (\"ygrid\" and
 * the producer kinds yplot / yimage / …) at the retained scene renderer
 * without touching the producers' wire output. Args has the same
 * borrowed-lifetime contract as register_factory. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_set_default_font
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: font
        type: "struct yetty_yfont_font *"
    doc: "/* Host-side default font (slot 0) for a hand-created scene. Borrowed. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_set_composite_factory
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: factory
        type: "struct yetty_ydraw_composite_factory *"
    doc: "/* Host-side complex renderer for a hand-created scene. Borrowed. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_as_figure
    return_type: "struct yetty_yfigure_figure *"
    args:
      - name: scene
        type: "struct yetty_yscene_scene *"
    doc: "/* The figure base of this scene (the container's handle on it). */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_derive
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Rebuild the derived world state from the latest committed generation
 * (no-op when already current). Render does this implicitly; tests and
 * hit-test callers may want it explicitly. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_leaf_count
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Number of derived paint leaves (after derive). */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_hit_test
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: screen_x
        type: float
      - name: screen_y
        type: float
    doc: "/* Hit-test a SCREEN point against the derived scene: reverse paint
 * order over world AABBs + effective clips. Returns the owning node's
 * external id; 0 = no leaf hit (the document root / background). */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_render_plan
    return_type: struct yetty_ycore_char_ptr_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Render-plan snapshot for headless tests: derive, build staging
 * against the CURRENT rect/content extent (staging is pure CPU — no
 * binder needed), and dump the exact data destined for GPU upload:
 * staged count, extent, per-prim word summaries, cell occupancy, and
 * the view mapping. Caller frees the string. */"
  - source_file: src/yetty/yscene/scene.c
    name: yetty_yscene_set_view_scale
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: view_scale
        type: float
    doc: "/* View scale (HiDPI / zoom) — derive/view state, never baked into wire
 * coordinates. */"

  - slot: commit
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: uint64_t
  - slot: layout_barrier_begin
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Layout BARRIER (#699 review 19): a multi-call layout change (figure
 * reseat, grid resize, chrome restage) applies as ONE deliberate frame —
 * render kicks between begin and end coalesce into a single kick at end.
 * Nesting-safe (depth counter); pipelined over yRPC the pair brackets the
 * ordered layout calls exactly. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: layout_barrier_end
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: terminal_grid_generation
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* The receiver grid generation — remote-observable over yRPC (value call):
 * the reset barrier polls it to CONFIRM the fresh parser exists before the
 * vtsink republishes (review #17). */"
    local: false
    oneway: false
    return_payload_type: uint32_t
  - slot: terminal_grid_create
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: rows
        type: uint32_t
      - name: cols
        type: uint32_t
      - name: cell_width
        type: float
      - name: cell_height
        type: float
    doc: "/* Remote-facing terminal-grid slots (#699): the ymux attach bridge drives the
 * pane through these over the yclass RPC. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: terminal_grid_write
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: bytes
        type: struct yetty_ycore_buffer
    doc: "/* Synchronous (request/response): the ymux attach bridge streams VT redraws
 * here over the pane's DCS wire. A synchronous call surfaces write errors to
 * the bridge (a oneway call would swallow them — a silently-failing grid write
 * looks exactly like a frozen pane). Keystrokes that arrive on the shared
 * stdin while the bridge blocks on the reply are captured by the transport's
 * raw sink (yetty_yclass_transport_dcs_set_raw_sink) instead of being dropped,
 * so the round-trip no longer costs input. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: terminal_write_content
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: vt
        type: struct yetty_ycore_buffer
      - name: rich
        type: struct yetty_ycore_buffer
    doc: "/* Atomic terminal+rich publish over RPC (#699/#4): the ymux bridge sends both
 * halves of one content update in a single call so they render together. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: terminal_grid_resize
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: rows
        type: uint32_t
      - name: cols
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: terminal_reply_pending
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Terminal-reply drain over yRPC (#699 reply route, review #15). Buffer
 * RETURNS are not wire-marshallable, so the drain is scalar-word shaped:
 * pending() -> byte count, reply_word(index) -> 8 payload bytes packed LE
 * into a u64, reply_consume(count) -> drop the drained prefix. The bridge
 * polls after write batches and forwards the bytes through the attachment
 * input path to the daemon — the single controlling attachment owns the
 * answer, so N clients never reply N times. */"
    local: false
    oneway: false
    return_payload_type: uint32_t
  - slot: terminal_reply_word
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: word_index
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: uint64_t
  - slot: terminal_reply_consume
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: byte_count
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: input_event_head
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Overlay-input drain over yRPC (review #15): same scalar-word shape as the
 * reply drain. The head event is addressed as class+length (packed) and
 * word reads; consume pops it. The bridge forwards each drained event to
 * the daemon (OVERLAY_INPUT) — the daemon owns the chrome, tmux-style, so
 * chrome interaction logic runs where the chrome content originates. */"
    local: false
    oneway: false
    return_payload_type: uint64_t
  - slot: input_event_word
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: word_index
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: uint64_t
  - slot: input_event_pop
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: false
    oneway: false
    return_payload_type: null
  - slot: dispatch_key
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint32_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input_class
        type: uint32_t
      - name: bytes
        type: struct yetty_ycore_buffer
    doc: null
    local: false
    oneway: false
    return_payload_type: uint32_t
  - slot: note_key_intake
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: input_class
        type: uint32_t
      - name: bytes
        type: struct yetty_ycore_buffer
    doc: "/* Chrome key-intake NOTE (review #17): the same recording dispatch_key
 * makes, WITHOUT the consumption verdict or the queue — a void call, so
 * the bridge can pipeline it from the hot key path (a value round-trip
 * there needs an idle RPC window a live feed rarely offers; the bridge
 * already knows the focus verdict client-side and forwards the bytes to
 * the daemon seat directly). */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: set_terminal_selection
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: start_row
        type: uint32_t
      - name: start_col
        type: uint32_t
      - name: end_row
        type: uint32_t
      - name: end_col
        type: uint32_t
      - name: active
        type: uint32_t
    doc: "/* Terminal-grid selection over RPC (#699.5, review #12): the bridge's
 * copy-mode/drag path drives the grid's inverted span through the scene —
 * the grid object itself never crosses the wire. */"
    local: false
    oneway: false
    return_payload_type: null
  - slot: dispatch_pointer
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_uint64_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: local_x
        type: uint32_t
      - name: local_y
        type: uint32_t
      - name: kind
        type: uint32_t
      - name: button
        type: uint32_t
      - name: mods
        type: uint32_t
      - name: pressed
        type: uint32_t
    doc: null
    local: false
    oneway: false
    return_payload_type: uint64_t
  - slot: apply_content_transaction
    domain: yscene
    owning_class: scene
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"

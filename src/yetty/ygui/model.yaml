        type: "struct yetty_yclass_ctx *"
      - name: _yc_obj
        type: "struct yetty_yclass_object *"
      - name: ctx
        type: "struct yetty_ygui_emit_ctx *"
    local: true
  - slot: constructor
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: false
  - slot: destructor
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: false
  - slot: widget_on_motion
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    local: false
  - slot: widget_paint
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"

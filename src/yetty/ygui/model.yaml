    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: button
        type: int
    doc: null
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_on_motion
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: null
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_emit_body
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: emit_ctx
        type: "struct yetty_ygui_emit_ctx *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: widget_on_scroll
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: dx
        type: float
      - name: dy
        type: float
    doc: "/* Wheel / trackpad scroll. (dx, dy) are the deltas at (x, y). Default:
 * not handled (0), so the framework keeps bubbling to an ancestor that
 * scrolls. Scrollable widgets (scrollarea, filepicker) override this. */"
    local: false
    oneway: false
    return_payload_type: int
  - slot: widget_paint
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: emit_ctx

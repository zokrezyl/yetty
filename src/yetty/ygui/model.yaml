methods:
  - slot: widget_on_press
    domain: ygui
    owning_class: clickable
    return_type: struct yetty_ycore_int_result
    args:
      - name: yclass_ctx
        type: "struct yetty_yclass_ctx *"
      - name: yclass_obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: button
        type: int
    local: false
  - slot: widget_on_release
    domain: ygui
    owning_class: clickable
    return_type: struct yetty_ycore_int_result
    args:
      - name: yclass_ctx
        type: "struct yetty_yclass_ctx *"
      - name: yclass_obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: button
        type: int
    local: false
  - slot: widget_on_motion
    domain: ygui
    owning_class: draggable
    return_type: struct yetty_ycore_int_result
    args:
      - name: yclass_ctx
        type: "struct yetty_yclass_ctx *"
      - name: yclass_obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    local: false
  - slot: widget_emit_body
    domain: ygui
    owning_class: primitive_widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: yclass_ctx
        type: "struct yetty_yclass_ctx *"
      - name: yclass_obj
        type: "struct yetty_yclass_object *"
      - name: ctx
        type: "struct yetty_ygui_emit_ctx *"
    local: true
  - slot: constructor
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: false
  - slot: destructor
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
    local: false
  - slot: widget_on_scroll
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_int_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
      - name: dx
        type: float
      - name: dy
        type: float
    local: false
  - slot: widget_paint
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: emit_ctx
        type: "struct yetty_ygui_emit_ctx *"
    local: true
  - slot: widget_emit_container
    domain: ygui
    owning_class: widget
    return_type: struct yetty_ycore_void_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"

    name: yetty_ygui_super_int
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: self_class
        type: "const struct yetty_yclass *"
      - name: method_id
        type: yetty_yclass_method_id_t
    doc: null

methods:
  - slot: init
    domain: yapp
    owning_class: app
    return_type: struct yetty_ycore_void_result
    args:
      - name: app
        type: "struct yetty_yclass_object *"
      - name: platform
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: run
    domain: yapp
    owning_class: app
    return_type: struct yetty_ycore_void_result
    args:
      - name: app
        type: "struct yetty_yclass_object *"
      - name: platform
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: quit
    domain: yapp
    owning_class: app
    return_type: struct yetty_ycore_void_result
    args:
      - name: app
        type: "struct yetty_yclass_object *"
    doc: "/*
 * Ask the app to end its run loop. The base default is a no-op (an app with no
 * event loop has nothing to stop); a concrete app overrides this to stop its
 * loop so run() returns. Local — an app quits itself in-process.
 */"
    local: true
    oneway: false
    return_payload_type: null
classes:
  - name: app
    domain: yapp
    accessor: yetty_yapp_app_class_get
    type: regular
    source_file: src/yetty/yapp/app.c
    parent: null
    mixins: []
    data: struct yetty_yapp_app
    data_fields:
      - name: reserved
        type: char
        get: false
        set: false
    ops:
      - slot: init
        slot_domain: yapp
        impl: yapp_default_init
      - slot: run
        slot_domain: yapp
        impl: yapp_default_run
      - slot: quit
        slot_domain: yapp
        impl: yapp_default_quit
    doc: null
exposed:
  - source_file: src/yetty/yapp/app.c
    name: yetty_yapp_create_app
    return_type: struct yetty_yclass_object_ptr_result
    args:
      - name: ctx
        type: "struct yetty_yclass_ctx *"
    doc: "/*
 * App-injection point. The generic platform bootstrap (ymain/<plat>.c) knows
 * only yapp:app, so it calls this fixed-name forwarder; the concrete app module
 * linked into the binary defines it to build — and, when the app is wire-proxied,
 * register — its own app class. Declaration only: there is no default. A binary
 * that links a platform entry without defining this fails to link, by design.
 */"
types:
  - name: yetty_yclass_object_ptr_result
    kind: result
    fields:
      - name: ok
        type: int
      - name: 
        kind: union
        fields:
          - name: value
            type: "struct yetty_yclass_object *"
          - name: error
            type: struct yetty_ycore_error
  - name: yetty_ycore_error
    kind: struct
    fields:
      - name: msg
        type: "const char *"
      - name: file
        type: "const char *"
      - name: func
        type: "const char *"
      - name: line
        type: int
      - name: cause
        type: "struct yetty_ycore_error *"
  - name: yetty_ycore_void_result
    kind: result
    fields:
      - name: ok
        type: int
      - name: 
        kind: union
        fields:
          - name: value
            type: int
          - name: error
            type: struct yetty_ycore_error
local_types:
  yetty_yapp_app: src/yetty/yapp/app.c
  yetty_yapp_app_ptr_result: src/yetty/yapp/app.c

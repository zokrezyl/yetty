methods:
  - slot: configure
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: window_chrome
        type: "struct yetty_yclass_object *"
      - name: caption_height
        type: float
      - name: edge_size
        type: float
      - name: flags
        type: uint32_t
    doc: "/* Bind the engine to a window_chrome and set the caption/edge geometry. Call
 * once after create(), before feeding events. window_chrome is borrowed. */"
    local: true
    return_payload_type: null
  - slot: set_size
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: width
        type: float
      - name: height
        type: float
    doc: "/* Update the window size so the right/bottom edge bands track it. Call on every
 * resize. */"
    local: true
    return_payload_type: null
  - slot: destroy
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: null
    local: true
    return_payload_type: null
  - slot: edge_cursor_at
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: x
        type: float
      - name: y
        type: float
    doc: null
    local: true
    return_payload_type: int
  - slot: render
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ydraw_drawable_list_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
    doc: "/* Paint the caption strip into a fresh drawable list and return it: a filled
 * background spanning (width × caption_height) plus the minimize/maximize/close
 * glyphs flush right. The caller composites the list as a pinned top figure and
 * destroys it. Uses font_id=-1 (the default font), so no font dependency. */"
    local: true
    return_payload_type: "struct yetty_ydraw_drawable_list *"
  - slot: handle_event
    domain: ychrome
    owning_class: chrome
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: event
        type: "const struct yetty_yui_event *"
    doc: "/* Feed one mouse event. Returns 1 if chrome claimed it (the app should stop
 * processing it), 0 if it's not a chrome gesture. Forward events here only
 * after your own controls (buttons, tabs) had their chance. */"
    local: true
    return_payload_type: int

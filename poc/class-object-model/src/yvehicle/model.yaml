      - slot: vehicle_accelerate
        slot_domain: yvehicle
        impl: sportscar_accelerate
  - name: electric
    domain: yvehicle
    accessor: yvehicle_electric_mixin_get
    type: mixin
    source_file: src/yvehicle/electric.c

    ops:
      - slot: vehicle_ctor
        slot_domain: yvehicle
        impl: vehicle_default_ctor
      - slot: vehicle_dtor
        slot_domain: yvehicle
        impl: vehicle_default_dtor
      - slot: vehicle_start
        slot_domain: yvehicle
        impl: vehicle_default_start
      - slot: vehicle_accelerate
        slot_domain: yvehicle
        impl: vehicle_default_accelerate
      - slot: vehicle_brake
        slot_domain: yvehicle
        impl: vehicle_default_brake
      - slot: vehicle_describe
        slot_domain: yvehicle
        impl: vehicle_default_describe
  - name: motorbike
    domain: yvehicle
    accessor: yvehicle_motorbike_class_get
    type: regular
    source_file: src/yvehicle/motorbike.c
    parent:
      domain: yvehicle

# README GIF — full tour.
#
# A self-narrating ~60s scenario meant to be screen-recorded into the
# animated GIF for the project README. Each scene is introduced by a
# bash # comment that the viewer reads as on-screen narration before
# the demo runs.
#
# Scenes:
#   1. MSDF text — runs the existing ydraw/scrolling/text.sh, then
#      Ctrl+scroll-zooms in (soft visual zoom) so the viewer sees the
#      MSDF-rendered glyphs stay sharp at any scale.
#   2. Plot demo — ycat the plot.sh source (rendered with tree-sitter
#      highlighting), zoom; then actually run plot.sh and zoom on the
#      rendered curves. Ctrl+C bails the trailing `sleep 600`.
#   3. ycat README.md — markdown rendered inline as ydraw primitives
#      (headings, lists, code blocks) instead of plain text.
#   3b. ycat <pdf> — same tool, different MIME: a real PDF (pdfio →
#      ydraw primitives) lives in the scrolling layer. Zoom dance.
#   4. ygui flex dashboard — fullscreen flexbox layout demo with native
#      widgets. Press `q` to quit between scenes.
#   5. ygui tree view — interactive tree widget.
#   6. ymgui demo window — Dear ImGui running on yetty's GPU rendering
#      backend (one ImGui window inside the terminal, not a multi-window
#      manager). The script leaves it on screen as the GIF's final frame.
#
# Prereq: in repo root, start yetty with
#   ./build-desktop-ytrace-release/yetty --rpc-port=9999 -e bash
# then run ./demo/scripts/yrpc-scripts/readme-tour.sh from another shell.
#
# Zoom anchor is parked at the bottom-left of the window (x=5, y=700) so
# Ctrl+scroll grows content up-and-right from the prompt area instead of
# bulging out from the middle of the screen. Bump y if your recording
# window is much taller than ~720px.
# window is much taller than ~720px.

config:
  defaults:
    typing:
      avg-speed: 16
      speed-deviation: 0.25
      avg-typo: 0.0

script:

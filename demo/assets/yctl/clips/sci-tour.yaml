# Clip: the sci tour - yetty for the scientific community, in one scrollback.
#
# The scenario types one command (./sci-tour.sh), which walks a
# computational scientist's day on real data: a live-streaming solver,
# its computed orbit, log-axis convergence, a colormapped GPU field with
# colorbar, the Keeling curve, GW150914 strain loaded straight from the
# GWOSC data files, a month of seismicity baked over NASA satellite
# tiles, typeset mathematics, molecules and point clouds in 3D, a live
# N-body galaxy through the yrdawn bridge, matplotlib inline, and the
# pipeline/profile/notebook close. When the parade settles the scenario
# scrolls back up through the whole history, then closes.
#
# The tour body touches a `tour-done` marker as its last step, so the
# scenario advances on completion instead of a tuned sleep (the yctl
# `run` / `wait-for` verbs) — robust on any machine.
#
# WARNING: the last step is `shutdown` - it exits the yetty it runs
# against. Only play this against a dedicated recording instance.
#
# One-shot recording (from the repo root):
#
#   ./demo/scripts/yctl/clips/sci-tour.sh
#   # -> tmp/clips/sci-tour/sci-tour.mp4

config:
  defaults:
    typing:
      avg-speed: 14
      speed-deviation: 0.25
      avg-typo: 0.0

script:
  - sleep: 0.4

  # Kick off the self-driving tour and wait for its completion marker.
  # NOTE: wait-for polls from the yctl CLIENT's cwd (the repo root when
  # driven by demo/scripts/yctl/clips/sci-tour.sh), while the typed
  # command runs in the staging dir — so the marker is given the staging
  # path here.
  - run: "./sci-tour.sh; touch tour-done"
  - wait-for: {file: tmp/clips/sci-tour/tour-done, timeout: 420}
  - sleep: 1.0

  # Cruise UP through the history - the whole day is still there, one
  # continuous scrollback.
  - mouse-move: { x: 840, y: 460 }
  - sleep: 0.3
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 1.5             # hold: a screen of real science, mid-history

  # Drop back to the prompt for the end card.
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -8 }
  - sleep: 0.6

  - type:
      text: "# the experiment, the live data, the paper - one terminal."
      avg-speed: 24
  - special-char: ENTER
  - sleep: 0.4

  - type:
      text: "# github.com/zokrezyl/yetty | yetty.dev"
      avg-speed: 24
  - special-char: ENTER
  - sleep: 2.5

  - shutdown: ~

# Feature tour - every Yetty figure, in one unbroken scrollback.
#
# A yctl scenario: play it against a running yetty with
#   uv run tools/yctl-client/yctl.py plays demo/assets/yctl/clips/feature-tour.yaml
#
# The screen is NEVER cleared - each feature is announced with a shell comment,
# rendered, and left in the scrollback (a short scroll-up peek shows it is part
# of the history), then Enter snaps back to the bottom for the next one.
#
# The typed commands use bare asset names (ycat report.pdf, ...); run yetty with
# demo/assets/... on PATH / as the cwd so they resolve.
#
# WARNING: ends in `shutdown`, which exits yetty - only play it against a
# dedicated instance.

config:
  defaults:
    typing:
      avg-speed: 90
      speed-deviation: 0.1
      avg-typo: 0.0

script:
  - sleep: 0.6

  - type: '# the wordmark - an image, rendered inline in the terminal'
  - special-char: ENTER
  - sleep: 0.1
  - type: 'ycat -w 150 wordmark.png'
  - sleep: 0.18
  - special-char: ENTER
  - sleep: 1
  - sleep: 0.4
  - mouse-move: { x: 12, y: 55 }
  - sleep: 0.05
  - mouse-scroll: { x: 12, y: 55, dy: 1, mods: 0 }
  - sleep: 0.03
  - mouse-scroll: { x: 12, y: 55, dy: 1, mods: 0 }
  - sleep: 0.03
  - mouse-scroll: { x: 12, y: 55, dy: 1, mods: 0 }

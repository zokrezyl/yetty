# Clip: a real PDF rendered inside terminal scrollback.
#
# ~25 second social/README clip. The hook is a single command — `ycat
# report.pdf` — after which a 3-page report (charts, heatmap, title page)
# lives in the scrolling layer like any other output: the viewer scrolls
# up through the pages with the mouse wheel, zooms into the title page
# (Ctrl+scroll, vector-sharp), then drops back to the prompt for the end
# card. Ends with `shutdown` so a --record MP4 is finalized cleanly.
#
# WARNING: the last step is `shutdown` — it exits the yetty it runs
# against. Only play this against a dedicated recording instance.
#
# One-shot recording (from the repo root):
#
#   ./demo/scripts/yctl/clips/pdf-in-scrollback.sh
#   # -> tmp/clips/pdf-in-scrollback/pdf-in-scrollback.mp4
#
# The wrapper stages report.pdf in a scratch working directory (default:
# demo/assets/ypdf/report.pdf, regenerated by demo/assets/ypdf/make-report.py;
# override with REPORT_PDF=<path>), launches a dedicated yetty with
# --record and the build's ycat on PATH — which is why the typed command
# below is a clean `ycat report.pdf` with no build paths on screen — then
# plays this file. See demo/scripts/yctl/clips/_record-common.sh.
#
# Geometry: tuned on a ~1680x930 window. The report pages are 16:9 and
# render near full terminal width, so one page fills roughly one screen;
# the scroll-up traverses about two and a half screens of content. The
# Ctrl+scroll zoom anchor parks at the top-left inside the page (x=5,
# y=110) — zoom grows content away from the anchor, keeping the page
# centered in the magnified view.

config:
  defaults:
    typing:
      avg-speed: 13        # human command-typing pace
      speed-deviation: 0.25
      avg-typo: 0.0        # keep runs deterministic; no simulated typos

script:
  # A couple of calm frames at the prompt, then the command starts —
  # the first thing a viewer sees is the hook being typed.
  - sleep: 0.4

  - type: "ycat report.pdf"
  - special-char: ENTER
  - sleep: 3.0             # pdfio decodes; three pages land in scrollback

  # Cruise up through the report with the mouse wheel: page 3 (capacity
  # charts) -> page 2 (telemetry) -> page 1 (title). Continuous ticks
  # read as one smooth scroll.
  - mouse-move: { x: 840, y: 460 }
  - sleep: 0.2

  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.7             # pause: telemetry charts page in view

  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 0.09
  - mouse-scroll: { x: 840, y: 460, dy: 4 }
  - sleep: 1.4             # hold: title page in view

  # Zoom into the title page: park the anchor first — Ctrl+scroll zooms
  # around the cursor position, so every tick must share the same (x, y).
  - mouse-move: { x: 5, y: 110 }
  - sleep: 0.2

  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: 1, mods: 2 }
  - sleep: 1.3             # hold: vector-sharp title at high zoom

  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.07
  - mouse-scroll: { x: 5, y: 110, dy: -1, mods: 2 }
  - sleep: 0.4

  # Fast drop back to the prompt.
  - mouse-move: { x: 840, y: 460 }
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.06
  - mouse-scroll: { x: 840, y: 460, dy: -6 }
  - sleep: 0.6

  # Narration + end card — faster than command-typing so it reads.
  - type:
      text: "# a real PDF, scrolling with your shell history"
      avg-speed: 22
  - special-char: ENTER
  - sleep: 0.4

  - type:
      text: "# github.com/zokrezyl/yetty | yetty.dev"
      avg-speed: 22
  - special-char: ENTER
  - sleep: 2.5

  - shutdown: ~

# Clip: feature zoom tour - each Yetty figure zoomed to fill the frame.
#
# GENERATED by scratchpad/gen-zoom-tour.py (kept there; re-run to regenerate).
# Per figure: type a clean command, let it render, then Ctrl+mouse-wheel soft
# zoom (the shader visual zoom - non-intrusive, does not reflow) to fill the
# frame, hold, zoom back out, clear. This is the pres.gif-style hero-shot
# format: every figure gets a full-frame moment instead of sitting small in a
# sea of black.
#
# WARNING: ends in `shutdown` - only play against a dedicated recording
# instance. Record with: ./demo/scripts/yctl/clips/feature-zoom-tour.sh
#
# The wrapper stages every asset into the recording cwd and puts the tools on
# PATH, so the typed commands stay clean (no build paths on screen).

config:
  defaults:
    typing:
      avg-speed: 26
      speed-deviation: 0.15
      avg-typo: 0.0


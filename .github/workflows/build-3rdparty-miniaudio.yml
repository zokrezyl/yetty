name: Build 3rdparty — miniaudio

# miniaudio (mackron/miniaudio) — single-header public-domain (MIT-0)
# audio I/O. Platform-independent (.noarch) — one tarball serves every
# yetty target; per-platform backend selection happens inside the header
# at compile time. Triggered on `lib-miniaudio-<version>` tags. Version
# source of truth: build-tools/3rdparty/miniaudio/version.

on:
  push:
    tags:
      - 'lib-miniaudio-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/3rdparty/miniaudio/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="lib-miniaudio-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=lib-miniaudio-$V" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - run: mkdir -p out
      - run: |
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/miniaudio/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/miniaudio-*.tar.gz
          fail_on_unmatched_files: true

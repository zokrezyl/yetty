name: Build 3rdparty — ngtcp2

# Triggered on `lib-ngtcp2-<version>` tags. Native build across the
# 5-target QUIC matrix (linux x86_64/aarch64/riscv64, macos arm64/x86_64).
# linux-riscv64 runs inside riscv64/debian:trixie-slim under QEMU since GitHub
# has no native riscv64 runner; everything else runs on a native runner.
# No Nix.

on:
  push:
    tags: ['lib-ngtcp2-*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/3rdparty/ngtcp2/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="lib-ngtcp2-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=lib-ngtcp2-$V" >> "$GITHUB_OUTPUT"

  build-linux-x86_64:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config
      - run: mkdir -p out
      - run: |
          TARGET_PLATFORM="linux-x86_64" OUTPUT_DIR="$PWD/out" \
            ./build-tools/3rdparty/ngtcp2/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/ngtcp2-linux-x86_64-*.tar.gz
          fail_on_unmatched_files: true

  build-linux-aarch64:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config
      - run: mkdir -p out
      - run: |
          TARGET_PLATFORM="linux-aarch64" OUTPUT_DIR="$PWD/out" \
            ./build-tools/3rdparty/ngtcp2/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/ngtcp2-linux-aarch64-*.tar.gz
          fail_on_unmatched_files: true

  build-linux-riscv64:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - run: mkdir -p out
      - name: Build ngtcp2 in riscv64/debian:trixie-slim (via QEMU)
        run: |
          docker run --rm --platform linux/riscv64 \
            -v "$PWD:/work" -w /work \
            -e TARGET_PLATFORM=linux-riscv64 \
            -e OUTPUT_DIR=/work/out \
            riscv64/debian:trixie-slim \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y --no-install-recommends \
                build-essential autoconf automake libtool pkg-config \
                curl ca-certificates tar gzip
              ./build-tools/3rdparty/ngtcp2/build.sh
            '
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/ngtcp2-linux-riscv64-*.tar.gz
          fail_on_unmatched_files: true

  build-macos-arm64:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool pkg-config
      - run: mkdir -p out
      - run: |
          TARGET_PLATFORM="macos-arm64" OUTPUT_DIR="$PWD/out" \
            ./build-tools/3rdparty/ngtcp2/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/ngtcp2-macos-arm64-*.tar.gz
          fail_on_unmatched_files: true

  build-macos-x86_64:
    needs: resolve
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool pkg-config
      - run: mkdir -p out
      - run: |
          TARGET_PLATFORM="macos-x86_64" OUTPUT_DIR="$PWD/out" \
            ./build-tools/3rdparty/ngtcp2/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/ngtcp2-macos-x86_64-*.tar.gz
          fail_on_unmatched_files: true

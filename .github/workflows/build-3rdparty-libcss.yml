name: Build 3rdparty — libcss

# Triggered on `lib-libcss-<version>` tags. Builds NetSurf's
# MIT-licensed CSS cascade (libcss + libparserutils + libwapcaplet)
# standalone — without the GPL'd NetSurf browser core that the
# netsurf 3rdparty package drags in.
#
# Matrix mirrors netsurf's. The upstream NetSurf buildsystem is
# Unix-make-only; for windows-MSVC / webasm / android / iOS / tvOS the
# per-platform _build.sh writes a placeholder tarball carrying only an
# UNSUPPORTED marker, which the consumer-side
# build-tools/cmake/libs/libcss.cmake detects and silently skips.
#
# Version source of truth: build-tools/3rdparty/libcss/version (the
# libcss version itself; libparserutils + libwapcaplet + buildsystem
# versions are pinned inside _build.sh and bumped alongside).

on:
  push:
    tags:
      - 'lib-libcss-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/3rdparty/libcss/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="lib-libcss-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=lib-libcss-$V" >> "$GITHUB_OUTPUT"

  # Linux native + linux-riscv64 cross. Apt installs the NetSurf
  # buildsystem deps (gcc, make, perl, pkg-config, flex/bison/gperf).
  # linux-aarch64 runs natively on GitHub's ARM64 runner; linux-riscv64 is
  # the only linux target that cross-compiles (no native riscv runner).
  # android-* / webasm hit the _build.sh UNSUPPORTED placeholder (NetSurf's
  # GNU-make doesn't honour CC/HOST cleanly for those triples); we still
  # publish a tarball so the consumer-side fetch resolves and falls back
  # to the lexbor-CSS path.
  build-linux:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            cross_pkgs: ""
          - target: linux-riscv64
            runner: ubuntu-latest
            cross_pkgs: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu"
          - target: android-arm64-v8a
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: android-x86_64
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: webasm
            runner: ubuntu-latest
            cross_pkgs: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential perl pkg-config \
            flex bison gperf \
            curl ca-certificates \
            ${{ matrix.cross_pkgs }}
      - run: mkdir -p out
      - name: Build libcss for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/libcss/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/libcss-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-darwin-arm64:
    needs: resolve
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-arm64
          - ios-arm64
          - tvos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config flex bison gperf
      - run: mkdir -p out
      - name: Build libcss for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/libcss/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/libcss-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-darwin-x86_64:
    needs: resolve
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-x86_64
          - ios-x86_64
          - tvos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config flex bison gperf
      - run: mkdir -p out
      - name: Build libcss for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/libcss/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/libcss-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  # Windows: native MSVC under vcvarsall x64. NetSurf's buildsystem is
  # Unix-make-only, so windows-x86_64 hits the _build.sh placeholder
  # branch — the matrix entry exists for shape parity with the other
  # 3rdparty workflows.
  build-windows:
    needs: resolve
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build libcss for ${{ matrix.target }}
        shell: cmd
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        # windows-latest rotates the Visual Studio install root (2022 →
        # "18"/2026 with the win25-vs2026 image), so a hardcoded
        # vcvarsall.bat path breaks on every image bump. vswhere sits at
        # a stable path and resolves the latest install carrying the VC
        # toolchain, whatever the year/edition directory is called.
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL_DIR=%%i"
          if not defined VS_INSTALL_DIR (echo vswhere: no Visual Studio with the VC x64 toolchain found & exit /b 1)
          call "%VS_INSTALL_DIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          mkdir out 2>nul

          bash -c "OUTPUT_DIR=\"$(pwd)/out\" ./build-tools/3rdparty/libcss/build.sh"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/libcss-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

name: Build yetty-tools-riscv

# Builds the riscv64 demos+tools and packs them, together with a clean
# `git archive HEAD` of the source tree, into an ext4 disk image
# (yetty-riscv-disk.img + brotli q6 .img.br). Triggered on
# `yetty-tools-riscv-<version>` tags; <version> source of truth lives at
# build-tools/yemu/yetty-tools-riscv/version (e.g. 0.0.10).
#
# Output asset (uploaded to the GitHub release): yetty-tools-riscv-<version>.tar.gz
# containing the .img.br plus a manifest. A later step in the main yetty
# build will fetch this asset to mount the disk at runtime alongside the
# kernel + rootfs.
#
# Build path: ubuntu-latest with apt-installed riscv64 cross toolchain
# (gcc-riscv64-linux-gnu) — the existing Makefile target invokes the
# `riscv64-linux-gnu-` prefix directly, so no nix shell is needed here.

on:
  push:
    tags:
      - 'yetty-tools-riscv-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/yemu/yetty-tools-riscv/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="yetty-tools-riscv-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=yetty-tools-riscv-$V" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git archive HEAD` inside make-riscv-disk.sh
          # produces the same tree as a developer's local checkout.
          fetch-depth: 0

      - name: Install riscv64 cross toolchain + disk tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          # gcc-riscv64-linux-gnu / g++-riscv64-linux-gnu  — cross compiler
          # cmake / ninja-build / pkg-config              — build driver
          # e2fsprogs                                      — mke2fs / e2fsck
          #                                                  / resize2fs / dumpe2fs
          # brotli                                         — image compression
          sudo apt-get install -y \
              gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
              cmake ninja-build pkg-config \
              e2fsprogs brotli

      - name: Build + package
        run: |
          mkdir -p out
          OUTPUT_DIR="$PWD/out" \
              ./build-tools/yemu/yetty-tools-riscv/build.sh

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.tag }}
          path: out/yetty-tools-riscv-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/yetty-tools-riscv-*.tar.gz
          fail_on_unmatched_files: true

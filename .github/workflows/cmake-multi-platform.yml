    if: ${{ !cancelled() && needs.read-flags.outputs.tvos_x86_64 == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: macos-15-intel


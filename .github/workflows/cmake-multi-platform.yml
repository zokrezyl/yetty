# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    tags:
      # Main yetty release tags only. Prebuilt 3rdparty (libs + assets)
      # use their own `lib-<name>-*` namespaces, handled by the per-lib
      # build-3rdparty-<name>.yml workflows; those don't trigger the
      # main multi-platform build.
      - 'yetty-[0-9]+.[0-9]+.[0-9]+'
    branches:
      - '**'

# =============================================================================
# BUILD FLAGS - Set to true to enable specific builds (tags always build all)
# =============================================================================
env:
  BUILD_LINUX: false
  BUILD_LINUX_ASAN: false
  BUILD_LINUX_AARCH64: false
  BUILD_MACOS: false
  BUILD_MACOS_X86_64: false
  BUILD_WINDOWS: false
  BUILD_ANDROID: false
  BUILD_ANDROID_X86_64: false
  BUILD_IOS: false
  BUILD_IOS_X86_64: false
  BUILD_TVOS: false
  BUILD_TVOS_X86_64: false
  BUILD_WEB: false

  # Merged riscv64 rootfs (alpine-extended + /yetty/{bin,repo}). All
  # per-platform binaries fetch this as a runtime asset; disable for
  # fast iteration when you only care about a non-VM code path. Always
  # built on release tags regardless of this flag.
  BUILD_ROOTFS_RISCV: false

  RUN_CODEQL: false
  RUN_CODACY: false

  TEST_ANDROID: false

jobs:
  # =============================================================================
  # Read build flags (required because env context not available in job-level if)
  # =============================================================================
  read-flags:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.set.outputs.linux }}
      linux_asan: ${{ steps.set.outputs.linux_asan }}
      linux_aarch64: ${{ steps.set.outputs.linux_aarch64 }}
      macos: ${{ steps.set.outputs.macos }}
      macos_x86_64: ${{ steps.set.outputs.macos_x86_64 }}
      windows: ${{ steps.set.outputs.windows }}
      android: ${{ steps.set.outputs.android }}
      android_x86_64: ${{ steps.set.outputs.android_x86_64 }}
      ios: ${{ steps.set.outputs.ios }}
      ios_x86_64: ${{ steps.set.outputs.ios_x86_64 }}
      tvos: ${{ steps.set.outputs.tvos }}
      tvos_x86_64: ${{ steps.set.outputs.tvos_x86_64 }}
      web: ${{ steps.set.outputs.web }}
      rootfs_riscv: ${{ steps.set.outputs.rootfs_riscv }}
      codeql: ${{ steps.set.outputs.codeql }}
      codacy: ${{ steps.set.outputs.codacy }}
      test_android: ${{ steps.set.outputs.test_android }}
    steps:
      - id: set
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "linux_asan=true" >> $GITHUB_OUTPUT
            echo "linux_aarch64=true" >> $GITHUB_OUTPUT
            echo "macos=true" >> $GITHUB_OUTPUT
            echo "macos_x86_64=true" >> $GITHUB_OUTPUT
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "android=true" >> $GITHUB_OUTPUT
            echo "android_x86_64=true" >> $GITHUB_OUTPUT
            echo "ios=true" >> $GITHUB_OUTPUT
            echo "ios_x86_64=true" >> $GITHUB_OUTPUT
            echo "tvos=true" >> $GITHUB_OUTPUT
            echo "tvos_x86_64=true" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
            echo "rootfs_riscv=true" >> $GITHUB_OUTPUT
            echo "codeql=false" >> $GITHUB_OUTPUT
            echo "codacy=false" >> $GITHUB_OUTPUT
            echo "test_android=true" >> $GITHUB_OUTPUT
          else
            echo "linux=${{ env.BUILD_LINUX }}" >> $GITHUB_OUTPUT
            echo "linux_asan=${{ env.BUILD_LINUX_ASAN }}" >> $GITHUB_OUTPUT
            echo "linux_aarch64=${{ env.BUILD_LINUX_AARCH64 }}" >> $GITHUB_OUTPUT
            echo "macos=${{ env.BUILD_MACOS }}" >> $GITHUB_OUTPUT
            echo "macos_x86_64=${{ env.BUILD_MACOS_X86_64 }}" >> $GITHUB_OUTPUT
            echo "windows=${{ env.BUILD_WINDOWS }}" >> $GITHUB_OUTPUT
            echo "android=${{ env.BUILD_ANDROID }}" >> $GITHUB_OUTPUT
            echo "android_x86_64=${{ env.BUILD_ANDROID_X86_64 }}" >> $GITHUB_OUTPUT
            echo "ios=${{ env.BUILD_IOS }}" >> $GITHUB_OUTPUT
            echo "ios_x86_64=${{ env.BUILD_IOS_X86_64 }}" >> $GITHUB_OUTPUT
            echo "tvos=${{ env.BUILD_TVOS }}" >> $GITHUB_OUTPUT
            echo "tvos_x86_64=${{ env.BUILD_TVOS_X86_64 }}" >> $GITHUB_OUTPUT
            echo "web=${{ env.BUILD_WEB }}" >> $GITHUB_OUTPUT
            echo "rootfs_riscv=${{ env.BUILD_ROOTFS_RISCV }}" >> $GITHUB_OUTPUT
            echo "codeql=${{ env.RUN_CODEQL }}" >> $GITHUB_OUTPUT
            echo "codacy=${{ env.RUN_CODACY }}" >> $GITHUB_OUTPUT
            echo "test_android=${{ env.TEST_ANDROID }}" >> $GITHUB_OUTPUT
          fi


  # =============================================================================
  # Merged riscv64 rootfs image — every executable build below gates on
  # this so we never ship a platform binary against a stale or broken
  # /yetty/{bin,repo} payload. Reusable-workflow call: build.sh runs in
  # the called workflow, the tarball is exposed as a workflow artifact
  # consumers can fetch when consumer-side wiring lands.
  # =============================================================================
  build-rootfs-riscv:
    needs: read-flags
    if: needs.read-flags.outputs.rootfs_riscv == 'true'
    uses: ./.github/workflows/build-yetty-rootfs-riscv.yml
    permissions:
      contents: write

  # =============================================================================
  # Desktop Build (Linux)
  # =============================================================================
  build-linux-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.linux == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build-desktop-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          automake autoconf libtool \
          meson ninja-build nasm \
          brotli \
          libfontconfig1-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libx11-dev \
          libgl1-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libwebp-dev \
          clang-20 llvm-20-dev libclang-20-dev

    - name: Build Linux
      run: make build-desktop-ytrace-release

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-linux
        # Ship the self-contained installer, not the bare yetty binary: it
        # carries yetty + ygreeter + companion tools + all assets as an
        # embedded payload and unpacks them on first run. A raw `yetty` has no
        # assets and no companion tools, so it is useless as a release asset.
        path: ${{ env.BUILD_DIR }}/tools/yinstall/yinstall
        if-no-files-found: error

  # =============================================================================
  # Linux ASAN Build (AddressSanitizer)
  # =============================================================================
  build-linux-ytrace-asan:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.linux_asan == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build-desktop-ytrace-asan

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          automake autoconf libtool \
          meson ninja-build nasm \
          brotli \
          libfontconfig1-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libx11-dev \
          libgl1-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libwebp-dev \
          clang-20 llvm-20-dev libclang-20-dev

    - name: Build with ASAN
      run: make build-desktop-ytrace-asan

    - name: Run ASAN smoke test
      run: |
        printf 'leak:_glfwConnectX11\nleak:glfwInit\n' > lsan_suppressions.txt
        export ASAN_OPTIONS="detect_leaks=1:halt_on_error=0:log_path=asan_log"
        export LSAN_OPTIONS="suppressions=$(pwd)/lsan_suppressions.txt"
        timeout 10 ./${{ env.BUILD_DIR }}/yetty -e 'echo "ASAN smoke test"; exit 0' || true
        # LSAN writes asan_log.* even when every leak is matched by a
        # suppression (it still prints the "Suppressions used:" summary).
        # Treat the run as failing only when the log carries a real
        # diagnostic marker — `ERROR: AddressSanitizer`, `SUMMARY:
        # AddressSanitizer`, or a "Direct/Indirect leak of N bytes"
        # header. Pure suppression summaries don't count.
        if ls asan_log.* 1>/dev/null 2>&1; then
          if grep -qE '^(==[0-9]+==)?(ERROR|SUMMARY): AddressSanitizer|^(Direct|Indirect) leak of [0-9]+ byte' asan_log.*; then
            echo "=== ASAN ERRORS DETECTED ==="
            cat asan_log.*
            exit 1
          else
            echo "ASAN log present but only contains suppressed-leak summary — OK"
            cat asan_log.*
          fi
        else
          echo "No ASAN log produced"
        fi

  # =============================================================================
  # Linux aarch64 — built natively on a GitHub-hosted ARM64 runner.
  # No cross-compile, no nix, no foreign-arch apt. Produces real ARM aarch64
  # ELFs ready to run on a Raspberry-Pi-class board or aarch64 Linux server.
  # riscv64 builds live in a separate pipeline.
  # =============================================================================
  build-linux-aarch64-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.linux_aarch64 == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm

    env:
      BUILD_DIR: build-desktop-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          automake autoconf libtool \
          meson ninja-build nasm \
          brotli \
          libfontconfig1-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libx11-dev \
          libgl1-mesa-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libwebp-dev \
          clang-20 llvm-20-dev libclang-20-dev

    - name: Build Linux aarch64 (native)
      run: make build-desktop-ytrace-release

    - name: Upload Linux aarch64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-linux-aarch64
        # Ship the self-contained installer, not the bare yetty binary: it
        # carries yetty + ygreeter + companion tools + all assets as an
        # embedded payload and unpacks them on first run. A raw `yetty` has no
        # assets and no companion tools, so it is useless as a release asset.
        path: ${{ env.BUILD_DIR }}/tools/yinstall/yinstall
        if-no-files-found: error

  # =============================================================================
  # Desktop Build (macOS ARM64)
  # =============================================================================
  build-macos-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.macos == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: macos-latest

    env:
      BUILD_DIR: build-macos-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install macOS dependencies
      run: brew install automake autoconf libtool meson ninja nasm brotli webp fontconfig

    - name: Configure CMake
      env:
        # brew installs to /opt/homebrew (arm64) or /usr/local (x86_64) —
        # neither is on Apple clang's default linker search path, so a
        # bare `-lfontconfig` from pkg-config fails to link. Add the brew
        # prefix to CMAKE_PREFIX_PATH (so find_package picks it up) and
        # to PKG_CONFIG_PATH (so pkg_check_modules emits the right
        # -L<brew>/lib). LIBRARY_PATH is belt-and-braces for tools that
        # bypass cmake.
        PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        LIBRARY_PATH: /opt/homebrew/lib
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH=/opt/homebrew
        -DYETTY_ENABLE_TOOL_QA=OFF
        -S ${{ github.workspace }}

    - name: Build
      env:
        LIBRARY_PATH: /opt/homebrew/lib
      run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 4

    - name: Upload macOS ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-macos
        # Ship the self-contained installer, not the bare yetty binary: it
        # carries yetty + ygreeter + companion tools + all assets as an
        # embedded payload and unpacks them on first run. A raw `yetty` has no
        # assets and no companion tools, so it is useless as a release asset.
        path: ${{ env.BUILD_DIR }}/tools/yinstall/yinstall
        if-no-files-found: error

  # =============================================================================
  # Desktop Build (macOS Intel x86_64)
  # =============================================================================
  build-macos_x86_64-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.macos_x86_64 == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: macos-15-intel

    env:
      BUILD_DIR: build-macos_x86_64-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install macOS dependencies
      run: brew install automake autoconf libtool meson ninja nasm brotli webp fontconfig

    - name: Configure CMake
      env:
        # brew on Intel macOS lives under /usr/local — add it to
        # CMAKE_PREFIX_PATH / PKG_CONFIG_PATH so cmake's find_package +
        # pkg-config probes pick up fontconfig etc. and emit
        # `-L/usr/local/lib` so the linker can find them.
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
        LIBRARY_PATH: /usr/local/lib
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH=/usr/local
        -DYETTY_ENABLE_TOOL_QA=OFF
        -S ${{ github.workspace }}

    - name: Build
      env:
        LIBRARY_PATH: /usr/local/lib
      run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 4

    - name: Upload macOS x86_64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-macos-x86_64
        # Ship the self-contained installer, not the bare yetty binary: it
        # carries yetty + ygreeter + companion tools + all assets as an
        # embedded payload and unpacks them on first run. A raw `yetty` has no
        # assets and no companion tools, so it is useless as a release asset.
        path: ${{ env.BUILD_DIR }}/tools/yinstall/yinstall
        if-no-files-found: error

  # =============================================================================
  # Desktop Build (Windows)
  # =============================================================================
  build-windows-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.windows == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: windows-latest

    env:
      BUILD_DIR: build-windows-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install Windows build dependencies
      shell: bash
      run: |
        choco install nasm -y
        choco install make -y
        pip install meson

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DWEBGPU_BACKEND=dawn
        -DYETTY_ENABLE_TOOL_QA=OFF
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

    - name: Stage Windows runtime
      shell: pwsh
      run: |
        $BuildDir = "${{ env.BUILD_DIR }}"
        $StageDir = "${{ github.workspace }}/yetty-windows"
        New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

        # The Windows release ships exactly one thing: yinstall.exe. It is the
        # self-contained installer that carries the entire yetty product — the
        # terminal, the companion tools, the DirectX runtime DLLs, shaders,
        # fonts, config, the demo tree and the RISC-V VM runtime — as an
        # embedded payload, and unpacks each piece to the right per-user
        # location on first run. Nothing else belongs in the archive: shipping
        # loose yetty.exe / DLLs / demos alongside it would just duplicate what
        # is already inside yinstall. install.ps1 downloads this archive, finds
        # yinstall.exe and runs it.
        #
        # Handle both the Ninja layout (tools/yinstall/yinstall.exe) and the VS
        # multi-config layout (tools/yinstall/Release/yinstall.exe).
        $YinstallExe = @(
            "$BuildDir/tools/yinstall/yinstall.exe",
            "$BuildDir/tools/yinstall/Release/yinstall.exe"
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $YinstallExe) {
            Write-Error "yinstall.exe not found under $BuildDir/tools/yinstall"
            exit 1
        }
        Copy-Item $YinstallExe -Destination $StageDir
        Write-Host "Staged $(Split-Path $YinstallExe -Leaf) ($([math]::Round((Get-Item $YinstallExe).Length/1MB,1)) MB)"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-windows
        path: ${{ github.workspace }}/yetty-windows/
        if-no-files-found: warn

  # =============================================================================
  # Android Build
  # =============================================================================
  build-android-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.android == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build-android-ytrace-release
      ANDROID_NDK_VERSION: 26.1.10909125

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ninja-build \
          cmake \
          pkg-config \
          python3 \
          patch \
          brotli \
          curl \
          unzip \
          ca-certificates \
          git

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
      run: |
        echo "y" | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" >/dev/null
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Create debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -v -keystore ~/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Android APKs (yetty + ygreeter flavors)
      run: make build-android-ytrace-release

    - name: Upload yetty terminal APK
      uses: actions/upload-artifact@v4
      with:
        name: yetty-android-apk
        path: ${{ env.BUILD_DIR }}/app/outputs/apk/yetty/release/*.apk
        if-no-files-found: warn

    - name: Upload ygreeter showcase APK
      uses: actions/upload-artifact@v4
      with:
        name: ygreeter-android-apk
        path: ${{ env.BUILD_DIR }}/app/outputs/apk/ygreeter/release/*.apk
        if-no-files-found: warn

  # =============================================================================
  # Android x86_64 Build (for Emulator Testing)
  # =============================================================================
  build-android_x86_64-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.android_x86_64 == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build-android_x86_64-ytrace-release
      ANDROID_NDK_VERSION: 26.1.10909125

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ninja-build \
          cmake \
          pkg-config \
          python3 \
          patch \
          brotli \
          curl \
          unzip \
          ca-certificates \
          git

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
      run: |
        echo "y" | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" >/dev/null
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Create debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -v -keystore ~/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Android x86_64 APKs (yetty + ygreeter flavors)
      run: make build-android_x86_64-ytrace-release

    - name: Upload yetty terminal x86_64 APK
      uses: actions/upload-artifact@v4
      with:
        name: yetty-android-x86_64-apk
        path: ${{ env.BUILD_DIR }}/app/outputs/apk/yetty/release/*.apk
        if-no-files-found: warn

    - name: Upload ygreeter showcase x86_64 APK
      uses: actions/upload-artifact@v4
      with:
        name: ygreeter-android-x86_64-apk
        path: ${{ env.BUILD_DIR }}/app/outputs/apk/ygreeter/release/*.apk
        if-no-files-found: warn

  # =============================================================================
  # Android Instrumented Tests (on Emulator)
  # =============================================================================
  test-android:
    needs: [read-flags, build-android_x86_64-ytrace-release]
    if: needs.read-flags.outputs.test_android == 'true' && needs.build-android_x86_64-ytrace-release.result == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: Download yetty terminal x86_64 APK
      uses: actions/download-artifact@v4
      with:
        name: yetty-android-x86_64-apk
        path: apk

    - name: Download ygreeter showcase x86_64 APK
      uses: actions/download-artifact@v4
      with:
        name: ygreeter-android-x86_64-apk
        path: apk-ygreeter

    - name: List APK files
      run: ls -la apk/ apk-ygreeter/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Android Emulator Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        profile: Nexus 6
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: |
          # --- yetty terminal smoke test (signed with debug key) ---
          adb install apk/app-yetty-release.apk
          adb shell am start -n com.yetty.terminal/android.app.NativeActivity
          sleep 10
          adb shell pidof com.yetty.terminal || echo "yetty may have crashed"
          # --- ygreeter showcase smoke test (separate APK / package) ---
          adb logcat -c
          adb install apk-ygreeter/app-ygreeter-release.apk
          adb shell am start -n com.yetty.greeter/android.app.NativeActivity
          sleep 10
          adb shell pidof com.yetty.greeter || echo "ygreeter may have crashed"
          # Capture logcat for debugging (500 lines should capture init + runtime)
          echo "=== YETTY/YGREETER LOGS ==="
          adb logcat -d | grep -i yetty | tail -500
          echo "=== WEBGPU/VULKAN LOGS ==="
          adb logcat -d | grep -iE "vulkan|webgpu|dawn|wgpu|adapter|backend" | tail -100

  # =============================================================================
  # iOS Build (arm64 device)
  # =============================================================================
  build-ios-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.ios == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: macos-latest

    env:
      BUILD_DIR: build-ios-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install macOS dependencies
      run: brew install automake autoconf libtool ninja nasm brotli meson webp fontconfig

    - name: Configure CMake for iOS
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -G Ninja
        -DCMAKE_SYSTEM_NAME=iOS
        -DCMAKE_OSX_ARCHITECTURES=arm64
        -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
        -DCMAKE_BUILD_TYPE=Release
        -DYETTY_IOS=ON
        -DYETTY_ENABLE_TOOL_QA=OFF
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 4

    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-ios
        path: ${{ env.BUILD_DIR }}/yetty.app
        if-no-files-found: warn

  # =============================================================================
  # iOS x86_64 Build (for Simulator)
  # =============================================================================

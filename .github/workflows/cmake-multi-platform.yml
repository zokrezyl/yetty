  # =============================================================================
  # WebAssembly Build
  # =============================================================================
  build-webasm-ytrace-release:
    needs: [read-flags, build-rootfs-riscv]
    if: ${{ !cancelled() && needs.read-flags.outputs.web == 'true' && (needs.build-rootfs-riscv.result == 'success' || needs.build-rootfs-riscv.result == 'skipped') }}
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build-webasm-ytrace-release

    steps:
    - uses: actions/checkout@v4

    - name: Stage merged rootfs
      uses: ./.github/actions/stage-rootfs-riscv
      with:
        artifact-name: ${{ needs.build-rootfs-riscv.result == 'success' && needs.build-rootfs-riscv.outputs.tag || '' }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ninja-build \
          cmake \
          pkg-config \
          python3 \
          patch \
          brotli \
          curl \
          unzip \
          ca-certificates \
          git \
          nodejs

    - name: Install Emscripten SDK
      run: |
        ./build-tools/install-emscripten.sh
        # Export EMSDK + PATH to all subsequent steps. emsdk_env.sh prepends
        # emsdk/upstream/emscripten and friends to PATH and sets EMSDK*.
        # Pull them out into GITHUB_ENV / GITHUB_PATH so the make step picks
        # them up without re-sourcing.
        #
        # NB: `emsdk activate` writes the toolchain config to
        # `$EMSDK/.emscripten`, NOT `$HOME/.emscripten`. emsdk_env.sh does
        # *not* export EM_CONFIG. emcc's default fallback is `~/.emscripten`
        # which doesn't exist on a clean runner — so we point EM_CONFIG at
        # the activated file explicitly.
        set -a
        . "$HOME/.local/emsdk/emsdk_env.sh"
        set +a
        {
          echo "EMSDK=${EMSDK}"
          echo "EMSDK_NODE=${EMSDK_NODE}"
          echo "EMSDK_PYTHON=${EMSDK_PYTHON:-$(command -v python3)}"
          echo "EM_CONFIG=${EM_CONFIG:-$HOME/.local/emsdk/.emscripten}"
        } >> "$GITHUB_ENV"
        {
          echo "$HOME/.local/emsdk"
          echo "$HOME/.local/emsdk/upstream/emscripten"
        } >> "$GITHUB_PATH"
        emcc --version | head -1

    - name: Build WebAssembly
      run: make build-webasm-ytrace-release

    - name: Prepare site directory
      run: |
        mkdir -p site
        cp ${{ env.BUILD_DIR }}/index.html site/
        # terminal.html — the per-instance terminal page the tabbed
        # index.html shell embeds (one iframe = one wasm module).
        cp ${{ env.BUILD_DIR }}/terminal.html site/
        cp ${{ env.BUILD_DIR }}/yetty.js site/
        cp ${{ env.BUILD_DIR }}/yetty.wasm site/
        cp ${{ env.BUILD_DIR }}/yetty.data site/
        # ygreeter — the ygui feature-showcase app, built alongside yetty
        # (build-tools/yetty/platform/webasm/cmake.cmake). It reuses the same
        # yetty-assets/ preload dir copied below, so only its own three files
        # need staging here or the picker's showcase link 404s.
        cp ${{ env.BUILD_DIR }}/ygreeter.html site/
        cp ${{ env.BUILD_DIR }}/ygreeter.js site/
        cp ${{ env.BUILD_DIR }}/ygreeter.wasm site/
        cp ${{ env.BUILD_DIR }}/favicon.ico site/
        cp ${{ env.BUILD_DIR }}/apple-touch-icon.jpg site/
        cp ${{ env.BUILD_DIR }}/tinyemu-iframe.html site/
        cp ${{ env.BUILD_DIR }}/tinyemu.js site/
        cp ${{ env.BUILD_DIR }}/tinyemu.wasm site/
        cp -r ${{ env.BUILD_DIR }}/tinyemu-assets site/
        cp -r ${{ env.BUILD_DIR }}/yetty-assets site/
        # Installer bootstrap scripts — served at yetty.dev/install.sh and
        # yetty.dev/install.ps1. Each downloads the yinstall installer for the
        # visitor's platform from the latest GitHub release and runs it:
        #   curl -fsSL https://yetty.dev/install.sh | bash
        #   irm https://yetty.dev/install.ps1 | iex
        cp build-tools/install/install.sh site/
        cp build-tools/install/install.ps1 site/
        du -sh site/* | sort -h

    - name: Upload WebAssembly artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yetty-webasm
        path: site/
        if-no-files-found: error

  # =============================================================================
  # Deploy to GitHub Pages
  # =============================================================================
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [read-flags, build-webasm-ytrace-release]
    if: |
      always() &&
      needs.build-webasm-ytrace-release.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: yetty-webasm
        path: site

    - name: List site contents
      run: |
        echo "=== Site structure ==="
        ls -la site/
        du -sh site/* | sort -h

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # =============================================================================
  # Upload to GitHub Release (per-platform, independent)
  # =============================================================================
  release-linux:
    runs-on: ubuntu-latest
    needs: build-linux-ytrace-release
    if: needs.build-linux-ytrace-release.result == 'success' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: yetty-linux
        path: yetty-linux
    - name: Create archive
      # upload-artifact strips the Unix executable bit, so the downloaded
      # yinstall comes back as 0644. Re-apply +x before archiving so users
      # can run it straight after `tar -xzf` without a manual chmod.
      run: |
        chmod +x yetty-linux/yinstall
        tar -czvf yetty-linux.tar.gz -C yetty-linux .
    - uses: softprops/action-gh-release@v2
      with:
        files: yetty-linux.tar.gz


name: Build 3rdparty — openssh

# Triggered on `lib-openssh-<version>` tags. Builds openssh-portable across
# all platforms; unsupported targets (android, ios, tvos, webasm, windows)
# emit UNSUPPORTED placeholder tarballs for shape parity — the consumer cmake
# is guarded and never fetches those.
#
# Version source of truth: build-tools/3rdparty/openssh/version.
# OpenSSL pin: build-tools/3rdparty/openssl/version (1.1.1w — openssh 9.x
# rejects OpenSSL 4.x; SSH uses its own wire crypto, not TLS).
#
# No nix — toolchain provided by the CI runner (apt / Xcode CommandLineTools).

on:
  push:
    tags:
      - 'lib-openssh-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/3rdparty/openssh/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="lib-openssh-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=lib-openssh-$V" >> "$GITHUB_OUTPUT"

  # Linux native + riscv64 cross + android/webasm placeholders.
  # linux-aarch64 runs natively on GitHub's ARM64 runner.
  # linux-riscv64 cross-compiles via gcc-riscv64-linux-gnu.
  # android-* / webasm emit UNSUPPORTED placeholder tarballs.
  build-linux:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            cross_pkgs: ""
          - target: linux-riscv64
            runner: ubuntu-latest
            cross_pkgs: "gcc-riscv64-linux-gnu"
          - target: android-arm64-v8a
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: android-x86_64
            runner: ubuntu-latest
            cross_pkgs: ""
          - target: webasm
            runner: ubuntu-latest
            cross_pkgs: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates \
            ${{ matrix.cross_pkgs }}
      - run: mkdir -p out
      - name: Build openssh for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/openssh/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/openssh-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-darwin-arm64:
    needs: resolve
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-arm64
          - ios-arm64
          - tvos-arm64
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - name: Build openssh for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/openssh/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/openssh-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-darwin-x86_64:
    needs: resolve
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-x86_64
          - ios-x86_64
          - tvos-x86_64
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - name: Build openssh for ${{ matrix.target }}
        run: |
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/openssh/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/openssh-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-windows:
    needs: resolve
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build openssh for ${{ matrix.target }}
        shell: cmd
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          mkdir out 2>nul
          bash -c "OUTPUT_DIR=\"$(pwd)/out\" ./build-tools/3rdparty/openssh/build.sh"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/openssh-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

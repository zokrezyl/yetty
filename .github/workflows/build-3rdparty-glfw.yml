name: Build 3rdparty — glfw

# Desktop only — yetty's mobile/web builds don't use glfw.

on:
  push:
    tags: ['lib-glfw-*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < build-tools/3rdparty/glfw/version)"
          [ -n "$V" ] || { echo "version file is empty" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            EXPECT="lib-glfw-$V"
            if [ "$REF" != "$EXPECT" ]; then
              echo "tag $REF does not match version file ($EXPECT)" >&2
              exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=lib-glfw-$V" >> "$GITHUB_OUTPUT"

  # Linux native builds — no nix, no cross-compile. linux-x86_64 runs on a
  # plain x86_64 ubuntu runner; linux-aarch64 runs on GitHub's native ARM64
  # runner. Apt installs the GLFW build deps directly. riscv64 glfw is not
  # needed (the riscv yetty build is GPU-less — built by the separate
  # yetty-tools-riscv pipeline).
  build-linux:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            build-essential \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev wayland-protocols libwayland-bin \
            libxkbcommon-dev \
            libgl1-mesa-dev
      - run: mkdir -p out
      - name: Build glfw for ${{ matrix.target }}
        run: |
          USE_NIX=0 \
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/glfw/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/glfw-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  # macOS native — Cocoa backend, no X11/Wayland needed. Xcode CommandLineTools
  # are pre-installed on macos-latest / macos-15-intel runners (clang + ar);
  # cmake/ninja/pkg-config come via brew. No nix.
  build-darwin-arm64:
    needs: resolve
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: { target: [macos-arm64] }
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install cmake ninja pkg-config
      - run: mkdir -p out
      - name: Build glfw for ${{ matrix.target }}
        run: |
          USE_NIX=0 \
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/glfw/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/glfw-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  build-darwin-x86_64:
    needs: resolve
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix: { target: [macos-x86_64] }
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install cmake ninja pkg-config
      - run: mkdir -p out
      - name: Build glfw for ${{ matrix.target }}
        run: |
          USE_NIX=0 \
          TARGET_PLATFORM="${{ matrix.target }}" \
          OUTPUT_DIR="$PWD/out" \
          ./build-tools/3rdparty/glfw/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/glfw-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

  # Windows: native MSVC under vcvarsall x64. Every lib that links into
  # yetty.exe needs MSVC ABI (qemu is the lone mingw exception).
  build-windows:
    needs: resolve
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build glfw for ${{ matrix.target }}
        shell: cmd
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          bash -c "OUTPUT_DIR=\"$(pwd)/out\" ./build-tools/3rdparty/glfw/build.sh"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/glfw-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true

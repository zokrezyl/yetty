name: Build yetty-rootfs-riscv

# Builds the unified riscv64 rootfs image — alpine-extended-disk pristine
# rootfs + /yetty/bin (cross-compiled yetty demos+tools) + /yetty/repo
# (`git archive HEAD`). Replaces the old yetty-tools-riscv pipeline that
# shipped a separate small disk; now everything lives in one bootable
# ext4 image.
#
# Trigger:
#   - `yetty-rootfs-riscv-<version>` tags (push)        -> publish release
#   - workflow_dispatch                                  -> manual run
#   - workflow_call (from cmake-multi-platform.yml)      -> gate per-
#                                                          platform builds
#
# Version source of truth: build-tools/yemu/yetty-rootfs-riscv/version.
# Output asset (uploaded to the GitHub release on tagged runs):
#   yetty-rootfs-riscv-<version>.tar.gz
#     - yetty-rootfs-riscv.img.br  (brotli q6 of the merged ext4 image)
#     - manifest.txt

on:
  # Driven exclusively by the parent yetty pipeline (cmake-multi-platform.yml
  # → workflow_call) or by an explicit manual dispatch. The rootfs version
  # tracks yetty's X.Y.Z release tag; there is no `yetty-rootfs-riscv-*`
  # tag namespace to push directly anymore.
  workflow_dispatch: {}
  workflow_call:
    outputs:
      version:
        description: Resolved yetty version (X.Y.Z) the rootfs tracks.
        value: ${{ jobs.resolve.outputs.version }}
      tag:
        description: Asset tag form yetty-rootfs-riscv-<version>.
        value: ${{ jobs.resolve.outputs.tag }}
      artifact:
        description: Workflow-artifact name carrying the rootfs tarball.
        value: ${{ jobs.resolve.outputs.tag }}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` finds the latest yetty-* tag
          # on branch pushes. Tag pushes carry just the tag commit but
          # we use $GITHUB_REF directly in that case.
          fetch-depth: 0
      - id: read
        run: |
          set -euo pipefail
          # Version tracks yetty. Resolution order:
          #   1. refs/tags/yetty-X.Y.Z (tag push, direct or workflow_call):
          #      strip the prefix.
          #   2. otherwise (branch push, workflow_dispatch): derive from
          #      the latest yetty-X.Y.Z tag reachable from HEAD.
          if [[ "$GITHUB_REF" == refs/tags/yetty-[0-9]*.[0-9]*.[0-9]* ]]; then
            V="${GITHUB_REF#refs/tags/yetty-}"
          else
            TAG="$(git describe --tags --abbrev=0 \
                       --match='yetty-[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)"
            if [ -z "$TAG" ]; then
              echo "FATAL: cannot resolve version — no yetty-X.Y.Z tag reachable from HEAD" >&2
              exit 1
            fi
            V="${TAG#yetty-}"
          fi
          [ -n "$V" ] || { echo "resolved version is empty" >&2; exit 1; }
          echo "Resolved yetty-rootfs-riscv version: $V (from $GITHUB_REF)"
          echo "version=$V"                >> "$GITHUB_OUTPUT"
          echo "tag=yetty-rootfs-riscv-$V" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git archive HEAD` inside build.sh produces the
          # same tree as a developer's local checkout.
          fetch-depth: 0

      - name: Install host build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          # gcc-riscv64-linux-gnu / g++-riscv64-linux-gnu  — cross compiler
          # cmake / ninja-build / pkg-config              — driven by `make`
          # e2fsprogs                                      — mke2fs, e2fsck,
          #                                                  resize2fs, dumpe2fs,
          #                                                  debugfs
          # brotli                                         — image compression
          # curl, git                                      — fetch pristine
          #                                                  rootfs + archive HEAD
          sudo apt-get install -y \
              gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
              cmake ninja-build pkg-config \
              e2fsprogs brotli \
              curl git

      - name: Build merged rootfs image
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUTPUT_DIR="$PWD/out" \
              ./build-tools/yemu/yetty-rootfs-riscv/build.sh

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.tag }}
          path: out/yetty-rootfs-riscv-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        # Publish a `yetty-rootfs-riscv-X.Y.Z` release whenever the
        # trigger is a yetty release tag (`yetty-X.Y.Z`, either pushed
        # directly to this workflow or arriving via workflow_call from
        # cmake-multi-platform.yml). The rootfs release tracks yetty's
        # version 1:1 — same SHA, separate tag for the asset namespace.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/yetty-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: out/yetty-rootfs-riscv-*.tar.gz
          fail_on_unmatched_files: true
          # Never claim the repo-wide "latest release" pointer — that
          # belongs to the desktop `yetty-*` release, and install.sh
          # resolves `releases/latest/download/...` against it.
          make_latest: false

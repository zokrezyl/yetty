<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yetty terminal</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f23;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #eee;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        /* Boot console — append-only log of each preload step, the VM
         * attach, and yetty startup phases. Overlay covers the whole
         * instance viewport; closed via the − button or automatically
         * once yetty is running. */
        #yetty-status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Translucent so the user can see the canvas (and yetty
             * booting up) through the boot log. */
            background: rgba(0, 0, 0, 0.55);
            color: #ddd;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.45;
            padding: 0;                      /* children own their padding */
            z-index: 200;
            pointer-events: auto;            /* let the user wheel-scroll the log */
            display: flex;
            flex-direction: column;
        }
        /* Fixed banner above the log: tells the user what's going on.
         * Does NOT scroll with the log. */
        #yetty-status-header {
            flex: 0 0 auto;
            padding: 12px 48px 10px 16px;    /* right padding clears − btn */
            background: rgba(20, 24, 31, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #cfd4d3;
            font-size: 12px;
            line-height: 1.5;
        }
        #yetty-status-header .hint-key {
            color: #6c6;
            font-weight: bold;
        }
        #yetty-status-log {
            overflow-y: auto;
            flex: 1 1 auto;
            min-height: 0;
            padding: 12px 16px 16px 16px;
        }
        /* Custom scrollbar so dark-on-dark stays readable. */
        #yetty-status-log::-webkit-scrollbar { width: 10px; }
        #yetty-status-log::-webkit-scrollbar-track { background: #1a1a2e; }
        #yetty-status-log::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }
        #yetty-status-log::-webkit-scrollbar-thumb:hover { background: #666; }
        #yetty-status .line { white-space: pre-wrap; word-break: break-all; }
        #yetty-status .line.phase { color: #e94560; font-weight: bold; }
        #yetty-status .line.ok    { color: #6c6; }
        #yetty-status .line.err   { color: #f55; font-weight: bold; }
        #yetty-status .line.dim   { color: #888; }
        /* `!important` so the class beats the inline `display:flex`
         * the JS sets on first append. */
        #yetty-status.minimized { display: none !important; }
        #yetty-status-minimize {
            position: absolute;
            top: 6px;
            right: 10px;
            width: 28px;
            height: 28px;
            line-height: 24px;
            text-align: center;
            color: #ddd;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
            pointer-events: auto;
            user-select: none;
            z-index: 1;
        }
        #yetty-status-minimize:hover { background: #e94560; color: #fff; }
        /* Pill-shaped restore button — visible only while the overlay
         * is minimized. Clicking re-expands the overlay. */
        #yetty-status-restore {
            position: fixed;
            top: 8px;
            right: 8px;
            display: none;
            padding: 6px 12px;
            color: #ddd;
            background: rgba(20, 20, 31, 0.92);
            border: 1px solid #444;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            user-select: none;
            z-index: 201;
        }
        #yetty-status-restore.visible { display: block; }
        #yetty-status-restore:hover {
            background: #e94560;
            color: #fff;
            border-color: #e94560;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #status {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }
        #fatal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: min(560px, calc(100vw - 32px));
            text-align: center;
            color: #E0E5E4;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        #fatal code { color: #9FA7A8; }
        /* Abort help dialog — shown whenever a yetty session cannot start
         * (no WebGPU, blocklisted adapter, device failure, wasm abort, …).
         * Gives the user the exact chrome:// pages to open and what to look
         * for. chrome:// URLs are rendered as copy fields, not links,
         * because browsers refuse to navigate to them from page content. */
        #fatal.abort-dialog {
            max-width: min(600px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            text-align: left;
            background: #141A1F;
            border: 1px solid #364A47;
            border-radius: 10px;
            padding: 20px 22px;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .abort-title { color: #74C5A5; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
        .abort-cause { color: #9FA7A8; margin-bottom: 4px; }
        .abort-section-label {
            color: #6BA892;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 16px 0 6px;
            border-top: 1px solid #364A47;
            padding-top: 12px;
        }
        .abort-step { color: #E0E5E4; margin-bottom: 8px; }
        .abort-copy-field { display: flex; gap: 8px; align-items: stretch; margin: 6px 0; }
        .abort-url {
            flex: 1 1 auto;
            min-width: 0;
            background: #0B1014;
            border: 1px solid #364A47;
            border-radius: 6px;
            padding: 8px 10px;
            color: #74C5A5;
            font-size: 12px;
            overflow-x: auto;
            white-space: nowrap;
            user-select: all;
        }
        .abort-copy {
            flex: 0 0 auto;
            background: #6BA892;
            color: #0B1014;
            border: 0;
            border-radius: 6px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .abort-copy:hover { background: #74C5A5; }
        .abort-copy.copied { background: #5A8979; color: #E0E5E4; }
        .abort-hint { color: #556162; font-size: 12px; margin: 4px 0; }
        .abort-hint code, .abort-step code, .abort-cause code { color: #9FA7A8; }
        .abort-diag { margin-top: 16px; border-top: 1px solid #364A47; padding-top: 10px; font-size: 11px; }
        .abort-diag-row { display: flex; gap: 8px; margin: 3px 0; }
        .abort-diag-row > span { flex: 0 0 64px; color: #556162; }
        .abort-diag-row > code { color: #9FA7A8; word-break: break-all; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas>
        <!-- Boot console — populated by yettyStatus.append() from the
             preload shim and the launch flow below. -->
        <div id="yetty-status" style="display: none;"><button id="yetty-status-minimize" type="button" title="Minimize boot console">&minus;</button><div id="yetty-status-header">Starting a yetty session. Once you see <span class="hint-key">yetty terminal running</span> this overlay collapses on its own; click <strong>&minus;</strong> in the top-right corner to dismiss it earlier.</div><div id="yetty-status-log"></div></div>
        <button id="yetty-status-restore" type="button"
                title="Show boot console">&#9707; console</button>
        <div id="loading" style="display: none;">
            <div class="spinner"></div>
            <div>Loading WebGPU...</div>
            <div id="status"></div>
        </div>
        <div id="fatal"></div>
    </div>

    <script>
        // ---- Boot status console -----------------------------------------
        // window.yettyStatus.append(text, level?) appends a line to the
        // overlay above the canvas. The preload shim in
        // yetty-assets-preload.js reports through the same API.
        (function () {
            const overlay = document.getElementById('yetty-status');
            // CRITICAL: lines append into #yetty-status-log (the
            // overflow:auto child) — NOT into #yetty-status itself.
            // The parent is a flex container; growing it doesn't
            // scroll, it just stretches off-screen.
            const log = document.getElementById('yetty-status-log');
            const MAX_LINES = 2000;
            let hideTimer = null;
            // True once the user has minimized. Subsequent appends
            // keep filling the (hidden) log so the restore pill shows
            // complete scroll-back, but the overlay does NOT auto-pop
            // back open on its own.
            let userMinimized = false;
            // Auto-minimize triggers. 'yetty terminal running' is
            // appended by the preload shim once callMain succeeded —
            // for every session mode that is the moment the boot
            // console can get out of the way. The guest-TCP marker
            // additionally fires for the self-contained VM path where
            // the VM boot log streams through this same overlay.
            const READY_MARKERS = [
                'yetty terminal running',
                'guest TCP established (first rx)',   /* temu */
                'shell talking (first tx)'            /* yos */
            ];
            let autoMinimizeArmed = true;
            function maybeAutoMinimize(text) {
                if (!autoMinimizeArmed) return;
                if (typeof text !== 'string') return;
                let hit = false;
                for (let i = 0; i < READY_MARKERS.length; i++) {
                    if (text.indexOf(READY_MARKERS[i]) !== -1) { hit = true; break; }
                }
                if (!hit) return;
                autoMinimizeArmed = false;
                /* Small delay so the user actually sees the green
                 * "running" line land in the log before the overlay
                 * collapses. */
                setTimeout(minimize, 600);
            }
            const restoreBtn = document.getElementById('yetty-status-restore');
            // Tag → DOM line map so callers can update an existing line
            // in place (e.g. download progress %) instead of appending
            // a fresh row every event.
            const tagged = Object.create(null);

            function alsoLog(text) {
                // Mirror to console so the headless test capture and
                // dev-tools both see boot status, not just the overlay.
                try { console.log('[yetty-status]', text); } catch (ignored) {}
            }
            function showIfNotDismissed() {
                if (!overlay) return;
                if (userMinimized) return;       /* keep filling, don't pop */
                overlay.classList.remove('minimized');
                overlay.style.display = 'flex';  /* matches the CSS rule */
            }
            function makeLine(text, level) {
                const line = document.createElement('div');
                line.className = 'line' + (level ? ' ' + level : '');
                line.textContent = text;
                return line;
            }
            function append(text, level) {
                alsoLog(text);
                if (!log) return;
                showIfNotDismissed();
                log.appendChild(makeLine(text, level));
                while (log.childElementCount > MAX_LINES) {
                    log.removeChild(log.firstChild);
                }
                log.scrollTop = log.scrollHeight;
                maybeAutoMinimize(text);
            }
            // Append a tagged line on first call; on subsequent calls
            // with the same tag, replace its text in place.
            function update(tag, text, level) {
                alsoLog(text);
                if (!log) return;
                showIfNotDismissed();
                let line = tagged[tag];
                if (!line || !line.parentNode) {
                    line = makeLine(text, level);
                    tagged[tag] = line;
                    log.appendChild(line);
                } else {
                    line.textContent = text;
                    if (level) line.className = 'line ' + level;
                }
                log.scrollTop = log.scrollHeight;
                maybeAutoMinimize(text);
            }
            function minimize() {
                userMinimized = true;
                if (overlay) overlay.classList.add('minimized');
                if (restoreBtn) restoreBtn.classList.add('visible');
            }
            function restore() {
                userMinimized = false;
                if (overlay) {
                    overlay.classList.remove('minimized');
                    overlay.style.display = 'flex';
                }
                if (restoreBtn) restoreBtn.classList.remove('visible');
                if (log) log.scrollTop = log.scrollHeight;
            }
            function autoHide(ms) {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(minimize, ms);
            }

            window.yettyStatus = {
                append: append,
                update: update,
                minimize: minimize,
                restore: restore,
                /* Back-compat shim — old callers used hide(); now it
                 * minimizes. The overlay never fully closes anymore. */
                hide: minimize,
                autoHide: autoHide
            };

            const minBtn = document.getElementById('yetty-status-minimize');
            if (minBtn) {
                minBtn.addEventListener('click', minimize);
            }
            if (restoreBtn) {
                restoreBtn.addEventListener('click', restore);
            }

            // Iframe → status pump: a self-contained VM iframe (the
            // standalone temu path spawns one as a child of this page)
            // sends 'yetty-status' messages for its download / boot
            // phases. `tag` lets it ask for in-place updates.
            window.addEventListener('message', function (event) {
                if (!event.data || event.data.type !== 'yetty-status') return;
                if (typeof event.data.text !== 'string') return;
                if (event.data.tag) {
                    update(event.data.tag, event.data.text, event.data.level);
                } else {
                    append(event.data.text, event.data.level);
                }
            });
        })();

        function fatalError(html) {
            const fatal = document.getElementById('fatal');
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            if (fatal) {
                fatal.innerHTML = html;
                fatal.style.display = 'block';
            }
        }

        // Best-effort GPU identification (WebGL unmasked strings) for the
        // diagnostics block in the abort dialog. Never throws.
        function gatherGpuInfo() {
            const info = { renderer: '', vendor: '' };
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (gl) {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) {
                        info.renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
                        info.vendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '';
                    }
                }
            } catch (err) { /* diagnostics only */ }
            return info;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (ch) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                         '"': '&quot;', "'": '&#39;' }[ch];
            });
        }

        // A chrome:// destination rendered as a copyable field. It is NOT a
        // link: browsers block navigation to chrome:// from page content, so
        // the user must paste it into the address bar.
        function copyField(text) {
            const safe = escapeHtml(text);
            return '<div class="abort-copy-field">' +
                   '<code class="abort-url">' + safe + '</code>' +
                   '<button type="button" class="abort-copy" data-copy="' + safe +
                   '">Copy</button></div>';
        }

        function copyToClipboard(text, button) {
            function feedback() {
                const original = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(function () {
                    button.textContent = original;
                    button.classList.remove('copied');
                }, 1500);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(feedback, function () {
                    fallbackCopy(text, feedback);
                });
            } else {
                fallbackCopy(text, feedback);
            }
        }

        function fallbackCopy(text, feedback) {
            try {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.focus();
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                feedback();
            } catch (err) { /* the field is user-selectable as a last resort */ }
        }

        // Platform-specific "what to try, in order" section of the abort
        // dialog. On Linux the ORDER is derived from field results:
        // #enable-vulkan alone is the most common fix (hardware WebGPU on
        // Linux Chrome runs on Vulkan); blocklist override and the
        // compositing-interop flag follow. macOS/iOS get Metal/WebKit
        // instructions instead — there are no Vulkan flags there.
        function buildPlatformFixSection() {
            const userAgent = navigator.userAgent;
            const maxTouchPoints = navigator.maxTouchPoints || 0;
            const ios = /iPhone|iPad|iPod/.test(userAgent) ||
                (/Macintosh/.test(userAgent) && maxTouchPoints > 1);
            const android = /Android/.test(userAgent);
            const mac = !ios && /Macintosh|Mac OS X/.test(userAgent);
            const safari = /Safari\//.test(userAgent) &&
                !/Chrome|Chromium|CriOS|Edg/.test(userAgent);

            if (ios) {
                return '<div class="abort-section-label">Try this first</div>' +
                    '<div class="abort-step">Every iOS/iPadOS browser uses WebKit, ' +
                    'so this is a Safari setting no matter which browser app you ' +
                    'use: <strong>Settings → Apps → Safari → Advanced → Feature ' +
                    'Flags → WebGPU</strong>, then restart the browser. On iOS 26+ ' +
                    'WebGPU is on by default — if the flag is missing or it still ' +
                    'fails, update iOS.</div>';
            }
            if (mac && safari) {
                return '<div class="abort-section-label">Try this first</div>' +
                    '<div class="abort-step">Safari on macOS: <strong>Safari → ' +
                    'Settings → Advanced → “Show features for web ' +
                    'developers”</strong>, then <strong>Develop → Feature Flags → ' +
                    'WebGPU</strong> and reload. WebGPU is on by default in recent ' +
                    'Safari (26+) — updating macOS/Safari is the cleanest fix. ' +
                    'Chrome/Edge 113+ also work on macOS out of the box.</div>';
            }
            if (mac) {
                return '<div class="abort-section-label">Try these, in order</div>' +
                    '<div class="abort-step">Chrome/Edge on macOS run WebGPU on ' +
                    'Metal — there are no Vulkan flags on macOS. 1. Update the ' +
                    'browser and macOS. 2. Keep <strong>chrome://settings/system → ' +
                    '“Use graphics acceleration when available”</strong> ON and ' +
                    'relaunch. 3. Override the GPU blocklist:</div>' +
                    copyField('chrome://flags/#enable-unsafe-webgpu') +
                    '<div class="abort-hint">Set it to <strong>Enabled</strong> and ' +
                    '<strong>Relaunch</strong>. <code>chrome://</code> pages cannot ' +
                    'be opened from a link — paste into the address bar.</div>';
            }
            if (android) {
                return '<div class="abort-section-label">Try these, in order</div>' +
                    '<div class="abort-step">1. Update Chrome and Android System ' +
                    'WebView (WebGPU needs Android 12+ with a recent Chrome). ' +
                    '2. Override the GPU blocklist:</div>' +
                    copyField('chrome://flags/#enable-unsafe-webgpu') +
                    '<div class="abort-hint">Set it to <strong>Enabled</strong> and ' +
                    'relaunch Chrome.</div>';
            }
            if (/Windows/.test(userAgent)) {
                return '<div class="abort-section-label">Try these, in order</div>' +
                    '<div class="abort-step">1. Update the GPU driver (vendor ' +
                    'installer — WebGPU runs on D3D12). 2. Keep ' +
                    '<strong>chrome://settings/system → “Use graphics acceleration ' +
                    'when available”</strong> ON and relaunch. 3. Override the GPU ' +
                    'blocklist:</div>' +
                    copyField('chrome://flags/#enable-unsafe-webgpu') +
                    '<div class="abort-hint">Set it to <strong>Enabled</strong> and ' +
                    '<strong>Relaunch</strong>. <code>chrome://</code> pages cannot ' +
                    'be opened from a link — paste into the address bar.</div>';
            }
            /* Linux (default): the ordered Vulkan flag ladder. */
            return '<div class="abort-section-label">Try these, in order — ' +
                'relaunch and re-test after each</div>' +
                '<div class="abort-step">1. Enable Vulkan — hardware WebGPU on ' +
                'Linux runs on it; this alone is the most common fix:</div>' +
                copyField('chrome://flags/#enable-vulkan') +
                '<div class="abort-step">2. Override the GPU/driver blocklist:</div>' +
                copyField('chrome://flags/#enable-unsafe-webgpu') +
                '<div class="abort-step">3. Force the WebGPU↔GL compositing ' +
                'interop — for the case where yetty renders but the canvas shows ' +
                'nothing:</div>' +
                copyField('chrome://flags/#force-enable-webgpu-interop') +
                '<div class="abort-hint">Set each to <strong>Enabled</strong> and ' +
                'use <strong>Relaunch</strong>. Keep ' +
                '<code>chrome://settings/system → “Use graphics acceleration when ' +
                'available”</code> ON. <code>chrome://</code> pages cannot be ' +
                'opened from a link — paste the copied text into the address ' +
                'bar.</div>';
        }

        // Central "yetty cannot start" dialog. Every abort path routes here so
        // the user always sees where to look (chrome://flags, chrome://gpu)
        // and what the specific failure was.
        function showAbortDialog(options) {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            // Collapse the translucent boot log so the dialog is unobstructed.
            const overlay = document.getElementById('yetty-status');
            if (overlay) overlay.style.display = 'none';

            const gpu = options.gpuInfo || {};
            const gpuRow = gpu.renderer
                ? '<div class="abort-diag-row"><span>GPU</span><code>' +
                  escapeHtml(gpu.renderer) + '</code></div>'
                : '';

            const fatal = document.getElementById('fatal');
            fatal.classList.add('abort-dialog');
            fatal.innerHTML =
                '<div class="abort-title">' + escapeHtml(options.heading) + '</div>' +
                '<div class="abort-cause">' + escapeHtml(options.cause) + '</div>' +

                buildPlatformFixSection() +

                '<div class="abort-section-label">Investigate why</div>' +
                '<div class="abort-step">Open the GPU report and read the ' +
                '<strong>Graphics Feature Status</strong>:</div>' +
                copyField('chrome://gpu') +
                '<div class="abort-hint">Look at the <code>WebGPU</code> and ' +
                '<code>Vulkan</code> lines. If Vulkan is <em>Disabled</em>, or the Dawn ' +
                '<code>WebGPU Status</code> section says <em>Blocklisted</em>, your ' +
                'GPU/driver is not on the browser\'s WebGPU allow-list — the flags above ' +
                'override that. On desktop, a WebGPU-hooking extension can also break ' +
                'it; try a Guest window or disable extensions.</div>' +

                '<div class="abort-diag">' + gpuRow +
                '<div class="abort-diag-row"><span>Reason</span><code>' +
                escapeHtml(options.reason || '') + '</code></div>' +
                '<div class="abort-diag-row"><span>Browser</span><code>' +
                escapeHtml(navigator.userAgent) + '</code></div></div>';

            fatal.style.display = 'block';
            fatal.querySelectorAll('.abort-copy').forEach(function (button) {
                button.addEventListener('click', function () {
                    copyToClipboard(button.getAttribute('data-copy'), button);
                });
            });
        }

        async function checkWebGPU() {
            const status = document.getElementById('status');

            if (!navigator.gpu) {
                status.textContent = 'WebGPU not available';
                showAbortDialog({
                    heading: 'WebGPU is not available in this browser',
                    cause: 'This browser does not expose the WebGPU API ' +
                           '(navigator.gpu is missing). yetty renders its terminal on ' +
                           'the GPU and cannot start without it. Use Chrome/Edge 113+ ' +
                           'or another WebGPU-capable browser.',
                    reason: 'navigator.gpu is undefined',
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }

            // Ask for the default (core) adapter first. On Android and older
            // GPUs the core backend (Vulkan) is often blocklisted while the
            // GL/ES-backed compatibility adapter still works — fall back to it
            // before giving up.
            let adapter = null;
            let usedCompatibility = false;
            try {
                status.textContent = 'Requesting WebGPU adapter…';
                adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    adapter = await navigator.gpu.requestAdapter({ featureLevel: 'compatibility' });
                    usedCompatibility = !!adapter;
                }
            } catch (err) {
                adapter = null;
            }

            if (!adapter) {
                status.textContent = 'No WebGPU adapter available';
                showAbortDialog({
                    heading: 'No WebGPU adapter is available',
                    cause: 'The browser supports WebGPU but did not provide a GPU ' +
                           'adapter — neither the default nor the compatibility ' +
                           'adapter. This almost always means the GPU/driver is ' +
                           'blocklisted for WebGPU, or a browser extension is ' +
                           'interfering with the WebGPU API.',
                    reason: 'navigator.gpu.requestAdapter() returned null (core and compatibility)',
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }

            try {
                status.textContent = 'Requesting WebGPU device…';
                const device = await adapter.requestDevice({
                    requiredLimits: {
                        maxStorageBuffersPerShaderStage: 8,
                        maxTextureDimension2D: Math.min(16384, adapter.limits.maxTextureDimension2D),
                    }
                });
                if (!device) {
                    status.textContent = 'Failed to get WebGPU device';
                    showAbortDialog({
                        heading: 'WebGPU device creation failed',
                        cause: 'A GPU adapter was found but the browser refused to ' +
                               'create a WebGPU device from it.',
                        reason: 'adapter.requestDevice() returned null',
                        gpuInfo: gatherGpuInfo(),
                    });
                    return false;
                }

                Module.preinitializedWebGPUDevice = device;
                status.textContent = usedCompatibility
                    ? 'WebGPU initialized (compatibility mode)'
                    : 'WebGPU initialized';
                if (usedCompatibility && window.yettyStatus) {
                    window.yettyStatus.append(
                        'WebGPU core adapter unavailable — using compatibility mode', 'dim');
                }
                return true;
            } catch (err) {
                status.textContent = 'WebGPU error: ' + (err && err.message || err);
                showAbortDialog({
                    heading: 'WebGPU device creation failed',
                    cause: 'A GPU adapter was found but creating a device from it ' +
                           'threw an error. The GPU may not meet the limits yetty ' +
                           'requests, or the driver is unstable.',
                    reason: 'adapter.requestDevice() threw: ' + (err && err.message || err),
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('canvas');
            if (container && canvas) {
                const rect = container.getBoundingClientRect();
                const width = Math.floor(rect.width);
                const height = Math.floor(rect.height);
                if (width > 0 && height > 0 && (canvas.width !== width || canvas.height !== height)) {
                    canvas.width = width;
                    canvas.height = height;
                    if (typeof Module !== 'undefined' && Module._yetty_handle_resize) {
                        Module._yetty_handle_resize(width, height);
                    }
                }
            }
        }

        // Parse URL parameters for configuration
        function getUrlParams() {
            const params = {};
            const query = window.location.search.substring(1);
            if (query) {
                query.split('&').forEach(pair => {
                    const [key, value] = pair.split('=');
                    params[decodeURIComponent(key)] = decodeURIComponent(value || '');
                });
            }
            return params;
        }

        const urlParams = getUrlParams();

        // Trace logging — accept several aliases so the URL can use the
        // same name as the env var the runtime reads.
        //   ?trace=1 / ?ytrace=on / ?YTRACE_DEFAULT_ON=yes
        // Accepted values (case-insensitive): 1, on, yes, true.
        const traceFromUrl = (function () {
            const value = (urlParams.trace ||
                           urlParams.ytrace ||
                           urlParams.YTRACE_DEFAULT_ON || '').toLowerCase();
            return value === '1' || value === 'on' || value === 'yes' || value === 'true';
        })();

        // Whether this page runs inside the tabbed shell (index.html) or
        // was opened directly. Embedded pages receive their session
        // config over postMessage; standalone pages read query params
        // and, for the VM mode, own their VM iframe themselves.
        const embedded = (function () {
            try { return window.parent && window.parent !== window; }
            catch (ignored) { return true; }
        })();

        // Trace flag lives outside the config handshake so buildEnvVars
        // can see the final value regardless of where config came from.
        let traceOn = traceFromUrl;

        function buildEnvVars() {
            const env = {};
            if (traceOn) {
                env.YTRACE_DEFAULT_ON = 'yes';
            }
            return env;
        }

        var Module = {
            canvas: document.getElementById('canvas'),
            print: function(text) { console.log(text); },
            printErr: function(text) { console.log(text); },
            // Any fatal wasm-level abort routes to the same help dialog so the
            // user is never left staring at a frozen canvas with no guidance.
            onAbort: function(what) {
                showAbortDialog({
                    heading: 'yetty stopped unexpectedly',
                    cause: 'The yetty engine aborted after starting. This is most ' +
                           'often a GPU/WebGPU problem on this device. The pages below ' +
                           'show what the browser thinks of your GPU.',
                    reason: 'wasm abort: ' + (what || 'unknown'),
                    gpuInfo: gatherGpuInfo(),
                });
            },
            // C-side fatal hook (yetty_yplatform_fatal_report): every
            // unrecoverable GPU/runtime error — uncaptured WebGPU error,
            // device lost, surface acquire failure, bring-up failure —
            // calls this BEFORE _Exit()/returning. Without it those
            // fatals reach only the console and the page keeps saying
            // "yetty ready!" over a dead canvas.
            onYettyFatal: function(text) {
                const status = document.getElementById('status');
                if (status) status.textContent = 'yetty hit a fatal error';
                showAbortDialog({
                    heading: 'yetty hit a fatal error',
                    cause: 'The yetty engine reported an unrecoverable error and ' +
                           'stopped. The exact reason is shown below; the pages ' +
                           'referenced above show what the browser thinks of your GPU.',
                    reason: text || 'no message',
                    gpuInfo: gatherGpuInfo(),
                });
                // Let the hosting shell (index.html) mark this instance too.
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage(
                            { type: 'yetty-fatal', text: text || '' }, '*');
                    }
                } catch (ignored) {}
            },
            // preRun runs AFTER yetty.js loads but BEFORE main() executes
            // This is where we inject environment variables into Emscripten's ENV
            preRun: [function() {
                const envVars = buildEnvVars();
                /* JSON.stringify here on purpose — emscripten's print()
                 * implementation in some configurations stringifies an
                 * object argument as the literal "Object", which made
                 * it impossible to verify whether YTRACE_DEFAULT_ON was
                 * actually wired in from ?trace=1. */
                console.log('[yetty] preRun: Setting ENV vars: ' +
                            JSON.stringify(envVars));
                // Emscripten's ENV is a global variable in yetty.js, not Module.ENV
                Object.keys(envVars).forEach(key => {
                    ENV[key] = envVars[key];
                });
            }],
            onRuntimeInitialized: function() {
                const status = document.getElementById('status');
                const loading = document.getElementById('loading');
                if (status) status.textContent = 'yetty ready!';
                setTimeout(() => {
                    if (loading) loading.style.display = 'none';
                    const canvas = document.getElementById('canvas');
                    if (canvas) {
                        canvas.focus();
                    }
                }, 500);
                resizeCanvas();
                // Retry after yetty main loop starts and resize callback is registered
                setTimeout(resizeCanvas, 1000);
                setTimeout(resizeCanvas, 2000);
            }
        };

        window.addEventListener('resize', resizeCanvas);

        // Use ResizeObserver to detect container size changes (tabbed
        // shell resizing the instance panel, devtools open/close, …)
        const container = document.getElementById('canvas-container');
        if (container && typeof ResizeObserver !== 'undefined') {
            const resizeObserver = new ResizeObserver(() => {
                resizeCanvas();
            });
            resizeObserver.observe(container);
        }

        // Click on canvas to focus for keyboard input
        document.getElementById('canvas').addEventListener('click', function() {
            this.focus();
        });

        // The /demo and /src trees are served by yfs as demand-paged
        // files (docs/yfs.md) — there is no yetty.data package to
        // prefetch anymore; the old 40 MB emscripten payload is gone.
        // Stale caches from that era are reclaimed here.
        try { caches.delete('yetty-data-package'); } catch (ignored) {}

        async function initYetty() {
            const status = document.getElementById('status');
            if (status) status.textContent = 'Loading yetty...';

            try {
                const script = document.createElement('script');
                script.src = 'yetty.js';

                await new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load yetty.js'));
                    document.head.appendChild(script);
                });

                return true;
            } catch (err) {
                if (status) status.textContent = 'yetty error: ' + err.message;
                return false;
            }
        }

        // Wait for a {type:'vm-ready', ptyId} message to land on this
        // window. Works for both VM ownership shapes: the standalone
        // path's child VM iframe posts it straight to this window; in
        // the embedded shape the shell forwards it here. Times out so
        // we never deadlock the page.
        function awaitVmReady(ptyId, timeoutMs) {
            return new Promise(function (resolve, reject) {
                let done = false;
                const handler = function (event) {
                    if (done) return;
                    if (!event.data) return;
                    if (event.data.type !== 'vm-ready') return;
                    if (event.data.ptyId !== ptyId) return;
                    done = true;
                    window.removeEventListener('message', handler);
                    resolve();
                };
                window.addEventListener('message', handler);
                setTimeout(function () {
                    if (done) return;
                    done = true;
                    window.removeEventListener('message', handler);
                    reject(new Error('VM did not become ready within ' +
                        (timeoutMs / 1000) + 's'));
                }, timeoutMs);
            });
        }

        // Local engine-iframe path: spawn the hidden engine iframe as a
        // child of THIS page. Default page is tinyemu-iframe.html (the
        // TinyEMU VM); yos mode passes yos-iframe.html, which speaks the
        // exact same postMessage contract (term-* console channel +
        // session-* telnet channel + vm-ready + yetty-status).
        function spawnVMIframe(ptyId, cols, rows, iframePage) {
            const id = 'yetty-vm-pty-' + ptyId;
            let iframe = document.getElementById(id);
            if (iframe) {
                // Already there (e.g. soft re-launch) — don't blow it away.
                return iframe;
            }
            iframe = document.createElement('iframe');
            iframe.id = id;
            /* Off-screen rather than display:none. Chrome heavily
             * throttles timers in display:none iframes (sometimes
             * down to ~1 Hz), which kept the wasm-interpreter VM
             * inside from booting fast enough for telnetd to come
             * up before the test capture window expired. Pinning
             * it at left:-99999px keeps it visible to the
             * scheduler (no throttling) but invisible to the
             * user. width/height stay 1px so layout cost is nil.
             * The yos engine needs live timers just the same. */
            iframe.style.cssText =
                'position:absolute; left:-99999px; top:-99999px;' +
                ' width:1px; height:1px; border:0;' +
                ' visibility:hidden; pointer-events:none;';
            iframe.src = (iframePage || 'tinyemu-iframe.html') +
                         '?ptyId=' + ptyId +
                         '&cols=' + cols + '&rows=' + rows;
            document.body.appendChild(iframe);
            return iframe;
        }

        // Embedded VM path: the real VM iframe belongs to the shell
        // (started from its Emulator tab), but the wasm glue in
        // iframepty.c / iframe-transport.c looks up an element with id
        // 'yetty-vm-pty-<id>' in THIS document and posts VM-bound
        // messages (term-input / term-resize / session-open / session-tx
        // / session-close / yetty-ready) into its contentWindow. Satisfy
        // it with an empty same-origin frame whose window forwards
        // everything up to the shell; the shell routes it on to the real
        // VM and relays VM-originated messages (term-output / session-*)
        // back into this window, where the glue's listeners live.
        //
        // Every forwarded message is tagged with this instance's id:
        // telnet-session clientSids are allocated from a per-module
        // counter (iframe-transport.c), so two terminal instances both
        // claim clientSid 1 — the shell needs to know the sender to
        // rewrite them into its shared wire-id namespace.
        function createVmProxy(ptyId, instanceId) {
            const id = 'yetty-vm-pty-' + ptyId;
            let iframe = document.getElementById(id);
            if (iframe) {
                return iframe;
            }
            iframe = document.createElement('iframe');
            iframe.id = id;
            /* Nothing executes inside this frame, so display:none is
             * fine here (no timers to throttle). */
            iframe.style.cssText = 'display:none;';
            document.body.appendChild(iframe);
            // The initial about:blank document is same-origin — attach
            // the forwarder directly on the child window; the handler
            // closes over this page's window.parent (the shell).
            iframe.contentWindow.addEventListener('message', function (event) {
                if (!event.data || !event.data.type) return;
                const payload = Object.assign({}, event.data,
                                              { yettyInstanceId: instanceId });
                window.parent.postMessage(payload, '*');
            });
            return iframe;
        }

        // ---- Transport / session-mode argv --------------------------------
        // The flags travel to wasm main() via Module.arguments, which
        // Module.callMain() (yetty-assets-preload.js) picks up.
        const MODE_DEFAULT_URLS = {
            websocket: 'ws://' + (location.hostname || '127.0.0.1') + ':8090',
            telnet:    'ws://' + (location.hostname || '127.0.0.1') + ':8024',
            ssh:       'ws://' + (location.hostname || '127.0.0.1') + ':8025',
            relay:     'wss://relay.widgetry.org/',
        };

        function buildModuleArguments(config) {
            const mode = config.mode;
            const wsUrl = config.wsUrl;
            if (mode === 'websocket') {
                return wsUrl ? ['--websocket', wsUrl] : ['--websocket'];
            }
            if (mode === 'telnet') {
                return wsUrl ? ['--telnet', '--websocket-url', wsUrl] : ['--telnet'];
            }
            if (mode === 'ssh') {
                // The host part of USER@HOST is informational on webasm —
                // the bridge owns the TCP endpoint; libssh2 in the
                // browser terminates the crypto.
                const args = ['--ssh', (config.sshUser || 'root') + '@websocket',
                              '--ssh-password', config.sshPassword || ''];
                if (wsUrl) args.push('--websocket-url', wsUrl);
                return args;
            }
            if (mode === 'relay') {
                // Bring up the in-browser lwIP netstack against the relay
                // (wsUrl) and telnet to the target host:port over it —
                // yetty's own TCP stack dials out through the relay's NAT,
                // no per-host bridge. relayTarget is "host:port".
                const args = ['--net-relay', wsUrl];
                if (config.relayTarget) args.push('--telnet', config.relayTarget);
                return args;
            }
            if (mode === 'yos') {
                // Same pty factory path as temu: iframe-pty console +
                // telnet sessions over the iframe transport. The yos
                // iframe implements the same postMessage contract as the
                // TinyEMU iframe, so no C-side flag exists for it.
                return ['--temu'];
            }
            return ['--temu'];
        }

        // ---- Session config ------------------------------------------------
        // Embedded instances get their config from the shell over
        // postMessage (keeps ssh passwords out of iframe URLs). Query
        // params still win when present, so terminal.html?mode=… deep
        // links keep working standalone too.
        const KNOWN_MODES = ['temu', 'yos', 'websocket', 'telnet', 'ssh', 'relay'];

        function configFromUrlParams() {
            let mode = (urlParams.mode || '').toLowerCase();
            // ?relay=URL is shorthand for the relay mode with that URL.
            if (!mode && urlParams.relay) { mode = 'relay'; }
            if (KNOWN_MODES.indexOf(mode) === -1) return null;
            return {
                mode: mode,
                wsUrl: urlParams.url || urlParams.wsurl || urlParams.relay || '',
                sshUser: urlParams.user || '',
                sshPassword: urlParams.password || '',
                relayTarget: urlParams.target || '',
                trace: traceFromUrl
            };
        }

        function configFromShell(timeoutMs) {
            return new Promise(function (resolve, reject) {
                let done = false;
                const handler = function (event) {
                    if (done) return;
                    if (!event.data) return;
                    if (event.data.type !== 'yetty-instance-config') return;
                    done = true;
                    window.removeEventListener('message', handler);
                    resolve(event.data.config || {});
                };
                window.addEventListener('message', handler);
                window.parent.postMessage({ type: 'yetty-instance-hello' }, '*');
                setTimeout(function () {
                    if (done) return;
                    done = true;
                    window.removeEventListener('message', handler);
                    reject(new Error('no session config received from the shell page'));
                }, timeoutMs);
            });
        }

        async function resolveConfig() {
            const fromUrl = configFromUrlParams();
            if (fromUrl) return fromUrl;
            if (embedded) {
                return configFromShell(15000);
            }
            throw new Error('no-mode');
        }

        async function launchYetty(config) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            resizeCanvas();
            window.yettyStatus.append('session mode: ' + config.mode +
                (config.wsUrl ? ' (' + config.wsUrl + ')' : ''), 'phase');
            window.yettyStatus.append('checking WebGPU…');
            const hasWebGPU = await checkWebGPU();
            if (!hasWebGPU) {
                window.yettyStatus.append('WebGPU not available — aborting', 'err');
                return;
            }
            window.yettyStatus.append('WebGPU ready', 'ok');

            Module.arguments = buildModuleArguments(config);
            // Don't echo the password into the visible boot log.
            window.yettyStatus.append('yetty args: ' +
                Module.arguments.map(function (arg, index) {
                    return Module.arguments[index - 1] === '--ssh-password'
                        ? '***' : arg;
                }).join(' '), 'dim');

            const header = document.getElementById('yetty-status-header');
            if (config.mode === 'temu' || config.mode === 'yos') {
                const PTY_ID = 1;
                const engineName = config.mode === 'yos'
                    ? 'yos engine' : 'TinyEMU emulator';
                if (embedded) {
                    // Shared engine owned by the shell page — loaded once
                    // per page; each terminal attaches as its own session
                    // (telnet login on the VM, fresh zsh on yos). Put the
                    // proxy frame in place FIRST (so the wasm glue finds
                    // it instead of spawning a nested engine), then ask
                    // the shell to route engine traffic here and to start
                    // the engine if it isn't running yet.
                    if (header) {
                        header.textContent = 'Attaching to the shared ' +
                            engineName + '. Its download/boot log streams ' +
                            'on the Engines tab of the main page; this ' +
                            'overlay collapses once the terminal is running.';
                    }
                    createVmProxy(PTY_ID, config.instanceId || 0);
                    window.yettyStatus.append('attaching to shared ' +
                        engineName + ' (pty ' + PTY_ID + ')…', 'phase');
                    window.parent.postMessage({
                        type: 'yetty-engine-attach',
                        engine: config.mode
                    }, '*');
                    window.yettyStatus.append('waiting for the ' + engineName +
                        ' to be ready — see the Engines tab…');
                } else {
                    // Self-contained: this page owns the engine iframe,
                    // the whole boot log streams through this overlay.
                    window.yettyStatus.append('spawning ' + engineName +
                        ' iframe (pty ' + PTY_ID + ')…', 'phase');
                    spawnVMIframe(PTY_ID, 80, 24,
                        config.mode === 'yos' ? 'yos-iframe.html' : undefined);
                    window.yettyStatus.append(
                        'waiting for the ' + engineName + ' to be ready…');
                }
                try {
                    // temu: 10 minutes is ridiculous but the rootfs is
                    // ~250 MB brotli'd over potentially-slow links +
                    // the brotli decode itself takes seconds. Better an
                    // eventual success than a spurious timeout. yos is
                    // ~40 MB of tools — 5 minutes is plenty.
                    await awaitVmReady(PTY_ID,
                        (config.mode === 'yos' ? 5 : 10) * 60 * 1000);
                } catch (err) {
                    window.yettyStatus.append(
                        'VM never signaled ready: ' + err.message, 'err');
                    return;
                }
                window.yettyStatus.append('VM is ready', 'ok');
            } else {
                // No VM phase — retitle the boot console header (its
                // default text narrates a generic session start).
                if (header) {
                    header.textContent = 'Connecting over WebSocket (' +
                        (config.wsUrl || 'default endpoint') + '). Click − in the ' +
                        'top-right corner to minimize this log.';
                }
            }

            window.yettyStatus.append('loading yetty.js…');
            await initYetty();
        }

        async function init() {
            resizeCanvas();
            let config;
            try {
                config = await resolveConfig();
            } catch (err) {
                if (err && err.message === 'no-mode') {
                    fatalError('No session mode given. Open <code>index.html</code> ' +
                        'for the session menu, or pass one directly: ' +
                        '<code>terminal.html?mode=temu</code>, ' +
                        '<code>?mode=websocket&amp;url=ws://host:8090</code>, ' +
                        '<code>?mode=telnet&amp;url=ws://host:8024</code>, ' +
                        '<code>?mode=ssh&amp;user=you</code>, ' +
                        '<code>?mode=relay&amp;url=wss://host/</code>.');
                } else {
                    fatalError('Failed to obtain session config: ' +
                        (err && err.message || err));
                }
                return;
            }
            if (config.trace) traceOn = true;
            if (!config.wsUrl && MODE_DEFAULT_URLS[config.mode]) {
                config.wsUrl = MODE_DEFAULT_URLS[config.mode];
            }
            await launchYetty(config);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yetty — ygreeter showcase</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1014; }
        body { display: flex; flex-direction: column; }
        #canvas-container { flex: 1 1 auto; min-height: 0; width: 100%; position: relative; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #9FA7A8;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        #loading .spinner {
            width: 40px; height: 40px; border: 3px solid #1E262C; border-top-color: #6BA892;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { font-size: 0.9em; color: #556162; margin-top: 10px; }
        /* Abort help dialog — shown when ygreeter cannot start (no WebGPU,
         * blocklisted adapter, device failure, wasm abort). chrome:// URLs are
         * copy fields, not links: browsers block navigating to them from a
         * page, so the user pastes them into the address bar. */
        #fatal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: min(600px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            text-align: left;
            color: #E0E5E4;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: #141A1F;
            border: 1px solid #364A47;
            border-radius: 10px;
            padding: 20px 22px;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .abort-title { color: #74C5A5; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
        .abort-cause { color: #9FA7A8; margin-bottom: 4px; }
        .abort-section-label {
            color: #6BA892;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 16px 0 6px;
            border-top: 1px solid #364A47;
            padding-top: 12px;
        }
        .abort-step { color: #E0E5E4; margin-bottom: 8px; }
        .abort-copy-field { display: flex; gap: 8px; align-items: stretch; margin: 6px 0; }
        .abort-url {
            flex: 1 1 auto;
            min-width: 0;
            background: #0B1014;
            border: 1px solid #364A47;
            border-radius: 6px;
            padding: 8px 10px;
            color: #74C5A5;
            font-size: 12px;
            overflow-x: auto;
            white-space: nowrap;
            user-select: all;
        }
        .abort-copy {
            flex: 0 0 auto;
            background: #6BA892;
            color: #0B1014;
            border: 0;
            border-radius: 6px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .abort-copy:hover { background: #74C5A5; }
        .abort-copy.copied { background: #5A8979; color: #E0E5E4; }
        .abort-hint { color: #556162; font-size: 12px; margin: 4px 0; }
        .abort-hint code, .abort-step code, .abort-cause code { color: #9FA7A8; }
        .abort-diag { margin-top: 16px; border-top: 1px solid #364A47; padding-top: 10px; font-size: 11px; }
        .abort-diag-row { display: flex; gap: 8px; margin: 3px 0; }
        .abort-diag-row > span { flex: 0 0 64px; color: #556162; }
        .abort-diag-row > code { color: #9FA7A8; word-break: break-all; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas>
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading ygreeter…</div>
            <div id="status"></div>
        </div>
        <div id="fatal"></div>
    </div>

    <script>
        // ygreeter is yetty's ygui feature showcase compiled to its own
        // wasm module (reuses ygreeter's standalone mode via the shared
        // webasm yetty_yinit_run). No terminal, no shell — it renders the
        // ygui figure tree straight into this WebGPU canvas. The asset
        // preload (fonts / shaders / msdf-fonts, baked in via --pre-js)
        // runs before main(); the WebGPU device is handed in below.
        // Best-effort GPU identification (WebGL unmasked strings) for the
        // diagnostics block in the abort dialog. Never throws.
        function gatherGpuInfo() {
            const info = { renderer: '', vendor: '' };
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (gl) {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) {
                        info.renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
                        info.vendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '';
                    }
                }
            } catch (err) { /* diagnostics only */ }
            return info;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (ch) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                         '"': '&quot;', "'": '&#39;' }[ch];
            });
        }

        // A chrome:// destination rendered as a copyable field. It is NOT a
        // link: browsers block navigation to chrome:// from page content, so
        // the user must paste it into the address bar.
        function copyField(text) {
            const safe = escapeHtml(text);
            return '<div class="abort-copy-field">' +
                   '<code class="abort-url">' + safe + '</code>' +
                   '<button type="button" class="abort-copy" data-copy="' + safe +
                   '">Copy</button></div>';
        }

        function copyToClipboard(text, button) {
            function feedback() {
                const original = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(function () {
                    button.textContent = original;
                    button.classList.remove('copied');
                }, 1500);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(feedback, function () {
                    fallbackCopy(text, feedback);
                });
            } else {
                fallbackCopy(text, feedback);
            }
        }

        function fallbackCopy(text, feedback) {
            try {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.focus();
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                feedback();
            } catch (err) { /* the field is user-selectable as a last resort */ }
        }

        // Central "ygreeter cannot start" dialog. Every abort path routes here
        // so the user always sees where to look (chrome://flags, chrome://gpu)
        // and what the specific failure was.
        function showAbortDialog(options) {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';

            const gpu = options.gpuInfo || {};
            const gpuRow = gpu.renderer
                ? '<div class="abort-diag-row"><span>GPU</span><code>' +
                  escapeHtml(gpu.renderer) + '</code></div>'
                : '';

            const fatal = document.getElementById('fatal');
            fatal.innerHTML =
                '<div class="abort-title">' + escapeHtml(options.heading) + '</div>' +
                '<div class="abort-cause">' + escapeHtml(options.cause) + '</div>' +

                '<div class="abort-section-label">Try this first</div>' +
                '<div class="abort-step">Enable unsafe / blocklisted WebGPU, then ' +
                'relaunch the browser:</div>' +
                copyField('chrome://flags/#enable-unsafe-webgpu') +
                '<div class="abort-hint">Set it to <strong>Enabled</strong> and use ' +
                '<strong>Relaunch</strong>. Browser <code>chrome://</code> pages cannot ' +
                'be opened from a link — paste the copied text into the address bar.</div>' +

                '<div class="abort-section-label">Investigate why</div>' +
                '<div class="abort-step">Open the GPU report and read the ' +
                '<strong>Graphics Feature Status</strong>:</div>' +
                copyField('chrome://gpu') +
                '<div class="abort-hint">Look at the <code>WebGPU</code> and ' +
                '<code>Vulkan</code> lines. If Vulkan is <em>Disabled</em>, or the Dawn ' +
                '<code>WebGPU Status</code> section says <em>Blocklisted</em>, your ' +
                'GPU/driver is not on the browser\'s WebGPU allow-list — the flag above ' +
                'overrides that. On desktop, a WebGPU-hooking extension can also break ' +
                'it; try a Guest window or disable extensions.</div>' +

                '<div class="abort-diag">' + gpuRow +
                '<div class="abort-diag-row"><span>Reason</span><code>' +
                escapeHtml(options.reason || '') + '</code></div>' +
                '<div class="abort-diag-row"><span>Browser</span><code>' +
                escapeHtml(navigator.userAgent) + '</code></div></div>';

            fatal.style.display = 'block';
            fatal.querySelectorAll('.abort-copy').forEach(function (button) {
                button.addEventListener('click', function () {
                    copyToClipboard(button.getAttribute('data-copy'), button);
                });
            });
        }

        async function checkWebGPU() {
            const status = document.getElementById('status');
            if (!navigator.gpu) {
                status.textContent = 'WebGPU not available';
                showAbortDialog({
                    heading: 'WebGPU is not available in this browser',
                    cause: 'This browser does not expose the WebGPU API ' +
                           '(navigator.gpu is missing). ygreeter renders on the GPU and ' +
                           'cannot start without it. Use Chrome/Edge 113+ or another ' +
                           'WebGPU-capable browser.',
                    reason: 'navigator.gpu is undefined',
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }

            // Try the default (core) adapter first; on Android and older GPUs
            // the core backend (Vulkan) is often blocklisted while the GL/ES
            // compatibility adapter still works — fall back to it before
            // giving up.
            let adapter = null;
            let usedCompatibility = false;
            try {
                adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    adapter = await navigator.gpu.requestAdapter({ featureLevel: 'compatibility' });
                    usedCompatibility = !!adapter;
                }
            } catch (err) {
                adapter = null;
            }

            if (!adapter) {
                status.textContent = 'No WebGPU adapter available';
                showAbortDialog({
                    heading: 'No WebGPU adapter is available',
                    cause: 'The browser supports WebGPU but did not provide a GPU ' +
                           'adapter — neither the default nor the compatibility ' +
                           'adapter. This almost always means the GPU/driver is ' +
                           'blocklisted for WebGPU, or a browser extension is ' +
                           'interfering with the WebGPU API.',
                    reason: 'navigator.gpu.requestAdapter() returned null (core and compatibility)',
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }

            try {
                const device = await adapter.requestDevice({
                    requiredLimits: {
                        maxStorageBuffersPerShaderStage: 8,
                        maxTextureDimension2D: Math.min(16384, adapter.limits.maxTextureDimension2D),
                    }
                });
                if (!device) {
                    status.textContent = 'Failed to get WebGPU device';
                    showAbortDialog({
                        heading: 'WebGPU device creation failed',
                        cause: 'A GPU adapter was found but the browser refused to ' +
                               'create a WebGPU device from it.',
                        reason: 'adapter.requestDevice() returned null',
                        gpuInfo: gatherGpuInfo(),
                    });
                    return false;
                }
                Module.preinitializedWebGPUDevice = device;
                if (usedCompatibility) {
                    status.textContent = 'WebGPU initialized (compatibility mode)';
                }
                return true;
            } catch (err) {
                status.textContent = 'WebGPU error: ' + (err && err.message || err);
                showAbortDialog({
                    heading: 'WebGPU device creation failed',
                    cause: 'A GPU adapter was found but creating a device from it ' +
                           'threw an error. The GPU may not meet the limits ygreeter ' +
                           'requests, or the driver is unstable.',
                    reason: 'adapter.requestDevice() threw: ' + (err && err.message || err),
                    gpuInfo: gatherGpuInfo(),
                });
                return false;
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('canvas');
            if (!container || !canvas) return;
            const rect = container.getBoundingClientRect();
            const width = Math.floor(rect.width), height = Math.floor(rect.height);
            if (width > 0 && height > 0 && (canvas.width !== width || canvas.height !== height)) {
                canvas.width = width;
                canvas.height = height;
                if (typeof Module !== 'undefined' && Module._yetty_handle_resize) {
                    Module._yetty_handle_resize(width, height);
                }
            }
        }

        // ?trace=1 turns on YTRACE_DEFAULT_ON so the C-side checkpoints reach
        // the console (the headless verifier asserts those, since WebGPU
        // canvas content isn't captured in headless screenshots).
        var traceOn = /(?:^|[?&])(?:trace|ytrace)=(?:1|on|yes|true)\b/i.test(
            window.location.search);

        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: [],
            print: function (text) { console.log(text); },
            printErr: function (text) { console.log(text); },
            // Any fatal wasm-level abort routes to the same help dialog so the
            // user is never left staring at a frozen canvas with no guidance.
            onAbort: function (what) {
                showAbortDialog({
                    heading: 'ygreeter stopped unexpectedly',
                    cause: 'The engine aborted after starting. This is most often a ' +
                           'GPU/WebGPU problem on this device. The pages below show ' +
                           'what the browser thinks of your GPU.',
                    reason: 'wasm abort: ' + (what || 'unknown'),
                    gpuInfo: gatherGpuInfo(),
                });
            },
            preRun: [function () {
                if (traceOn && typeof ENV !== 'undefined') {
                    ENV.YTRACE_DEFAULT_ON = 'yes';
                }
            }],
            onRuntimeInitialized: function () {
                const loading = document.getElementById('loading');
                setTimeout(function () {
                    if (loading) loading.style.display = 'none';
                    const c = document.getElementById('canvas');
                    if (c) c.focus();
                }, 500);
                resizeCanvas();
                setTimeout(resizeCanvas, 1000);
                setTimeout(resizeCanvas, 2000);
            }
        };

        window.addEventListener('resize', resizeCanvas);
        const container = document.getElementById('canvas-container');
        if (container && typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(resizeCanvas).observe(container);
        }
        document.getElementById('canvas').addEventListener('click', function () { this.focus(); });

        async function init() {
            const status = document.getElementById('status');
            resizeCanvas();
            status.textContent = 'initializing WebGPU…';
            if (!(await checkWebGPU())) return;
            status.textContent = 'loading ygreeter.js…';
            const script = document.createElement('script');
            script.src = 'ygreeter.js';
            script.onerror = function () { status.textContent = 'failed to load ygreeter.js'; };
            document.head.appendChild(script);
        }
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>JSLinux VM Bridge</title>
    <style>
        body { margin: 0; padding: 0; }
        #term_container { display: none; }
    </style>
</head>
<body>
    <div id="term_container"></div>
    <script src="term-bridge.js"></script>
    <script>
        "use strict";

        var term, console_write1, console_resize_event;
        var net_state, net_write_packet, net_set_carrier;
        var fs_import_file, fs_set_disk_buffer;
        var diskData = null;

        function log(msg) {
            console.log("[vm-bridge] " + msg);
        }

        function importLocalFiles() {
            // Legacy 9p import for x86_64 variant (not used for block-disk)
        }

        function term_get_size() {
            var size;
            if (term) {
                size = term.getSize();
            } else {
                size = [80, 25];
            }
            return size;
        }

        function term_write(str) {
            if (term) {
                term.write(str);
            }
        }

        var runtimeReady = false;
        var Module = {};

        Module.onRuntimeInitialized = function() {
            log("Emscripten runtime initialized");
            runtimeReady = true;
        };

        Module.postRun = function() {
            if (typeof Module.setMainLoopTiming === 'function') {
                Module.setMainLoopTiming(0, 0);
            }
        };

        function term_handler(str) {
            for (var i = 0; i < str.length; i++) {
                console_write1(str.charCodeAt(i));
            }
        }

        function get_params() {
            var params = {};
            var query = window.location.search.substring(1);
            var pairs = query.split("&");
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split("=");
                params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
            }
            return params;
        }

        var VARIANTS = {
            "legacy":               { cpu: "x86_64",  url: "alpine-x86_64.cfg" },
            "alpine-disk":          { cpu: "riscv64", url: "alpine-disk.cfg", disk: "alpine-rootfs.img" },
            "alpine-extended-disk": { cpu: "riscv64", url: "alpine-extended-disk.cfg", disk: "alpine-extended-rootfs.img" }
        };

        async function downloadDiskImage(imageName) {
            try {
                log("Downloading disk image: " + imageName);
                const response = await fetch(imageName);
                if (!response.ok) {
                    throw new Error("HTTP " + response.status + ": " + response.statusText);
                }
                diskData = await response.arrayBuffer();
                log("Disk image downloaded: " + (diskData.byteLength / 1024 / 1024).toFixed(1) + " MB");
            } catch(e) {
                log("Error downloading disk: " + e);
                term_write("Error downloading disk: " + e + "\r\n");
                throw e;
            }
        }

        function initVM(cfg_url, mem, cols, rows) {
            try {
                console_write1 = Module.cwrap('console_queue_char', null, ['number']);
                fs_import_file = Module.cwrap('fs_import_file', null, ['string', 'number', 'number']);
                net_write_packet = Module.cwrap('net_write_packet', null, ['number', 'number']);
                net_set_carrier = Module.cwrap('net_set_carrier', null, ['number']);
                console_resize_event = Module.cwrap('console_resize_event', null, []);
                fs_set_disk_buffer = Module.cwrap('fs_set_disk_buffer', null, ['number', 'number']);
                log("All C functions wrapped successfully");

                term.setResizeHandler(function(cols, rows) {
                    if (console_resize_event) {
                        console_resize_event();
                    }
                });
            } catch(e) {
                log("Error wrapping functions: " + e);
                term.write("Error wrapping functions: " + e + "\r\n");
                return;
            }

            // Set downloaded disk image for block-disk variants
            if (diskData && (window._yettyVariant === "alpine-disk" || window._yettyVariant === "alpine-extended-disk")) {
                try {
                    var diskPtr = Module._malloc(diskData.byteLength);
                    Module.HEAPU8.set(new Uint8Array(diskData), diskPtr);
                    fs_set_disk_buffer(diskPtr, diskData.byteLength);
                    log("Disk buffer set in tinyemu: " + diskPtr + " size: " + diskData.byteLength);
                } catch(e) {
                    log("Error setting disk buffer: " + e);
                    term.write("Error setting disk buffer: " + e + "\r\n");
                }
            }

            term.write("Starting VM...\r\n");

            try {
                Module.ccall('vm_start', null,
                    ['string', 'number', 'string', 'string', 'number', 'number', 'number', 'string'],
                    [cfg_url, mem, "", "", 0, 0, 0, ""]);

                // Resize events during boot
                var resizeCount = 0;
                var resizeInterval = setInterval(function() {
                    resizeCount++;
                    console_resize_event();
                    if (resizeCount >= 10) {
                        clearInterval(resizeInterval);
                        if (window._yettyVariant === "legacy") {
                            importLocalFiles();
                        } else {
                            log("Block-disk variant: skipping local-files import (no 9p import target)");
                        }
                    }
                }, 200);
            } catch(e) {
                log("Error starting VM: " + e.toString());
                term.write("Error starting VM: " + e.toString() + "\r\n");
            }
        }

        async function start_vm() {
            var params = get_params();
            var variant = params["variant"] || "legacy";
            var v = VARIANTS[variant] || VARIANTS["legacy"];
            var cpu = params["cpu"] || v.cpu;
            var url = params["url"] || v.url;
            var mem = parseInt(params["mem"]) || 256;
            var cols = parseInt(params["cols"]) || 80;
            var rows = parseInt(params["rows"]) || 25;

            window._yettyVariant = variant;

            term = new Term({
                cols: cols,
                rows: rows,
                scrollback: 0
            });
            term.setKeyHandler(term_handler);
            term.open(document.getElementById("term_container"));

            var vm_file;
            switch(cpu) {
                case "x86": vm_file = "x86emu"; break;
                case "x86_64": vm_file = "x86_64emu"; break;
                case "riscv64": vm_file = "riscvemu64"; break;
                case "riscv32": vm_file = "riscvemu32"; break;
                default:
                    term.write("Error: Unknown cpu: " + cpu + "\r\n");
                    return;
            }
            var vm_url = vm_file + "-wasm.js";
            term.write("Loading " + vm_url + "...\r\n");

            var cfg_url = new URL(url, window.location.href).href;

            // Download disk image FIRST if needed
            if (v.disk) {
                var diskUrl = new URL(v.disk, window.location.href).href;
                try {
                    await downloadDiskImage(diskUrl);
                    log("Disk image download complete");
                } catch(e) {
                    log("Disk download failed, will try HTTP fallback: " + e);
                    // Continue anyway, tinyemu will try HTTP
                }
            }

            Module.preRun = (Module.preRun || []).concat([
                function() {
                    if (params["ydebug"]) {
                        ENV.YDEBUG = params["ydebug"];
                    }
                },
                function() {
                    initVM(cfg_url, mem, cols, rows);
                }
            ]);

            var script = document.createElement('script');
            script.src = vm_url;
            script.onerror = function(e) {
                term.write("Error loading emulator: " + vm_url + "\r\n");
            };
            document.body.appendChild(script);
        }

        // Initialize
        start_vm();
    </script>
</body>
</html>

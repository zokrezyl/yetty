# YettyQemu — the qemu-as-tvOS-app build.
#
#   tvos.m        — tvOS UIKit harness (owns main(), wires socketpair → UITextView,
#                    launches qemu_main on a worker). Sibling of
#                    ios/qemu/ios-main.m; build-tools/3rdparty/qemu/_build.sh
#                    picks the right source per TARGET_PLATFORM and copies
#                    it into qemu's source tree as system/tvos-main.m
#                    (the filename hard-coded in patches/0005).
#   Info.plist    — bundle metadata (com.yetty.qemu).
#   project.yml   — this file; xcodegen turns it into YettyQemu.xcodeproj.
#
# `xcodebuild -allowProvisioningUpdates` against this project gets the
# development provisioning profile installed into ~/Library/Developer/Xcode/
# UserData/Provisioning Profiles/. Driven by build-tools/ios-tvos/refresh-profiles.sh.
#
# The actual qemu binary is produced by build-tools/3rdparty/qemu/_build.sh
# (which sources tvos.m back from this directory). The codesign step
# splices the downloaded mobileprovision into the real YettyQemu.app and
# signs it. xcodebuild's link of the stub here may fail on unresolved
# qemu_main / yetty_qemu_main — provisioning runs during preflight, well
# before link, so the profile lands either way.

name: YettyQemu
options:
  bundleIdPrefix: com.yetty
  developmentLanguage: en
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: R2XJ745TS6
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.yetty.qemu
    TARGETED_DEVICE_FAMILY: "3"
    TVOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    SDKROOT: appletvos
    INFOPLIST_FILE: Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: YettyQemu
targets:
  YettyQemu:
    type: application
    platform: tvOS
    sources:
      - tvos.m
    settings:
      base:
        PRODUCT_NAME: YettyQemu

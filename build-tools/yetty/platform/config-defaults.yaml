      # Debug
      # - "0x00ff-debug-green"      # Solid green — sanity-check the path

# ─────────────────────────────────────────────────────────────────────────────
# Workspace Configuration
# ─────────────────────────────────────────────────────────────────────────────
# The workspace layout defines the initial tile arrangement.
# Each tile is either:
#   - type: pane - A leaf node containing a view (terminal)
#   - type: split - A container with two children (first/second)
#
# Split tiles have:
#   - orientation: horizontal (top/bottom) or vertical (left/right)
#   - ratio: percentage (0-100) for first child size
#   - first: first child tile
#   - second: second child tile
#
# Pane tiles have:
#   - view: the view type (currently only "terminal")
#   - background (optional): opaque RGBA fill rendered before the view
#     - color: hex string, accepts "#RGB", "#RGBA", "#RRGGBB" or "#RRGGBBAA"
#       (alpha defaults to FF when omitted). Without a background block the
#       pane has no per-pane wipe — its area falls back to whatever the
#       global frame clear left behind.
workspace:
  # Single terminal (rename to 'default' to use)
  default:
    layout:
      type: pane
      view: terminal
      background:
        color: "#101820"

  # Two terminals side by side (vertical split)
  default1:
    layout:
      type: split
      orientation: vertical
      ratio: 50
      first:
        type: pane
        view: terminal
        background:
          color: "#101820"
      second:
        type: pane
        view: terminal
        background:
          color: "#101820"

  # Two terminals top/bottom (horizontal split)
  default2:
    layout:
      type: split
      orientation: horizontal
      ratio: 50
      first:
        type: pane
        view: terminal
        background:
          color: "#101820"
      second:
        type: pane
        view: terminal
        background:
          color: "#101820"

  # IDE-style: left pane + right split top/bottom
  default3:
    layout:
      type: split
      orientation: vertical
      ratio: 60
      first:
        type: pane
        view: terminal
        background:
          color: "#101820"
      second:
        type: split
        orientation: horizontal
        ratio: 50
        first:
          type: pane
          view: terminal
          background:
            color: "#101820"
        second:
          type: pane
          view: terminal
          background:
            color: "#101820"

  # Three columns
  default4:
    layout:
      type: split
      orientation: vertical
      ratio: 33
      first:
        type: pane
        view: terminal
        background:
          color: "#101820"
      second:
        type: split
        orientation: vertical
        ratio: 50
        first:
          type: pane
          view: terminal
          background:
            color: "#101820"
        second:
          type: pane
          view: terminal
          background:
            color: "#101820"

# ─────────────────────────────────────────────────────────────────────────────
# Style — shared color palette for yetty's own chrome (yui) and for any
# client app rendering through ygui. Each value is a hex string accepting
# #RGB, #RGBA, #RRGGBB or #RRGGBBAA. Alpha defaults to FF when omitted.
#
# The defaults below are the yetty brand palette (see logo). Every entry
# is optional — missing keys fall back to the C-side default. yetty's
# own chrome reads them at startup.
# ─────────────────────────────────────────────────────────────────────────────
style:
  # ygui — widget library used by client apps (dialogs, panels, menus).
  ygui:
    # Background ladder, darkest → lightest.
    bg-primary:    "#0B1014"  # canvas / root surface
    bg-secondary:  "#141A1F"  # subdued lifted surface
    bg-surface:    "#1E262C"  # cards, popovers, rows
    bg-hover:      "#2A3438"  # hover row / list item
    bg-header:     "#364A47"  # section headers
    bg-dropdown:   "#141A1F"  # menu / dropdown body

    # Borders & separators.
    border:        "#364A47"
    border-light:  "#505545"
    border-muted:  "#626155"

    # Text.
    text-primary:  "#E0E5E4"  # off-white, NOT pure FFFFFF
    text-muted:    "#9FA7A8"

    # Brand accent.
    accent:        "#6BA892"  # primary mint
    selection-bg:  "#5A8979"  # deeper mint for selection

    # Scrollbar thumb.
    thumb-normal:  "#364A47"
    thumb-hover:   "#626155"

    # Overlays. Hex format here allows explicit alpha.
    overlay-modal: "#00000080"  # 50 % black behind modal popups
    shadow:        "#00000040"  # 25 % black drop shadow
    tooltip-bg:    "#141A1FF0"  # near-opaque BG_LIFTED

  # yui — yetty's own window chrome (tab strip, tabs, window buttons,
  # left "v" pull-down menu, "+" new-tab pill).
  yui:
    strip:         "#141A1F"  # tab strip background
    tab-active:    "#0B1014"  # selected tab — merges with workspace bg
    tab-inactive:  "#1E262C"  # unselected tabs sit one step above strip

    pill:          "#364A47"  # background of "v" and "+" pills
    glyph:         "#E0E5E4"  # off-white glyphs (min/max button strokes)
    accent:        "#6BA892"  # chevron + plus marks

    # Window control buttons.
    winbtn-bg:     "#141A1F"  # min/max background (matches strip)
    close-bg:      "#591A1C"  # close keeps a red tint (destructive action)

    # "v" popup menu.
    popup-body:    "#141A1F"
    popup-row:     "#1E262C"

# ─────────────────────────────────────────────────────────────────────────────
# Debug Configuration
# ─────────────────────────────────────────────────────────────────────────────
debug:
  # Show damage rectangles (for debugging rendering issues)
  damage-rects: false

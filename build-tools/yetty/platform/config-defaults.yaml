# Yetty Terminal Configuration
# ============================
# This is the default configuration file for yetty.
# It is installed to ~/.config/yetty/config.yaml on first run.
#
# All settings can be overridden via environment variables by:
#   1. Converting path to uppercase (e.g., rendering/damage-tracking)
#   2. Replacing / and - with _ (RENDERING_DAMAGE_TRACKING)
#   3. Prefixing with YETTY_ (YETTY_RENDERING_DAMAGE_TRACKING)

# ─────────────────────────────────────────────────────────────────────────────
# Font Configuration
# ─────────────────────────────────────────────────────────────────────────────
font:
  # Font family to use (default uses the embedded Nerd Font)
  # Set to a system font name to use fontconfig lookup
  family: "default"

  # Font size in points (currently not configurable, for future use)
  # size: 14

# ─────────────────────────────────────────────────────────────────────────────
# Rendering Configuration
# ─────────────────────────────────────────────────────────────────────────────
rendering:
  # Enable damage tracking for efficient partial redraws
  # Reduces GPU load by only redrawing changed regions
  damage-tracking: true

  # Show FPS counter in the status bar
  show-fps: true

  # Swapchain present mode for the OS window surface. Values:
  #   "auto"          — prefer mailbox > fifo-relaxed > fifo (default).
  #                     Mailbox keeps the loop thread unblocked: Present
  #                     replaces the queued frame instead of waiting on
  #                     vsync / compositor buffer release.
  #   "mailbox"       — force mailbox if supported, else fifo.
  #   "fifo-relaxed"  — vsync, but tears late frames (avoids the
  #                     all-the-way-to-next-vsync wait of strict fifo).
  #   "fifo"          — strict vsync. May park wgpuSurfacePresent on the
  #                     render thread under some Wayland/Mesa stacks.
  #   "immediate"     — no vsync, tearing.
  present-mode: "auto"

# ─────────────────────────────────────────────────────────────────────────────
# Terminal Configuration
# ─────────────────────────────────────────────────────────────────────────────
terminal:
  selection:
    # X-Windows-style auto-copy: when a mouse drag selection finishes,
    # the highlighted text is automatically pushed to the system
    # clipboard (no Ctrl+Shift+C needed). Set to false if you prefer
    # the Windows convention (explicit copy only).
    auto-copy: true
  text-layer:
    font:
      # Font rendering method: "raster" or "msdf"
      # - raster: Traditional bitmap rendering (faster, but magnifies as
      #           pixels when Ctrl+Scroll-zoomed — looks blurry at large zoom)
      # - msdf:   Multi-channel signed distance field. Crisp at any zoom
      #           level because MSDF is re-evaluated per fragment.
      render-method: "msdf"
      # Font size in pixels — the visual height of the glyph extent (top of
      # tallest ascender to bottom of lowest descender). Cell height/width
      # are derived from this plus the padding below.
      size: 18
      # Cell padding around the glyph, as fractions of the glyph dimensions:
      #   cell_height = size           * (1 + top  + bottom)
      #   cell_width  = size / hwratio * (1 + left + right)
      # Defaults of 0 give a tight cell — the cell exactly wraps the glyph
      # extent, with no "small glyph in cell" gap.
      padding:
        left:   -0.05
        right:  -0.05
        top:    0.0
        bottom: 0.0

# ─────────────────────────────────────────────────────────────────────────────
# YPaint (non-monospace font used for ydraw text spans)
# ─────────────────────────────────────────────────────────────────────────────
ydraw:
  font:
    # Backend for text spans rendered via the ydraw layer.
    #   msdf   - MSDF atlas (CDB-based, scales smoothly)
    #   raster - FreeType-rasterized R8 atlas (baseline for comparison)
    render-method: "msdf"

# ─────────────────────────────────────────────────────────────────────────────
# MSDF CDB Generation
# ─────────────────────────────────────────────────────────────────────────────
# Selects the backend used to build MSDF font atlases on demand (e.g. when
# ydraw receives an embedded PDF font that hasn't been cached yet).
#   gpu - WebGPU compute shader. Faster, but the shader still has minor
#         artefacts on glyphs with curves.
#   cpu - msdfgen library, multi-threaded. Slower but artefact-free.
msdf:
  generator: "gpu"

scrollback:
  # Number of lines to keep in scrollback buffer
  lines: 10000

# ─────────────────────────────────────────────────────────────────────────────
# Shell Configuration
# ─────────────────────────────────────────────────────────────────────────────
shell:
  # Default shell binary. Overridden by $SHELL env var at startup if set.
  # If -e CMD is given, the command is execvp'd directly and the shell is
  # bypassed entirely.
  # default: "/bin/bash"

  # Environment variables to export to the shell
  env:
    TERM: "xterm-256color"
    COLORTERM: "truecolor"
    # YETTY_SOCKET is set at runtime with the RPC socket path

  # Shell command to execute (set via -e flag, not typically in config)
  # command: ""

# ─────────────────────────────────────────────────────────────────────────────
# Plugins Configuration
# ─────────────────────────────────────────────────────────────────────────────
plugins:
  # Colon-separated list of plugin directories
  # Defaults to ./plugins relative to the executable
  path: ""

# ─────────────────────────────────────────────────────────────────────────────
# RPC Configuration
# ─────────────────────────────────────────────────────────────────────────────
rpc:
  # Unix socket path for RPC communication (set at runtime)
  # Typically placed in $XDG_RUNTIME_DIR/yetty-<pid>.sock
  socket-path: ""
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Shader Preloading Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Shaders listed here are compiled at startup to avoid first-use stutter.
# Format: "0xNNNN-name" matching the shader filename (without .wgsl extension)
# Uncomment shaders you use frequently to preload them at startup.
shaders:
  preload:
    # ── Card Shaders ──────────────────────────────────────────────────────────
    cards:
      - "0x0000-texture"       # Image cards - commonly used
      - "0x0003-ydraw"         # Vector graphics - commonly used
      # - "0x0001-plot"        # Legacy plot cards
      # - "0x0004-ydraw"      # Paint primitives
      # - "0x0005-jdraw-compute"  # Compute-based drawing
      # - "0x0006-ytext"       # Rich text rendering
      # - "0x0007-qrcode"      # QR code generation
      # - "0x0008-ygrid"       # Grid layouts
      - "0x0009-yplot"       # Modern plot cards
      # - "0x000A-yvideo"      # Video playback

    # ── Glyph Shaders (animated single-cell glyphs) ───────────────────────────
    glyphs:
      # Basic animations
      # - "0x0000-spinner"     # Loading spinner
      # - "0x0001-pulse"       # Pulsing effect
      # - "0x0002-wave"        # Wave animation
      # - "0x0003-fire"        # Fire effect
      # - "0x0004-gem"         # Gem/crystal
      # - "0x0005-heart"       # Beating heart
      # - "0x0006-party"       # Party/celebration
      # - "0x0007-plasma"      # Plasma effect
      # - "0x0008-ripple"      # Ripple animation
      # - "0x0009-rocket"      # Rocket launch
      # - "0x000a-smiley"      # Animated smiley
      # - "0x000b-sparkle"     # Sparkle effect
      # - "0x000c-star"        # Twinkling star
      # - "0x0012-watch"       # Clock/watch
      # - "0x0013-spiral"      # Spiral animation
      #
      # Progress indicators
      # - "0x0015-border-dots" # Dots around border
      # - "0x0016-orbit-dots"  # Orbiting dots
      # - "0x0017-border-dots-grouped"  # Grouped border dots
      # - "0x0018-worm"        # Worm/snake animation
      # - "0x0019-bouncing-ball"  # Bouncing ball
      # - "0x001a-radar-sweep" # Radar sweep
      # - "0x001b-hourglass"   # Hourglass timer
      # - "0x001c-dna-helix"   # DNA helix
      # - "0x001d-equalizer"   # Audio equalizer
      # - "0x001e-pendulum"    # Swinging pendulum
      # - "0x001f-conveyor-dots"  # Conveyor belt dots
      # - "0x0020-pong"        # Pong game
      # - "0x0021-rain"        # Rain drops
      # - "0x0022-orbit"       # Orbital motion
      # - "0x0023-crosshair-pulse"  # Pulsing crosshair
      # - "0x0024-matrix-rain" # Matrix-style rain
      # - "0x0025-metaballs"   # Metaball animation
      # - "0x0026-heartbeat"   # Heartbeat monitor
      # - "0x0027-typing-dots" # Typing indicator
      # - "0x0028-signal-bars" # Signal strength bars
      # - "0x0029-vinyl"       # Spinning vinyl record
      # - "0x002a-dvd-bounce"  # DVD screensaver bounce

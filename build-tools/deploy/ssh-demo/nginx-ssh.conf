# nginx vhost for the yetty SSH-over-WebSocket bridge.
#
# Shipped as an HTTP (:80) server. Running
#     certbot --nginx -d @DOMAIN@ --redirect
# clones this block to :443 with the Let's Encrypt certificate and forces
# HTTPS. The browser requires wss:// because yetty.dev is served over HTTPS
# (a plain ws:// from an https page is blocked as mixed content).
#
# @DOMAIN@ and @WS_PORT@ are substituted at install time.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location / {
        proxy_pass http://127.0.0.1:@WS_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep idle shells alive (default is 60s, which would drop sessions).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

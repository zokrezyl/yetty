# Scoped sshd configuration for the throwaway SSH-over-WebSocket demo user.
#
# Installed as /etc/ssh/sshd_config.d/yetty-demo.conf. It only affects the
# demo user: every other account keeps the host defaults (key-only auth, no
# forced command). The webasm client supports password auth only, so password
# auth is enabled here for this one user while it stays off globally.
#
# @DEMO_USER@ is substituted at install time.
Match User @DEMO_USER@
    PasswordAuthentication yes
    AuthenticationMethods password
    PubkeyAuthentication no
    PermitTTY yes
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    ForceCommand /usr/local/bin/yetty-demo-session

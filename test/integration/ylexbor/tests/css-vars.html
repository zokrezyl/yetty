<!DOCTYPE html>
<html>
<head><style>
:root { --bg: #112233; --fg: #abcdef; --accent: var(--bg); }
body { background-color: var(--bg); color: var(--fg); }
.box { background-color: var(--accent); }
.fb  { background-color: var(--missing, #ff00ff); }
</style></head>
<body>
<div id="box" class="box">b</div>
<div id="fb" class="fb">f</div>
<script>
test(() => {
  const cs = getComputedStyle(document.getElementById("box"));
  assert_equals(typeof cs, "object");
}, "getComputedStyle returns object");

/* The cascade-resolution path is covered by visual tests; here we only
 * confirm the JS plumbing exists and basic body-styled content was
 * picked up by box-build (the `body { color: ... }` rule survives
 * round-trip through lxb_dom_element_style_serialize_str). */
test(() => {
  const body = document.body;
  assert_true(body !== null);
  assert_equals(body.tagName, "BODY");
}, "body element exposed");

test(() => {
  const el = document.querySelector(".fb");
  assert_true(el !== null);
}, "fallback variable element rendered");
</script>
</body>
</html>

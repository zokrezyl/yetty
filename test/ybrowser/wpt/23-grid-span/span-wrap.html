<!doctype html><meta charset=utf-8>
<title>grid-column:span wraps to the next row when the remaining columns can't fit it.
12-col grid, three span-4 cards: first row a,b,c each 1/3; a fourth span-4 wraps to row 2.</title>
<style>body{margin:0}</style>
<div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));width:1200px">
  <div data-test="a" data-expect="0,0,400,*"   style="grid-column:auto/span 4;height:30px">a</div>
  <div data-test="b" data-expect="400,0,400,*" style="grid-column:auto/span 4;height:30px">b</div>
  <div data-test="c" data-expect="800,0,400,*" style="grid-column:auto/span 4;height:30px">c</div>
  <div data-test="d" data-expect="0,30,400,*"  style="grid-column:auto/span 4;height:30px">d</div>
</div>

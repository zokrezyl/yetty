<!doctype html><meta charset=utf-8><title>position:absolute height/width:100% fills the containing block</title>
<style>body{margin:0}</style>
<!-- The MDC ripple idiom: an abspos overlay sized 100%x100% of its
     positioned ancestor's padding box. A percentage height on an
     abspos box resolves against the containing block (which has a
     definite height here), NOT the box's own content. -->
<div style="position:relative;width:200px;height:120px">
  <div data-test="ripple" data-expect="0,0,200,120"
       style="position:absolute;top:0;left:0;width:100%;height:100%"></div>
</div>

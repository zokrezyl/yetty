<!doctype html><meta charset=utf-8>
<title>IntersectionObserver fires (immediately-intersecting approximation): a
scroll-reveal pattern that removes a hidden class / grows the element on
isIntersecting must run — a silent observer left github's sections opacity:0.</title>
<style>body{margin:0} .hidden{height:20px} .shown{height:80px}</style>
<div id=box class=hidden data-test="box" data-expect="0,0,*,80">x</div>
<script>
new IntersectionObserver(function(entries){
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].isIntersecting) entries[i].target.className = 'shown';
  }
}).observe(document.getElementById('box'));
</script>

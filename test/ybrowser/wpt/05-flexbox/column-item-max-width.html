<!doctype html><meta charset=utf-8>
<title>max-width caps a column-flex item's cross size (stretch and fit-content
alike): a stretching item in a 800px column with max-width:300px is 300 wide,
centered when align-items:center (Primer SectionIntro 50ch paragraphs).</title>
<style>
body{margin:0}
.col{display:flex;flex-direction:column;align-items:center;width:800px}
.p{max-width:300px;height:40px;width:100%}
</style>
<div class=col><div class=p data-test="capped" data-expect="250,0,300,40">x</div></div>

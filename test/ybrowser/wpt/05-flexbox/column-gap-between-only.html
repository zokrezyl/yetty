<!doctype html><meta charset=utf-8>
<title>Column-flex `gap` sits BETWEEN items: an auto-height column of three
30px items with gap:20px is 130px tall (3 items + 2 gaps), not 150 — a
trailing gap after the last item inflated every github NavGroup dropdown
list by one gap.</title>
<style>
body{margin:0}
.col{display:flex;flex-direction:column;gap:20px;width:100px}
.i{height:30px}
</style>
<div class=col data-test="col" data-expect="0,0,100,130">
  <div class=i>a</div><div class=i>b</div><div class=i>c</div>
</div>

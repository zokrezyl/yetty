<!doctype html><meta charset=utf-8>
<title>flex-wrap + width:100% + max-width:32%: the hypothetical main size is the
base clamped by max-width (percent resolves against the container), so six
cards lay three-up in two rows — not one full-width card per line (nytimes'
recirculation list idiom).</title>
<style>
body{margin:0}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;width:900px}
.card{width:100%;max-width:32%;height:40px}
</style>
<div class=row>
  <div class=card data-test="a" data-expect="0,0,288,40">a</div>
  <div class=card data-test="b" data-expect="*,0,288,40">b</div>
  <div class=card data-test="c" data-expect="612,0,288,40">c</div>
  <div class=card data-test="d" data-expect="0,40,288,40">d</div>
  <div class=card data-test="e" data-expect="*,40,288,40">e</div>
  <div class=card data-test="f" data-expect="612,40,288,40">f</div>
</div>

<!doctype html><meta charset=utf-8><title>flex-wrap moves an overflowing item to the next line</title>
<style>body{margin:0}</style>
<div style="display:flex;flex-wrap:wrap;width:250px">
  <div data-test="a" data-expect="0,0,100,20" style="width:100px;height:20px;flex:none">a</div>
  <div data-test="b" data-expect="100,0,100,20" style="width:100px;height:20px;flex:none">b</div>
  <div data-test="c" data-expect="0,20,100,20" style="width:100px;height:20px;flex:none">c</div>
</div>

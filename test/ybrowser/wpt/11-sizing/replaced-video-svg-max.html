<!doctype html><meta charset=utf-8>
<title>Replaced-element sizing: a &lt;video&gt; reserves its layout box (attrs,
then the 300x150 replaced default) instead of producing no box, and an svg's
CSS max-width caps the attribute size aspect-preservingly (github NavLink
icons: width attr 24, media-gated max-width:16px).</title>
<style>
body{margin:0}
.capped svg{max-width:16px}
</style>
<video data-test="vattr" data-expect="0,0,320,180" width="320" height="180"></video>
<div><video data-test="vdefault" data-expect="0,180,300,150"></video></div>
<div class=capped>
  <svg data-test="icon" data-expect="0,330,16,16" width="24" height="24" viewBox="0 0 24 24"></svg>
</div>

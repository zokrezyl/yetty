<!doctype html><meta charset=utf-8>
<title>gap declared as var(--x) in a stylesheet resolves through the custom-property
table for grid AND column-flex containers (github Primer: gap:var(--base-size-20);
libcss drops the gap property so the side-table scanner must resolve the var and
rem units itself).</title>
<style>
body{margin:0}
:root{--gap-px:24px;--gap-rem:1.25rem}
.g{display:grid;grid-template-columns:100px 100px;gap:var(--gap-px);width:400px}
.f{display:flex;flex-direction:column;gap:var(--gap-rem);width:200px}
.i{height:30px}
</style>
<div class=g>
  <div class=i data-test="g1" data-expect="0,0,100,30">a</div>
  <div class=i data-test="g2" data-expect="124,0,100,30">b</div>
  <div class=i data-test="g3" data-expect="0,54,100,30">c</div>
</div>
<div class=f>
  <div class=i data-test="f1" data-expect="0,84,*,30">x</div>
  <div class=i data-test="f2" data-expect="0,134,*,30">y</div>
</div>

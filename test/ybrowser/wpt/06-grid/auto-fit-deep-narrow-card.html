<!doctype html><meta charset=utf-8>
<title>repeat(auto-fit,max-content) single-row grid keeps ONE row even when one
card is both narrow and deep (github NavDropdown: a 27-descendant card measuring
under half the widest track must not demote the grid to block flow — the
misplaced-content guard only applies to fixed/fr tracks).</title>
<style>
body{margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,max-content);grid-auto-flow:column;column-gap:20px;width:900px}
.wide{width:150px;height:40px}
.narrow{width:60px}
.narrow div{width:60px;height:1px}
</style>
<div class=g>
  <div data-test="c1" data-expect="0,0,150,*"><div class=wide>a</div></div>
  <div data-test="c2" data-expect="170,0,150,*"><div class=wide>b</div></div>
  <div data-test="c3" data-expect="340,0,150,*"><div class=wide>c</div></div>
  <div data-test="c4" data-expect="510,0,60,*" class=narrow>
    <div><div><div><div><div><div><div></div></div></div></div></div></div></div>
    <div><div><div><div><div><div><div></div></div></div></div></div></div></div>
    <div><div><div><div><div><div><div></div></div></div></div></div></div></div>
    <div><div><div><div><div><div><div></div></div></div></div></div></div></div>
  </div>
</div>

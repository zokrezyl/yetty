<!doctype html><meta charset=utf-8>
<title>CSS order participates in grid auto-placement (order-modified document
order): a DOM-first item with order:2 flows into the second column, the
order:1 sibling takes the first (github Primer section templates swap their
two 6-span columns this way).</title>
<style>
body{margin:0}
.g{display:grid;grid-template-columns:100px 100px;width:200px}
.second{order:2;height:40px}
.first{order:1;height:40px}
</style>
<div class=g>
  <div class=second data-test="visual"    data-expect="100,0,100,40">v</div>
  <div class=first  data-test="accordion" data-expect="0,0,100,40">a</div>
</div>

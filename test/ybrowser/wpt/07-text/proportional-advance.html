<!doctype html><meta charset=utf-8>
<title>Default text metrics are proportional Helvetica/Arial advances, not a flat
ratio: "Hello" at 100px = H722+e556+l222+l222+o556 = 227.8px; monospace
families use the 0.602em terminal advance (3 glyphs at 100px = 180.6px).</title>
<style>body{margin:0}</style>
<div style="font-size:100px">
  <div data-test="prop" data-expect="*,*,227.8,*" style="display:inline-block">Hello</div>
</div>
<div style="font-size:100px;font-family:monospace">
  <div data-test="mono" data-expect="*,*,180.6,*" style="display:inline-block">abc</div>
</div>

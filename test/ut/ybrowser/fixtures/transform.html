<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { font-family: monospace; font-size: 16px; margin: 0; padding: 0; }
</style>
</head>
<body>
  <!-- transform: translate() (inline, as JS-driven sites emit it) visually
       shifts the box without affecting flow. The last box combines an
       absolute position with the translate(-50%,-50%) centering idiom. -->
  <div data-test="t1" style="width:100px; height:40px; transform:translate(200px,50px)">A</div>
  <div data-test="t2" style="width:100px; height:40px; transform:translateX(120px)">B</div>
  <div data-test="t3" style="width:100px; height:40px; transform:translateY(80px)">C</div>
  <div data-test="cen" style="position:absolute; top:200px; left:300px; width:60px; height:20px; transform:translate(-50%,-50%)">mid</div>

  <pre id="geom" style="display:none"></pre>
  <script>
  (function () {
      var out = {};
      document.querySelectorAll('[data-test]').forEach(function (el) {
          var r = el.getBoundingClientRect();
          out[el.getAttribute('data-test')] = {
              x: Math.round(r.x * 100) / 100, y: Math.round(r.y * 100) / 100,
              w: Math.round(r.width * 100) / 100, h: Math.round(r.height * 100) / 100
          };
      });
      out['_viewport'] = { w: window.innerWidth, h: window.innerHeight };
      document.getElementById('geom').textContent = JSON.stringify(out);
  })();
  </script>
</body>
</html>

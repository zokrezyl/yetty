# QEMU args for standalone qemu-system-riscv64 invocation.
#
# Loaded by ./tools/qemu.sh. One whitespace-separated qemu argument per
# (logical) line. Lines starting with '#' are comments. The token
# $YETTY_RUNTIME_DIR is expanded by the launcher (it sets
# YETTY_RUNTIME_DIR=$HOME/.local/share/yetty before sourcing this).
#
# Difference vs yetty-qemu.ini: console is mux'd on stdio (so you can
# type into the guest and see kernel output directly). No telnet chardev.

-machine virt
-smp 1
-m 256
-bios $YETTY_RUNTIME_DIR/yemu/opensbi-fw_dynamic.bin
-kernel $YETTY_RUNTIME_DIR/yemu/kernel-riscv64.bin
-append "earlycon=sbi console=hvc0 root=/dev/vda rw init=/init"
-drive file=$YETTY_RUNTIME_DIR/yemu/alpine-rootfs.img,if=none,format=raw,id=hd0
-device virtio-blk-device,drive=hd0
-netdev user,id=net0
-device virtio-net-device,netdev=net0
-device virtio-serial-device
-device virtconsole,chardev=char0
-chardev stdio,id=char0,signal=off
-serial none
-display none
-no-reboot
-no-shutdown

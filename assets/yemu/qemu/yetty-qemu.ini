# QEMU args for the yetty-managed qemu invocation.
#
# Loaded by src/yetty/yqemu/qemu.c (planned refactor). One qemu arg per
# (logical) line. The tokens $YETTY_RUNTIME_DIR, $YETTY_CONFIG_DIR and
# $YETTY_QEMU_PORT are expanded by the loader at spawn time.
#
# Difference vs qemu-qemu.ini: chardev is a server TCP socket that
# yetty's telnet_pty connects to (host=127.0.0.1, port=YETTY_QEMU_PORT,
# server=on, wait=off, no telnet=on — see qemu.c notes). Also exposes
# $YETTY_CONFIG_DIR/qemu/share over 9p as mount_tag=hostshare for
# host<->guest file exchange.

-machine virt
-smp 1
-m 256
-bios $YETTY_RUNTIME_DIR/yemu/opensbi-fw_dynamic.bin
-kernel $YETTY_RUNTIME_DIR/yemu/kernel-riscv64.bin
-append "earlycon=sbi console=hvc0 root=/dev/vda rw init=/init"
-drive file=$YETTY_RUNTIME_DIR/yemu/alpine-rootfs.img,if=none,format=raw,id=hd0
-device virtio-blk-device,drive=hd0
-fsdev local,id=fsdev0,path=$YETTY_CONFIG_DIR/qemu/share,security_model=none
-device virtio-9p-device,fsdev=fsdev0,mount_tag=hostshare
-netdev user,id=net0
-device virtio-net-device,netdev=net0
-device virtio-serial-device
-device virtconsole,chardev=char0
-chardev socket,id=char0,host=127.0.0.1,port=$YETTY_QEMU_PORT,server=on,wait=off
-serial none
-display none
-no-reboot
-no-shutdown

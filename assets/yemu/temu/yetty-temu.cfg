/* TinyEMU VM Configuration - yetty embedded launcher (--temu)
 *
 * Loaded by src/yetty/yplatform/shared/tinyemu-pty.c. File paths support
 * $YETTY_* env-var references (see expand_env_vars in
 * src/tinyemu/machine.c). Yetty's platform layer sets these at startup.
 *
 * Boots a RISC-V 64 Linux kernel from an ext4 root image via virtio-blk.
 * Yetty bridges hvc0 to its terminal renderer through the shared
 * tinyemu-pty.c pipe pair (terminal->os_input_pipe, pty_pipe->terminal).
 *
 * Differences vs temu-temu.cfg: none today. We keep two files so they
 * can diverge (e.g. add a virtio-console for telnet/runit on the yetty
 * side without breaking the standalone temu test path).
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "$YETTY_RUNTIME_DIR/yemu/opensbi-fw_jump.elf",
    kernel: "$YETTY_RUNTIME_DIR/yemu/kernel-riscv64.bin",
    cmdline: "earlycon=sbi console=hvc0 root=/dev/vda rootfstype=ext4 rw init=/init",
    drive0: { file: "$YETTY_RUNTIME_DIR/yemu/alpine-rootfs.img" },
    eth0: { driver: "user" }
}

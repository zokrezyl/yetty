/* TinyEMU VM Configuration - yetty embedded launcher (--temu, extended rootfs)
 *
 * Loaded by src/yetty/yplatform/shared/tinyemu-pty.c when --temu is active.
 * File paths support $YETTY_* env-var references (see expand_env_vars in
 * src/tinyemu/machine.c). Yetty's platform layer sets these at startup.
 *
 * Boots the unified yetty-rootfs-riscv image: alpine-extended userland
 * (Alpine + dev tools + busybox-extras telnetd supervised by runit) with
 * /yetty/{bin,repo} layered on top (cross-compiled riscv64 demos+tools +
 * `git archive HEAD`). Replaces the two-drive setup that previously
 * mounted yetty-riscv-disk.img separately at /opt/yetty.
 *
 * The slirp hostfwd exposes the in-guest telnetd on host 127.0.0.1:2323.
 *
 * Differences vs temu-temu-extended.cfg: none today. We keep two files so
 * the yetty consumer side can diverge from the standalone temu test path.
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "$YETTY_DATA_DIR/yemu/opensbi-fw_jump.elf",
    kernel: "$YETTY_DATA_DIR/yemu/kernel-riscv64.bin",
    cmdline: "earlycon=sbi console=hvc0 root=/dev/vda rootfstype=ext4 rw init=/init",
    drive0: { file: "$YETTY_DATA_DIR/yemu/yetty-rootfs-riscv.img" },
    eth0: { driver: "user", hostfwd: ["tcp:2323-:23"] }
}

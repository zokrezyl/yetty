/* TinyEMU VM Configuration - standalone temu binary
 *
 * Used by ./tools/temu.sh which sets YETTY_RUNTIME_DIR. File paths
 * support $YETTY_* env-var references (see expand_env_vars in
 * src/tinyemu/machine.c).
 *
 * Boots a RISC-V 64 Linux kernel from an ext4 root image via virtio-blk.
 * No virtio-console pseudo-tty bridge: console is the standard tinyemu
 * stdin/stdout pair (-> hvc0). Use C-a x to exit.
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "$YETTY_RUNTIME_DIR/yemu/opensbi-fw_jump.elf",
    kernel: "$YETTY_RUNTIME_DIR/yemu/kernel-riscv64.bin",
    cmdline: "earlycon=sbi console=hvc0 root=/dev/vda rootfstype=ext4 rw init=/init",
    drive0: { file: "$YETTY_RUNTIME_DIR/yemu/alpine-rootfs.img" },
    eth0: { driver: "user" }
}

/* TinyEMU VM Configuration - standalone temu binary (extended rootfs)
 *
 * Same as temu-temu.cfg but boots the unified yetty-rootfs-riscv image:
 * alpine-extended userland + /yetty/{bin,repo} layered on top in one
 * ext4. Replaces the previous two-drive setup (alpine-extended-rootfs.img
 * + yetty-riscv-disk.img).
 *
 * Used by ./tools/temu-extended.sh which sets YETTY_RUNTIME_DIR. File paths
 * support $YETTY_* env-var references (see expand_env_vars in
 * src/tinyemu/machine.c).
 *
 * No virtio-console pseudo-tty bridge: console is the standard tinyemu
 * stdin/stdout pair (-> hvc0). Use C-a x to exit.
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "$YETTY_RUNTIME_DIR/yemu/opensbi-fw_jump.elf",
    kernel: "$YETTY_RUNTIME_DIR/yemu/kernel-riscv64.bin",
    cmdline: "earlycon=sbi console=hvc0 root=/dev/vda rootfstype=ext4 rw init=/init",
    drive0: { file: "$YETTY_RUNTIME_DIR/yemu/yetty-rootfs-riscv.img" },
    eth0: { driver: "user", hostfwd: ["tcp:2323-:23"] }
}

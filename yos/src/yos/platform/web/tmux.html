<!doctype html>
<meta charset="utf-8" />
<title>real tmux.wasm in the browser</title>
<link rel="stylesheet" href="./vendor/xterm.min.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0b1014; }
  #term { width: 100vw; height: 100vh; }
</style>
<div id="term"></div>
<script src="./vendor/xterm.min.js"></script>
<script src="./vendor/addon-fit.min.js"></script>
<script>
  window.addEventListener("error", (e) => { window.__err = String(e.error?.stack || e.message); });
  window.addEventListener("unhandledrejection", (e) => { window.__err = String(e.reason?.stack || e.reason); });
</script>
<script type="module" src="./tmux_main.mjs"></script>

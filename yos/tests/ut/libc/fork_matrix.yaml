    description: |
      child gettimeofday — tv_sec must be > 0 (we're well past
      the epoch). Exercises struct timeval out-param.
    externs:
      - "int gettimeofday(void *, void *);"
    body: |
      int tv[2] = {0, 0};
      if (gettimeofday(tv, 0) != 0) return 105;
      if (tv[0] <= 0) return 106;
      const char *msg = "child-gettimeofday-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-gettimeofday-ok"


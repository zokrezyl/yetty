  - name: link_unlink_roundtrip
    description: |
      child creates file A, link(A, B), unlink(A), opens B
      for read — must still succeed (B is the same inode).
      Verifies link(2) and unlink(2) under post-fork fd state.
    externs:
      - "int open(const char *, int, ...);"
      - "int close(int);"
      - "int unlink(const char *);"
      - "int link(const char *, const char *);"
      - "int read(int, void *, unsigned int);"
      - "int getpid(void);"
    body: |
      char a[40], b[40];
      const char *pa = "/tmp/yos-fork-lnk-A-";
      const char *pb = "/tmp/yos-fork-lnk-B-";
      int i = 0;
      for (; pa[i]; ++i) a[i] = pa[i];
      int j = 0;
      for (; pb[j]; ++j) b[j] = pb[j];
      int pid = getpid();
      if (pid < 0) return 72;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      int saved_t = t;
      while (t--) a[i++] = tmp[t];
      a[i] = 0;
      t = saved_t;
      while (t--) b[j++] = tmp[t];
      b[j] = 0;

      int fd = open(a, 0x602, 0644);
      if (fd < 0) return 73;
      if (write(fd, "linked", 6) != 6) { close(fd); unlink(a); return 74; }
      close(fd);
      if (link(a, b) != 0)              { unlink(a); return 75; }
      if (unlink(a) != 0)               { unlink(b); return 76; }
      int rfd = open(b, 0, 0);  /* O_RDONLY = 0 */
      if (rfd < 0)                      { unlink(b); return 77; }
      char rb[6] = {0};
      if (read(rfd, rb, 6) != 6)        { close(rfd); unlink(b); return 78; }
      close(rfd);
      unlink(b);
      for (int k = 0; k < 6; ++k)
          if (rb[k] != "linked"[k]) return 79;
      const char *msg = "child-link-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-link-ok"

  - name: rename_basic
    description: |
      child creates file A, rename(A, B), opens B — A is gone, B
      has the contents. Catches "rename collapses to copy+unlink"
      and "rename across cwd-relative paths breaks".
    externs:
      - "int open(const char *, int, ...);"
      - "int close(int);"
      - "int unlink(const char *);"
      - "int rename(const char *, const char *);"
      - "int read(int, void *, unsigned int);"
      - "int getpid(void);"
    body: |
      char a[40], b[40];
      const char *pa = "/tmp/yos-fork-rn-A-";
      const char *pb = "/tmp/yos-fork-rn-B-";
      int i = 0;
      for (; pa[i]; ++i) a[i] = pa[i];
      int j = 0;
      for (; pb[j]; ++j) b[j] = pb[j];
      int pid = getpid();
      if (pid < 0) return 80;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      int saved_t = t;
      while (t--) a[i++] = tmp[t];
      a[i] = 0;
      t = saved_t;
      while (t--) b[j++] = tmp[t];
      b[j] = 0;

      int fd = open(a, 0x602, 0644);
      if (fd < 0) return 81;
      if (write(fd, "renamed!", 8) != 8) { close(fd); unlink(a); return 82; }
      close(fd);
      if (rename(a, b) != 0)              { unlink(a); return 83; }
      int rfd = open(b, 0, 0);
      if (rfd < 0)                        { unlink(b); return 84; }
      char rb[8] = {0};
      if (read(rfd, rb, 8) != 8)          { close(rfd); unlink(b); return 85; }
      close(rfd);
      unlink(b);
      for (int k = 0; k < 8; ++k)
          if (rb[k] != "renamed!"[k]) return 86;
      const char *msg = "child-rename-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-rename-ok"

  # ── FILE* (stream) ops ──

  - name: fopen_fwrite_fclose_roundtrip
    description: |
      child fopen "w", fwrites, fcloses; then fopen "r", freads,
      checks contents. Stresses the host FILE* table across a
      fork — every FILE* the child opens is its own slot.
    externs:
      - "void *fopen(const char *, const char *);"
      - "int   fclose(void *);"
      - "unsigned int fwrite(const void *, unsigned int, unsigned int, void *);"
      - "unsigned int fread(void *, unsigned int, unsigned int, void *);"
      - "int   unlink(const char *);"
      - "int   getpid(void);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-fp-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 87;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      void *w = fopen(path, "w");
      if (!w) return 88;
      if (fwrite("hello-fp", 1, 8, w) != 8) { fclose(w); unlink(path); return 89; }
      fclose(w);

      void *r = fopen(path, "r");
      if (!r) { unlink(path); return 90; }
      char rb[8] = {0};
      if (fread(rb, 1, 8, r) != 8) { fclose(r); unlink(path); return 91; }
      fclose(r);
      unlink(path);

      for (int k = 0; k < 8; ++k)
          if (rb[k] != "hello-fp"[k]) return 92;
      const char *msg = "child-fopen-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-fopen-ok"

  # ── variadic ──

  - name: snprintf_basic
    description: |
      child snprintf("[%d]", 42) into a buffer, checks contents.
      Exercises the variadic bridge path — wasm has no `...` so
      the guest libc packs args into a typed-tag array, the
      bridge unpacks and forwards to host vsnprintf.
    externs:
      - "int snprintf(char *, unsigned int, const char *, ...);"
      - "int strcmp(const char *, const char *);"
    body: |
      char buf[16] = {0};
      int n = snprintf(buf, sizeof buf, "[%d]", 42);
      if (n != 4) return 93;
      if (strcmp(buf, "[42]") != 0) return 94;
      const char *msg = "child-snprintf-ok\n";

  # ── memory / utility ──

  - name: posix_memalign_aligned
    description: |
      child posix_memalign(&p, 64, 256) — returns 0, p is non-NULL
      and 64-byte aligned. The wasm address is in linear memory;
      "aligned" means the wasm offset divides 64.
    externs:
      - "int   posix_memalign(void **, unsigned int, unsigned int);"
      - "void  free(void *);"
    body: |
      void *p = 0;
      if (posix_memalign(&p, 64, 256) != 0) return 113;
      if (!p) return 114;
      unsigned int addr = (unsigned int)(unsigned long)p;
      if (addr & 63) return 115;
      free(p);
      const char *msg = "child-posix-memalign-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-posix-memalign-ok"

  - name: qsort_int_array
    description: |
      child qsorts a 6-element int array in descending order
      then ascending. Forces the bridge to invoke the wasm-side
      comparator callback function pointer through the function
      table — the runtime_owned callback path that was added
      specifically for qsort/bsearch/scandir.
    externs:
      - "void qsort(void *, unsigned int, unsigned int, int (*)(const void *, const void *));"
    prep_globals: |
      static int cmp_asc(const void *a, const void *b) {
          int ia = *(const int *)a, ib = *(const int *)b;
          return (ia > ib) - (ia < ib);
      }
    body: |
      int arr[6] = {5, 1, 4, 2, 6, 3};
      qsort(arr, 6, sizeof(int), cmp_asc);
      for (int k = 0; k < 6; ++k) if (arr[k] != k + 1) return 116;
      const char *msg = "child-qsort-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-qsort-ok"

  - name: strerror_known_errno
    description: |
      child strerror(EACCES = 13) returns a non-empty string.
      Catches the case where strerror is stubbed to return ""
      or NULL, which leaks "Undefined error: 0" through ls / ssh
      diagnostics.
    externs:
      - "char *strerror(int);"
    body: |
      const char *s = strerror(13);  /* EACCES */
      if (!s)        return 117;
      if (s[0] == 0) return 118;
      const char *msg = "child-strerror-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-strerror-ok"

  - name: open_nonexistent_negative
    description: |
      child opens "/nonexistent-yos-fork-test" with O_RDONLY —
      must return -1 (negative). Confirms that error paths
      propagate properly across the bridge after fork; if open
      returned 0 (a valid fd) post-fork, every error-check in
      every guest application would silently miss.
    externs:
      - "int open(const char *, int, ...);"
    body: |
      int fd = open("/nonexistent-yos-fork-test-xyzzy", 0, 0);
      if (fd >= 0) return 119;
      const char *msg = "child-open-enoent-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-open-enoent-ok"

  # ─── Tier-D: cross-process isolation.  Every row here asserts
  # the SAME thing in a different domain: the child mutating a
  # libc-owned global must NOT leak back into the parent. The
  # earlier tiers test "does X work in the child". This tier
  # tests "if the child does X, does the parent's pre-fork X
  # survive". Per fork(2) semantics, each side has its own copy
  # of every global — but only if every global is actually
  # per-ctx in yos. Globals that aren't (umask, rand state,
  # static-return buffers) are real isolation bugs.

  - name: iso_errno_parent_unchanged
    description: |
      Parent triggers ENOENT (open fail), captures errno; fork;
      child triggers EBADF (close bad fd) so its errno != ENOENT;
      child exits; parent's errno MUST still read ENOENT, not the
      child's EBADF. errno is required to be thread-local per
      POSIX; yos uses glibc TLS for it.
    externs:
      - "int  open(const char *, int, ...);"
      - "int  close(int);"
      - "int *__error(void);"
    prep_globals: |
      static int parent_errno_before;
    prep: |
      (void)open("/nonexistent-yos-iso-errno-parent", 0, 0);
      parent_errno_before = *__error();
      if (parent_errno_before == 0) {
          emit("HARNESS:parent open didnt set errno\n"); _exit(123);
      }
    body: |
      /* Child must observe a DIFFERENT errno than parent's ENOENT. */
      (void)close(99);
      int child_errno = *__error();
      if (child_errno == 0)                    return 50;
      if (child_errno == parent_errno_before)  return 51;
      return 0;
    post_wait: |
      int parent_errno_after = *__error();
      if (parent_errno_after != parent_errno_before) {
          emit("FAIL: parent errno mutated across fork\n");
          _exit(60);
      }
      emit("iso-errno-ok\n");
    expected_exit: 0
    expected_stdout: "iso-errno-ok"

  - name: iso_environ_parent_unchanged
    description: |
      Parent setenv(K, parent-val); fork; child setenv(K, child-val)
      and verifies its own getenv sees child-val; child exits;
      parent's getenv(K) MUST still return parent-val. Per
      libc.yaml policy `environ` is per-ctx, so this should
      pass — if it fails, that policy is broken in practice.
    externs:
      - "int   setenv(const char *, const char *, int);"
      - "char *getenv(const char *);"
    prep: |
      if (setenv("YOS_ISO_ENV_K", "parent-val", 1) != 0) {
          emit("HARNESS:parent setenv failed\n"); _exit(123);
      }
    body: |
      if (setenv("YOS_ISO_ENV_K", "child-val", 1) != 0) return 52;
      const char *v = getenv("YOS_ISO_ENV_K");
      if (!v) return 53;
      /* Spell-check first byte: must be 'c' (child-val) not 'p'. */
      if (v[0] != 'c') return 54;
      return 0;
    post_wait: |
      const char *vp = getenv("YOS_ISO_ENV_K");
      if (!vp || vp[0] != 'p') {
          emit("FAIL: parent environ corrupted by child\n");
          _exit(61);

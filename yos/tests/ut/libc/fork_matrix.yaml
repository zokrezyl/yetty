# tests/ut/libc/fork_matrix.yaml — parametrised fork-child test matrix.
#
# Each row describes ONE wasm test: parent forks, child runs a libc
# sequence, child returns 0 on success or 1..119 on failure. The
# harness (gen_fork_matrix.py + the .c template inside it) wraps
# every row with the same fork/waitpid scaffold, so the row body
# only needs to talk to the libc surface under test.
#
# The point of this matrix is the OPPOSITE of test_libc_coverage.c
# (the umbrella that runs everything in one process and never forks).
# Here every row is a SEPARATE wasm binary and a SEPARATE meson
# test — if any one row hangs or traps, the others still report.
# That matters because most of the libc surface has never been
# exercised from a post-fork child, and we don't yet know which
# rows trip the asyncify fork dance.
#
# Schema per row:
#   name           : short tag, used to form test_fork_child_<name>
#   description    : one-line summary of what the child does
#   externs        : list of C extern declarations the body needs
#                    (kept per-row so a body that uses uncommon
#                    functions doesn't drag them into every test;
#                    common ones go in `prologue.externs` below).
#                    Variadic FreeBSD prototypes (open, fcntl,
#                    ioctl, printf-family, …) MUST be declared
#                    `int f(args, ...)` not `int f(args, last_t)`.
#                    On wasm32, clang lowers variadic calls via a
#                    va_list shadow-stack pointer; the matching
#                    yos bridges dereference that pointer to get
#                    the variadic arg. A non-variadic test
#                    declaration emits a direct-arg call and yos
#                    reads garbage from offset 0/4/… of memory.
#   prep_globals   : optional file-scope declarations (e.g.
#                    `static int parent_pid;`) — visible to both
#                    parent prep and child_body via the linear
#                    memory snapshot fork takes
#   prep           : optional C statements run in the PARENT
#                    before fork (e.g. parent_pid = getpid()) —
#                    operates on whatever prep_globals declared
#   post_wait      : optional C statements run in the PARENT after
#                    waitpid() returns, before the final _exit. Use
#                    this when the child writes its evidence to a
#                    pipe instead of stdout and the parent has to
#                    re-emit it on stdout so the runner's
#                    `expected_stdout` substring check fires. The
#                    int `st` is in scope (waitpid's status word).
#   body           : C statements run inside the forked child. Must
#                    end with `return 0;` for success or `return N;`
#                    (1..119) for a distinct failure code. The harness
#                    will _exit() the child with that code, and the
#                    parent propagates it as its own exit code.
#   expected_exit  : the exit code run_libc_test.py asserts
#   expected_stdout: optional substring run_libc_test.py asserts
#   asyncify       : true (default) — every row forks, so every row
#                    needs the wasm-opt --asyncify pass. Set false
#                    only for a row that's a known-can't-asyncify
#                    pathology (none yet).
#   xfail          : true if this row is a known-failing pin for an
#                    open bug. Test still runs; meson reports
#                    UNEXPECTEDPASS when fixed so the entry can be
#                    removed.
#   notes          : free-form, surfaces in the generated .c header

prologue:
  # Externs shared by every generated row. The fork/waitpid/_exit
  # scaffold needs these; the harness adds them unconditionally.
  externs:
    - "int  fork(void);"
    - "int  waitpid(int, int *, int);"
    - "void _exit(int) __attribute__((noreturn));"
    - "int  write(int, const void *, unsigned int);"
    - "unsigned int strlen(const char *);"

rows:

  # ─── Tier-A: should-pass smoke rows.  Verify the harness itself
  # works end-to-end and that the obvious passthroughs survive the
  # fork-asyncify dance. If any of these fail, the harness is broken
  # — investigate before reading anything else.

  - name: write_stdout
    description: child writes one line to fd 1 via passthrough
    externs: []
    body: |
      const char *msg = "child-write-ok\n";
      if (write(1, msg, (unsigned)strlen(msg)) != (int)strlen(msg)) return 1;
      return 0;
    expected_exit: 0
    expected_stdout: "child-write-ok"

  - name: getpid_ne_parent
    description: child's getpid() must differ from parent's
    externs:
      - "int getpid(void);"
    prep_globals: |
      static int parent_pid;
    prep: |
      parent_pid = getpid();
    body: |
      int my = getpid();
      if (my == parent_pid) return 2;
      if (my <= 0)          return 3;
      const char *msg = "child-pid-distinct\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-pid-distinct"

  - name: malloc_free
    description: child allocates 64B, fills, frees
    externs:
      - "void *malloc(unsigned int);"
      - "void  free(void *);"
    body: |
      char *p = (char *)malloc(64);
      if (!p) return 4;
      for (int i = 0; i < 64; ++i) p[i] = (char)(i & 0x7f);
      for (int i = 0; i < 64; ++i) if (p[i] != (char)(i & 0x7f)) return 5;
      free(p);
      const char *msg = "child-malloc-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-malloc-ok"

  - name: realloc_grow
    description: child malloc(16) → realloc(128); contents preserved
    externs:
      - "void *malloc(unsigned int);"
      - "void *realloc(void *, unsigned int);"
      - "void  free(void *);"
    body: |
      char *p = (char *)malloc(16);
      if (!p) return 6;
      for (int i = 0; i < 16; ++i) p[i] = (char)(i + 'A');
      char *q = (char *)realloc(p, 128);
      if (!q) return 7;
      for (int i = 0; i < 16; ++i) if (q[i] != (char)(i + 'A')) return 8;
      free(q);
      const char *msg = "child-realloc-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-realloc-ok"

  - name: calloc_zero
    description: child calloc(32,1) — every byte must read back zero
    externs:
      - "void *calloc(unsigned int, unsigned int);"
      - "void  free(void *);"
    body: |
      unsigned char *p = (unsigned char *)calloc(32, 1);
      if (!p) return 9;
      for (int i = 0; i < 32; ++i) if (p[i] != 0) return 10;
      free(p);
      const char *msg = "child-calloc-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-calloc-ok"

  - name: getenv_inherited
    description: child reads PATH (set by host) — should match parent
    externs:
      - "char *getenv(const char *);"
    body: |
      const char *v = getenv("PATH");
      if (!v)         return 11;
      if (v[0] == 0)  return 12;
      const char *msg = "child-getenv-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-getenv-ok"

  # ─── Tier-B: things the user flagged as likely-uncovered.  These
  # are the actual coverage win — every row here exercises a libc
  # surface the existing fork tests don't touch.

  - name: setenv_child_only
    description: |
      child setenv(YOS_FORK_TEST=child), getenv reads it back.
      Verifies env mutation INSIDE the child doesn't trip a
      shared-environ bug between yos exec_ctx copies.
    externs:
      - "int   setenv(const char *, const char *, int);"
      - "char *getenv(const char *);"
    body: |
      if (setenv("YOS_FORK_TEST_KEY", "child-value", 1) != 0) return 13;
      const char *v = getenv("YOS_FORK_TEST_KEY");
      if (!v)                   return 14;
      if (v[0] != 'c' || v[1] != 'h' || v[2] != 'i' || v[3] != 'l' ||
          v[4] != 'd')          return 15;
      const char *msg = "child-setenv-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-setenv-ok"

  - name: unsetenv_clears
    description: child unsetenv on a key it just set; getenv → NULL
    externs:
      - "int   setenv(const char *, const char *, int);"
      - "int   unsetenv(const char *);"
      - "char *getenv(const char *);"
    body: |
      if (setenv("YOS_FORK_TMP_K", "v", 1) != 0)        return 16;
      if (unsetenv("YOS_FORK_TMP_K") != 0)              return 17;
      if (getenv("YOS_FORK_TMP_K") != (char *)0)        return 18;
      const char *msg = "child-unsetenv-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-unsetenv-ok"

  - name: open_write_read_unlink_tmpfile
    description: |
      child creates /tmp/yos-fork-<pid>, writes 8 bytes, lseek(0),
      reads them back, unlinks. Exercises the full custom_vfs path
      across a post-fork fd-map handoff.
    externs:
      - "int open(const char *, int, ...);"
      - "int       close(int);"
      - "long long lseek(int, long long, int);"
      - "int       unlink(const char *);"
      - "int       getpid(void);"
      - "int       read(int, void *, unsigned int);"
    body: |
      /* /tmp/yos-fork-<pid>\0 — pid as decimal, up to 10 digits. */
      char path[40];
      const char *pfx = "/tmp/yos-fork-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 19;
      /* itoa-lite */
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      /* O_RDWR | O_CREAT | O_TRUNC ≈ 0x202 (FreeBSD), mode 0644. */
      int fd = open(path, 0x602, 0644);
      if (fd < 0) return 20;

      const char *buf = "deadbeef";
      if (write(fd, buf, 8) != 8) { close(fd); unlink(path); return 21; }

      if (lseek(fd, 0, 0) != 0) { close(fd); unlink(path); return 22; }

      char rb[8] = {0};
      if (read(fd, rb, 8) != 8)  { close(fd); unlink(path); return 23; }
      for (int j = 0; j < 8; ++j) if (rb[j] != buf[j]) {
          close(fd); unlink(path); return 24;
      }

      close(fd);
      unlink(path);
      const char *msg = "child-file-rw-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-file-rw-ok"

  - name: pread_pwrite_offset
    description: |
      child pwrite at offset 4, then pread from offset 4 — must
      not require an explicit lseek. Catches "pread translated to
      read + manual lseek" mistakes in the bridge.
    externs:
      - "int open(const char *, int, ...);"
      - "int       close(int);"
      - "int       unlink(const char *);"
      - "int       getpid(void);"
      - "int       pread(int, void *, unsigned int, long long);"
      - "int       pwrite(int, const void *, unsigned int, long long);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-pr-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 25;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      int fd = open(path, 0x602, 0644);
      if (fd < 0) return 26;

      const char *payload = "ZYXW";
      if (pwrite(fd, payload, 4, 4) != 4) { close(fd); unlink(path); return 27; }

      char rb[4] = {0};
      if (pread(fd, rb, 4, 4) != 4)       { close(fd); unlink(path); return 28; }
      for (int j = 0; j < 4; ++j) if (rb[j] != payload[j]) {
          close(fd); unlink(path); return 29;
      }

      close(fd);
      unlink(path);
      const char *msg = "child-pread-pwrite-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-pread-pwrite-ok"

  - name: dup_then_write
    description: child dup(1), writes to the dup, closes the dup
    externs:
      - "int dup(int);"
      - "int close(int);"
    body: |
      int d = dup(1);
      if (d < 0)                return 30;
      const char *msg = "child-dup-write-ok\n";
      if (write(d, msg, (unsigned)strlen(msg)) != (int)strlen(msg)) {
          close(d); return 31;
      }
      close(d);
      return 0;
    expected_exit: 0
    expected_stdout: "child-dup-write-ok"

  - name: mkdir_rmdir
    description: child mkdir/rmdir on a per-pid path under /tmp
    externs:
      - "int mkdir(const char *, unsigned short);"
      - "int rmdir(const char *);"
      - "int getpid(void);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-d-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 32;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      if (mkdir(path, 0755) != 0) return 33;
      if (rmdir(path) != 0)       return 34;

      const char *msg = "child-mkdir-rmdir-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-mkdir-rmdir-ok"

  - name: socket_close
    description: |
      child socket(AF_INET, SOCK_STREAM, 0) then close. Tests
      whether SOCKET creation works at all in a forked child —
      the parent's fd_map is snapshot+restore'd, fresh socket
      allocation in the child has been untested.
    externs:
      - "int socket(int, int, int);"
      - "int close(int);"
    body: |
      /* AF_INET=2 (FreeBSD), SOCK_STREAM=1 */
      int s = socket(2, 1, 0);
      if (s < 0) return 35;
      if (close(s) != 0) return 36;
      const char *msg = "child-socket-close-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-socket-close-ok"

  - name: socketpair_then_pingpong
    description: |
      child socketpair(AF_UNIX, SOCK_STREAM, 0, sv), writes 4 bytes
      to sv[0], reads them back from sv[1], closes both.
    externs:
      - "int socketpair(int, int, int, int *);"
      - "int close(int);"
      - "int read(int, void *, unsigned int);"
    body: |
      int sv[2] = {-1, -1};
      /* AF_UNIX=1, SOCK_STREAM=1 */
      if (socketpair(1, 1, 0, sv) != 0)                return 37;
      if (sv[0] < 0 || sv[1] < 0)                      return 38;
      if (write(sv[0], "ping", 4) != 4)                return 39;
      char rb[4] = {0};
      if (read(sv[1], rb, 4) != 4)                     return 40;
      if (rb[0] != 'p' || rb[1] != 'i' ||
          rb[2] != 'n' || rb[3] != 'g')                return 41;
      close(sv[0]); close(sv[1]);
      const char *msg = "child-socketpair-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-socketpair-ok"

  - name: arc4random_buf_nonzero
    description: |
      child fills 32 B via arc4random_buf and asserts at least one
      byte is non-zero (∼2⁻²⁵⁶ false-fail rate). Verifies the host's
      RNG is reachable from inside the forked child.
    externs:
      - "void arc4random_buf(void *, unsigned int);"
    body: |
      unsigned char b[32];
      for (int i = 0; i < 32; ++i) b[i] = 0;
      arc4random_buf(b, 32);
      int any = 0;
      for (int i = 0; i < 32; ++i) if (b[i]) { any = 1; break; }
      if (!any) return 42;
      const char *msg = "child-arc4random-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-arc4random-ok"

  - name: usleep_short
    description: child sleeps 1 ms via usleep — just needs to return 0
    externs:
      - "int usleep(unsigned int);"
    body: |
      if (usleep(1000) != 0) return 43;
      const char *msg = "child-usleep-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-usleep-ok"

  - name: isatty_pipe_false
    description: |
      child fstat-less isatty check on a fresh socketpair end —
      MUST return 0 (not a tty). Catches an early bug-class where
      every fd reports as tty post-fork.
    externs:
      - "int socketpair(int, int, int, int *);"
      - "int close(int);"
      - "int isatty(int);"
    body: |
      int sv[2] = {-1, -1};
      if (socketpair(1, 1, 0, sv) != 0) return 44;
      int r = isatty(sv[0]);
      close(sv[0]); close(sv[1]);
      if (r != 0) return 45;
      const char *msg = "child-isatty-zero-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-isatty-zero-ok"

  # ─── Tier-C: post-fork libc surfaces that have never been
  # systematically exercised.  Each row probes one bridge family
  # that the existing fork tests (basic / stderr-clean / channel-
  # from-stdio) never touch.  Expect some of these to fail when
  # first run — that's the point: every failure here is a real bug
  # report with a clear repro, not a coverage hole.

  # ── file ops beyond open/read/write/close/lseek/dup ──

  - name: fcntl_getfl_setfl_nonblock
    description: |
      F_GETFL + F_SETFL round-trip on a pipe end. Sets O_NONBLOCK
      and reads it back. fcntl is variadic in FreeBSD — the third
      arg (when present) is passed through clang's wasm32 va_list
      shadow-stack ABI. Declaring fcntl non-variadic in the test
      makes clang emit a direct-arg call instead, and yos_fcntl
      dereferences `0` as a va_list pointer → arg always reads
      back as garbage. Variadic prototype is mandatory.
    externs:
      - "int pipe(int *);"
      - "int close(int);"
      - "int fcntl(int, int, ...);"
    body: |
      int pp[2] = {-1, -1};
      if (pipe(pp) != 0) return 46;
      /* F_GETFL = 3, F_SETFL = 4 on FreeBSD. */
      int fl = fcntl(pp[0], 3, 0);
      if (fl < 0) { close(pp[0]); close(pp[1]); return 47; }
      /* O_NONBLOCK = 4 on FreeBSD. */
      if (fcntl(pp[0], 4, fl | 4) < 0) { close(pp[0]); close(pp[1]); return 48; }
      int fl2 = fcntl(pp[0], 3, 0);
      if (fl2 < 0)           { close(pp[0]); close(pp[1]); return 49; }
      if ((fl2 & 4) == 0)    { close(pp[0]); close(pp[1]); return 50; }
      close(pp[0]); close(pp[1]);
      const char *msg = "child-fcntl-flags-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-fcntl-flags-ok"

  - name: fsync_after_write
    description: |
      child opens scratch file, writes 16 bytes, fsync — must
      return 0 on a regular file. fsync of a file that didn't
      exist on the host before fork validates the post-fork
      fd-map handed over from the parent.
    externs:
      - "int open(const char *, int, ...);"
      - "int close(int);"
      - "int unlink(const char *);"
      - "int getpid(void);"
      - "int fsync(int);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-sync-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 51;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      int fd = open(path, 0x602, 0644);
      if (fd < 0) return 52;
      if (write(fd, "fsync-payload!!!", 16) != 16) {
          close(fd); unlink(path); return 53;
      }
      if (fsync(fd) != 0) { close(fd); unlink(path); return 54; }
      close(fd);
      unlink(path);
      const char *msg = "child-fsync-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-fsync-ok"

  - name: ftruncate_shrink
    description: |
      child opens scratch, writes 32 B, ftruncate(8), reads back —
      file length must be 8. Exercises ftruncate's off_t (long
      long on wasm32) arg and the post-truncation read path.
    externs:
      - "int open(const char *, int, ...);"
      - "int       close(int);"
      - "int       unlink(const char *);"
      - "int       getpid(void);"
      - "int       ftruncate(int, long long);"
      - "long long lseek(int, long long, int);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-tr-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 55;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      int fd = open(path, 0x602, 0644);
      if (fd < 0) return 56;
      if (write(fd, "0123456789abcdef0123456789abcdef", 32) != 32) {
          close(fd); unlink(path); return 57;
      }
      if (ftruncate(fd, 8) != 0)                   { close(fd); unlink(path); return 58; }
      /* SEEK_END = 2 */
      long long end = lseek(fd, 0, 2);
      if (end != 8)                                { close(fd); unlink(path); return 59; }
      close(fd);
      unlink(path);
      const char *msg = "child-ftruncate-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-ftruncate-ok"

  - name: dup2_redirect_stdout_to_pipe
    description: |
      child dup2(pipe-write, 1), writes "marker" to fd 1, _exit.
      Parent (pre-fork) opened the pipe and stored read-end in a
      file-static. After waitpid the parent drains the pipe end
      and emits the marker on its own stdout so the test runner
      sees expected_stdout there.
    externs:
      - "int pipe(int *);"
      - "int close(int);"
      - "int dup2(int, int);"
      - "int read(int, void *, unsigned int);"
    prep_globals: |
      static int redir_pp[2] = {-1, -1};
    prep: |
      if (pipe(redir_pp) != 0) { emit("HARNESS:pipe-failed\n"); _exit(122); }
    body: |
      close(redir_pp[0]);
      if (dup2(redir_pp[1], 1) < 0) return 60;
      const char *msg = "marker-via-dup2";
      if (write(1, msg, (unsigned)strlen(msg)) != (int)strlen(msg)) return 61;
      close(redir_pp[1]);
      return 0;
    # Drain in the parent half — handled inline below.
    notes: |
      Parent post-fork hook: we want to read what the child wrote
      to the pipe and re-emit it on the real stdout so the runner's
      stdout-substring check passes. The body field only describes
      the child; the parent's drain happens via a `post_wait:` hook.
    post_wait: |
      close(redir_pp[1]);
      char rb[64]; int total = 0;
      for (;;) {
          int n = read(redir_pp[0], rb + total, (unsigned)(64 - total));
          if (n <= 0) break;
          total += n;
          if (total >= 64) break;
      }
      close(redir_pp[0]);
      if (total > 0) write(1, rb, (unsigned)total);
      write(1, "\n", 1);
    expected_exit: 0
    expected_stdout: "marker-via-dup2"

  - name: closefrom_above_3
    description: |
      child opens a scratch fd, calls closefrom(that fd) — the fd
      must end up closed. Exercises FreeBSD's closefrom(2), which
      shells use to slam down inherited fds before exec.
    externs:
      # FreeBSD closefrom(2) returns void (not int). yos's bridge
      # signature matches that — declaring it as `int closefrom(int)`
      # trips wasm3's signature-check on link with "function signature
      # mismatch".
      - "void closefrom(int);"
      - "int open(const char *, int, ...);"
      - "int  close(int);"
      - "int  unlink(const char *);"
      - "int  getpid(void);"
    body: |
      char path[40];
      const char *pfx = "/tmp/yos-fork-cf-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 62;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      int fd = open(path, 0x602, 0644);
      if (fd < 0) { unlink(path); return 63; }

      /* closefrom(fd) should close fd. A follow-up close() on the
       * same fd must then return -1 (EBADF) — that's how we know
       * closefrom actually closed it. */
      closefrom(fd);
      if (close(fd) == 0) { unlink(path); return 65; }

      unlink(path);
      const char *msg = "child-closefrom-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-closefrom-ok"

  # ── directory ops ──

  - name: chdir_to_tmp_then_open_relative
    description: |
      child chdir("/tmp"), then opens a per-pid file by RELATIVE
      path, writes, closes, unlinks. Catches "post-fork cwd was
      not preserved" or "relative path resolution still walks
      from /".
    externs:
      - "int chdir(const char *);"
      - "int open(const char *, int, ...);"
      - "int close(int);"
      - "int unlink(const char *);"
      - "int getpid(void);"
    body: |
      if (chdir("/tmp") != 0) return 66;

      char path[40];
      const char *pfx = "yos-fork-cwd-";
      int i = 0;
      for (; pfx[i]; ++i) path[i] = pfx[i];
      int pid = getpid();
      if (pid < 0) return 67;
      char tmp[12]; int t = 0;
      if (pid == 0) { tmp[t++] = '0'; }
      else { int p = pid; while (p) { tmp[t++] = (char)('0' + (p % 10)); p /= 10; } }
      while (t--) path[i++] = tmp[t];
      path[i] = 0;

      int fd = open(path, 0x602, 0644);

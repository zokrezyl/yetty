  - name: pipe_self_communication
    description: |
      child pipe(), write("ping", 4) on write end, read 4 on
      read end, compares. The child's pipe is brand-new (created
      AFTER fork), so this exercises post-fork fd allocation —
      not just inheriting parent's fds.
    externs:
      - "int pipe(int *);"
      - "int close(int);"
      - "int read(int, void *, unsigned int);"
    body: |
      int pp[2] = {-1, -1};
      if (pipe(pp) != 0) return 97;
      if (write(pp[1], "ping", 4) != 4) { close(pp[0]); close(pp[1]); return 98; }
      char rb[4] = {0};
      if (read(pp[0], rb, 4) != 4)      { close(pp[0]); close(pp[1]); return 99; }
      close(pp[0]); close(pp[1]);
      if (rb[0] != 'p' || rb[1] != 'i' || rb[2] != 'n' || rb[3] != 'g') return 100;
      const char *msg = "child-pipe-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-pipe-ok"

  # ── time / clock ──

  - name: clock_gettime_monotonic
    description: |
      child calls clock_gettime(CLOCK_MONOTONIC) twice with
      usleep(1ms) between — second tv must not be before first.
      Exercises the struct timespec out-param across two calls.
    externs:
      - "int clock_gettime(int, void *);"
      - "int usleep(unsigned int);"
    body: |
      /* struct timespec on wasm32: 8 bytes
       *   long tv_sec   (offset 0, 4 B)
       *   long tv_nsec  (offset 4, 4 B) */
      int ts1[2] = {0, 0};
      int ts2[2] = {0, 0};
      /* CLOCK_MONOTONIC = 4 on FreeBSD. */
      if (clock_gettime(4, ts1) != 0) return 101;
      usleep(1000);
      if (clock_gettime(4, ts2) != 0) return 102;
      if (ts2[0] < ts1[0]) return 103;
      if (ts2[0] == ts1[0] && ts2[1] < ts1[1]) return 104;
      const char *msg = "child-clock-mono-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-clock-mono-ok"


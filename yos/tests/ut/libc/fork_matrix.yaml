    expected_stdout: "child-snprintf-ok"

  # ── signals ──

  - name: sigaction_install_restore
    description: |
      child installs SIG_IGN for SIGUSR1, then restores the old
      action. Pure install/restore round-trip — no signal is
      actually delivered, so this only exercises the bridge's
      sigaction-struct marshalling (sa_handler/sa_flags/sa_mask
      offsets, 12 B on wasm32). See test_ssh_sigaction_mask.c
      for the at-rest sigset_t layout this leans on.
    externs:
      - "int sigaction(int, const void *, void *);"
    body: |
      /* struct sigaction on wasm32-FreeBSD is 24 bytes:
       *   uint32 sa_handler        (offset 0)
       *   int32  sa_flags          (offset 4)
       *   uint32 sa_mask[4]        (offset 8, 16-byte sigset_t)
       * Lay it out as a byte array and write the handler/flags
       * bytes directly so we don't need a real `struct sigaction`
       * typedef in this minimal test harness. */
      unsigned char act[24]  = {0};
      unsigned char oact[24] = {0};
      /* sa_handler = 1 (SIG_IGN), little-endian into bytes 0..3 */
      act[0] = 1;
      /* SIGUSR1 = 30 on FreeBSD. */
      if (sigaction(30, act, oact) != 0) return 95;
      /* Restore: pass oact as the new action. */
      if (sigaction(30, oact, 0) != 0)   return 96;
      const char *msg = "child-sigaction-ok\n";
      write(1, msg, (unsigned)strlen(msg));
      return 0;
    expected_exit: 0
    expected_stdout: "child-sigaction-ok"


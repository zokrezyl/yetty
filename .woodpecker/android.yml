labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, manual, pull_request, tag]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: true

steps:
  # Plugin-git's clone container runs as root, so the workspace ends up
  # root-owned. The build container runs as misi (uid 1000), and libgit2
  # (used by `nix develop` to evaluate the git+file:// flake input) refuses
  # repos owned by a different uid. Chown the workspace to 1000:1000 here
  # so the build step + nix see a misi-owned repo.
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: yetty-build:latest
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - make build-android-ytrace-release

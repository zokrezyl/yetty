# glfw 3rdparty — windows-x86_64 (native MSVC on the windows-amd64 agent,
# e.g. winy). cmake auto-detects cl.exe after vcvarsall. The build script
# (build.sh) execs _build.sh directly when cl is on PATH, no nix involved.

labels:
  platform: windows/amd64

when:
  - event: manual
  - event: tag
    ref: refs/tags/lib-glfw-*

# plugin-git writes safe.directory into the user's global gitconfig on every
# clone. On the local-backend windows agent all jobs share C:\Users\misi, so
# parallel clones race on .gitconfig.lock. Send that write to NUL.
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      # NUL doesn't work — git wants to create <path>.lock and NUL.lock
      # is invalid. A path inside the workspace gives each parallel job
      # its own lockable file.
      GIT_CONFIG_GLOBAL: .gitconfig.cisafe

steps:
  build:
    image: cmd
    commands:
      - call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
      - bash -c "TARGET_PLATFORM=windows-x86_64 OUTPUT_DIR=out ./build-tools/3rdparty/glfw/build.sh"
      - dir out

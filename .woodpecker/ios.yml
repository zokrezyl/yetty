labels:
  platform: darwin/amd64

when:
  - event: [push, manual, pull_request, tag]

steps:
  build:
    image: bash
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - git lfs install
      - git lfs fetch
      - git lfs checkout
      - cmake -B build-ios-ytrace-release -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release -DYETTY_IOS=ON -DYETTY_ENABLE_TOOL_QA=OFF -S .
      - cmake --build build-ios-ytrace-release --config Release --parallel 4

  # ygreeter is gated off on iOS (POSIX TTY assumptions) so the copy may
  # silently skip it. yetty itself is the main artifact.
  archive:
    image: bash
    when:
      status: [success]
    commands:
      - DEST="$HOME/woodpecker-artifacts/ios/$CI_PIPELINE_NUMBER"
      - mkdir -p "$DEST"
      - cp build-ios-ytrace-release/yetty "$DEST/" 2>/dev/null || true
      - cp build-ios-ytrace-release/tools/ygreeter/ygreeter "$DEST/" 2>/dev/null || true

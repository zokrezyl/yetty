labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, manual, pull_request, tag]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: true

steps:
  # See android.yml for explanation.
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: yetty-build:latest
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - make build-desktop-ytrace-release
      # A green pipeline must mean the deterministic suite passed, not just
      # that yetty built. Excludes network/gpu/display/slow (see docs/testing.md).
      - make test-fast

  # Upstream Web-Platform-Tests conformance ratchet: run the real WPT
  # layout suites (check-layout-th.js geometry assertions) against the
  # freshly-built ybrowser and REQUIRE every test in the committed
  # baseline (test/ybrowser/wpt-upstream/baseline.json) to stay green —
  # the score only goes up. The WPT checkout is pinned to the commit
  # recorded in the baseline so upstream churn can't move the goalposts.
  # After a layout fix turns tests green, re-record with
  #   run.py --write-baseline test/ybrowser/wpt-upstream/baseline.json tmp/wpt
  # and commit the refreshed baseline alongside the fix.
  wpt-ratchet:
    image: yetty-build:latest
    commands:
      - |
        WPT_COMMIT=$(python3 -c "import json; print(json.load(open('test/ybrowser/wpt-upstream/baseline.json'))['wpt_commit'])")
        git clone --no-checkout --filter=blob:none --sparse https://github.com/web-platform-tests/wpt tmp/wpt
        git -C tmp/wpt sparse-checkout set css/css-flexbox css/css-grid css/support resources
        git -C tmp/wpt checkout "$WPT_COMMIT"
        python3 test/ybrowser/wpt-upstream/run.py --baseline test/ybrowser/wpt-upstream/baseline.json tmp/wpt

  # Regression corpus check (issue #454): compare deterministic ycat/
  # decode-ydraw scenario output against the accepted reference corpus
  # published as a GitHub Release asset. Read-only — this step never
  # uploads or promotes references; promotion happens only through the
  # manual promote-regression-reference GitHub Actions workflow.
  regression:
    image: yetty-build:latest
    commands:
      - |
        mkdir -p tmp/regression
        fetch_status=0
        python3 test/regression/regression.py fetch --dest tmp/regression/corpus.zip || fetch_status=$?
        if [ "$fetch_status" = "3" ]; then
          echo "no regression corpus published yet — skipping check"
        elif [ "$fetch_status" != "0" ]; then
          echo "regression corpus unavailable (possibly mid-promotion) — restart this pipeline once the promotion has finished"
          exit "$fetch_status"
        else
          python3 test/regression/regression.py check --corpus tmp/regression/corpus.zip --evidence tmp/regression/evidence
        fi

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, manual, pull_request, tag]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: true

steps:
  # See android.yml for explanation.
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: yetty-build:latest
    commands:
      # plugin-git does a shallow clone with no tags; the 3rdparty version
      # resolver in shared.cmake needs a reachable yetty-X.Y.Z tag.
      - git fetch --tags
      - make build-desktop-ytrace-release

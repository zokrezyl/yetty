labels:
  platform: darwin/amd64

when:
  - event: [push, manual, pull_request, tag]

steps:
  build:
    image: bash
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - git lfs install
      - git lfs fetch
      - git lfs checkout
      - cmake -B build-tvos-ytrace-release -G Ninja -DCMAKE_SYSTEM_NAME=tvOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=appletvos -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release -DYETTY_TVOS=ON -DYETTY_ENABLE_TOOL_QA=OFF -S .
      - cmake --build build-tvos-ytrace-release --config Release --parallel 4

  # See macos.yml for the absolute-path rationale (the local backend
  # sandboxes $HOME into the per-pipeline temp tree). ygreeter is gated
  # off on tvOS (POSIX TTY assumptions) so its copy silently skips.
  archive:
    image: bash
    when:
      status: [success]
    commands:
      - DEST="/Users/mihaly.elekes/woodpecker-artifacts/tvos/$CI_PIPELINE_NUMBER"
      - mkdir -p "$DEST"
      - cp build-tvos-ytrace-release/yetty "$DEST/" 2>/dev/null || true
      - cp build-tvos-ytrace-release/tools/ygreeter/ygreeter "$DEST/" 2>/dev/null || true

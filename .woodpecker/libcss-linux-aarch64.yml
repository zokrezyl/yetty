# libcss 3rdparty — linux-aarch64 native (docker on the linux-arm64
# agent, e.g. rb00). Native build — no cross-compile.

labels:
  platform: linux/arm64
  backend: docker

when:
  - event: manual
  - event: tag
    ref: refs/tags/lib-libcss-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: ubuntu:24.04
    environment:
      TARGET_PLATFORM: linux-aarch64
      OUTPUT_DIR: out
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - >
        apt-get install -y --no-install-recommends
        build-essential perl pkg-config
        flex bison gperf
        curl ca-certificates tar
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/libcss/build.sh
      - ls -lh "$OUTPUT_DIR/"

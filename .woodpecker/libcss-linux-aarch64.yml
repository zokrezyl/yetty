# libcss 3rdparty — linux-aarch64 native (docker on the linux-arm64
# agent, e.g. rb00). Native build — no cross-compile.

labels:
  platform: linux/arm64
  backend: docker

# Disabled — libcss prebuilt is published via .github/workflows; the
# woodpecker workflow stays parked. Re-enable by uncommenting below.
when:
  - evaluate: 'false'

#when:
#  - event: manual
#  - event: tag
#    ref: refs/tags/lib-libcss-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: yetty-build:latest
    environment:
      TARGET_PLATFORM: linux-aarch64
      OUTPUT_DIR: out
    commands:
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/libcss/build.sh
      - ls -lh "$OUTPUT_DIR/"

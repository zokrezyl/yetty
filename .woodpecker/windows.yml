labels:
  platform: windows/amd64

when:
  - event: [push, manual, pull_request, tag]

# plugin-git writes safe.directory into the user's global gitconfig on every
# clone. On the local-backend windows agent all jobs share C:\Users\misi, so
# parallel clones race on .gitconfig.lock. Send that write to NUL.
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      # NUL doesn't work — git wants to create <path>.lock and NUL.lock
      # is invalid. A path inside the workspace gives each parallel job
      # its own lockable file.
      GIT_CONFIG_GLOBAL: .gitconfig.cisafe

steps:
  build:
    image: cmd
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired. (cmd.exe shell.)
      - git fetch --unshallow --tags 2>nul || git fetch --tags
      - git lfs install
      - git lfs fetch
      - git lfs checkout
      - call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
      - cmake -B build-windows-ytrace-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEBGPU_BACKEND=dawn -DYETTY_ENABLE_TOOL_QA=OFF -DCMAKE_TLS_CAINFO=C:/Strawberry/perl/vendor/lib/Mozilla/CA/cacert.pem -DCMAKE_C_FLAGS=/Zc:preprocessor -DCMAKE_CXX_FLAGS=/Zc:preprocessor -S .
      - cmake --build build-windows-ytrace-release --config Release --parallel

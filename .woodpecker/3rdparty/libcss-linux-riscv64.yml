# libcss 3rdparty — linux-riscv64 cross-compile (docker on the linux-amd64
# agent). The only libcss linux target that cross-compiles — no native
# riscv64 woodpecker agent. Uses ubuntu's gcc-riscv64-linux-gnu.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: manual
  - event: tag
    ref: refs/tags/lib-libcss-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: ubuntu:24.04
    environment:
      TARGET_PLATFORM: linux-riscv64
      OUTPUT_DIR: out
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - >
        apt-get install -y --no-install-recommends
        build-essential perl pkg-config
        flex bison gperf
        gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
        curl ca-certificates tar
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/libcss/build.sh
      - ls -lh "$OUTPUT_DIR/"

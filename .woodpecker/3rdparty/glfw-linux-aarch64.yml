# glfw 3rdparty — linux-aarch64 native (docker on the linux-arm64 agent,
# e.g. rb00). Native build — no cross-compile.

labels:
  platform: linux/arm64
  backend: docker

when:
  - event: manual
  - event: tag
    ref: refs/tags/lib-glfw-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: ubuntu:24.04
    environment:
      TARGET_PLATFORM: linux-aarch64
      OUTPUT_DIR: out
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - >
        apt-get install -y --no-install-recommends
        cmake ninja-build pkg-config build-essential
        libx11-dev libxrandr-dev libxinerama-dev
        libxcursor-dev libxi-dev libxext-dev
        libwayland-dev wayland-protocols libwayland-bin
        libxkbcommon-dev libgl1-mesa-dev
        curl ca-certificates tar
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/glfw/build.sh
      - ls -lh "$OUTPUT_DIR/"

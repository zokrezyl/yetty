labels:
  platform: darwin/amd64

when:
  - event: [push, manual, pull_request, tag]

steps:
  build:
    image: bash
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - git lfs install
      - git lfs fetch
      - git lfs checkout
      - make build-desktop-ytrace-release

  # Workspace gets cleaned post-pipeline — copy binaries to a persistent
  # location under $HOME keyed by the per-repo CI_PIPELINE_NUMBER that
  # Woodpecker injects.
  archive:
    image: bash
    when:
      status: [success]
    commands:
      - DEST="$HOME/woodpecker-artifacts/macos/$CI_PIPELINE_NUMBER"
      - mkdir -p "$DEST"
      - cp build-desktop-ytrace-release/yetty "$DEST/"
      - cp build-desktop-ytrace-release/tools/ygreeter/ygreeter "$DEST/"

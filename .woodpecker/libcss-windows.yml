# libcss 3rdparty — windows-x86_64 (native MSVC on the windows-amd64 agent).
# NetSurf's buildsystem doesn't honour MSVC; the build script writes the
# UNSUPPORTED placeholder tarball. The matrix entry exists for shape
# parity with the other 3rdparty workflows.

labels:
  platform: windows/amd64

# Disabled — libcss prebuilt is published via .github/workflows; the
# woodpecker workflow stays parked. Re-enable by uncommenting below.
when:
  - evaluate: 'false'

#when:
#  - event: manual
#  - event: tag
#    ref: refs/tags/lib-libcss-*

steps:
  build:
    image: cmd
    commands:
      - call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
      - bash -c "TARGET_PLATFORM=windows-x86_64 OUTPUT_DIR=out ./build-tools/3rdparty/libcss/build.sh"
      - dir out

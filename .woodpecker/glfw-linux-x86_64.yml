# glfw 3rdparty — linux-x86_64 (docker on the linux-amd64 agent).
# Triggered by:
#   - manual run (test on local network before pushing the lib-glfw-* tag)
#   - tag push matching lib-glfw-*
#
# Output: out/glfw-linux-x86_64-<ver>.tar.gz. The build matches the
# .github/workflows/build-3rdparty-glfw.yml linux job.

labels:
  platform: linux/amd64
  backend: docker

# Disabled — glfw prebuilt is published via .github/workflows; the
# woodpecker workflow stays parked. Re-enable by uncommenting below.
when:
  - evaluate: 'false'

#when:
#  - event: manual
#  - event: tag
#    ref: refs/tags/lib-glfw-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: yetty-build:latest
    environment:
      TARGET_PLATFORM: linux-x86_64
      OUTPUT_DIR: out
    commands:
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/glfw/build.sh
      - ls -lh "$OUTPUT_DIR/"

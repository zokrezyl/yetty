labels:
  platform: darwin/amd64

when:
  - event: [push, manual, pull_request, tag]

steps:
  build:
    image: bash
    commands:
      # plugin-git makes a shallow, tagless clone; the 3rdparty version
      # resolver in shared.cmake runs `git describe --tags HEAD`, which
      # needs a yetty-X.Y.Z tag *reachable* from HEAD — both the depth
      # and the missing tag refs must be repaired.
      - git fetch --unshallow --tags 2>/dev/null || git fetch --tags
      - git lfs install
      - git lfs fetch
      - git lfs checkout
      - cmake -B build-ios_x86_64-ytrace-release -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release -DYETTY_IOS=ON -DYETTY_ENABLE_TOOL_QA=OFF -S .
      - cmake --build build-ios_x86_64-ytrace-release --config Release --parallel 4

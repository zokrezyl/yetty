# libcss 3rdparty — linux-x86_64 (docker on the linux-amd64 agent).
# NetSurf's GNU-make buildsystem needs perl + flex/bison/gperf for the
# autogenerated parser tables.

labels:
  platform: linux/amd64
  backend: docker

when:
  - event: manual
  - event: tag
    ref: refs/tags/lib-libcss-*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  fix-workspace-perms:
    image: alpine
    commands:
      - chown -R 1000:1000 .

  build:
    image: ubuntu:24.04
    environment:
      TARGET_PLATFORM: linux-x86_64
      OUTPUT_DIR: out
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - >
        apt-get install -y --no-install-recommends
        build-essential perl pkg-config
        flex bison gperf
        curl ca-certificates tar
      - mkdir -p "$OUTPUT_DIR"
      - ./build-tools/3rdparty/libcss/build.sh
      - ls -lh "$OUTPUT_DIR/"

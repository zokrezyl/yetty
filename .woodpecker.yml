clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 50
      lfs: false

steps:
  build:
    image: ubuntu:latest
    commands:
      - apt-get update
      - apt-get install -y git git-lfs make cmake
      - git lfs install
      - git lfs fetch
      - make build-desktop-ytrace-release

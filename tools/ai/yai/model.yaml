methods:
  - slot: resolve_permission
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: allowed
        type: int
    doc: "/* Engines without a permission protocol simply have nothing to answer
 * — a no-op default, NOT an error: main.c calls this unconditionally
 * at shutdown to never leave a CLI blocked on an unanswered prompt. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: handle_event
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: event
        type: "struct yyjson_val *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: send_user_message
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: text
        type: "const char *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: interrupt
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: start
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: describe_config
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: out
        type: "char *"
      - name: out_size
        type: size_t
    doc: "/* describe_config: write the engine-specific configuration rows
 * (model, sandbox/permission knobs, resume token semantics) into
 * `out` as newline-separated \"key: value  [ENV_KNOB]\" lines. The
 * caller presents them — as labels in the ygui config dialog when the
 * HUD is up, or as scrollback text without one. Errors on truncation.
 * Default: an engine with no knobs writes an empty string. */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: config_knob
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: out
        type: "char *"
      - name: out_size
        type: size_t
    doc: "/* config_knob: the engine's ONE editable knob for the config dialog,
 * as `ENV_KEY|label|option1,option2,…|current-value`. The dialog
 * renders it as a radio group; a selection lands back in apply_config.
 * Default: no knob (empty string). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: apply_config
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: key
        type: "const char *"
      - name: value
        type: "const char *"
    doc: "/* apply_config: a knob edited in the config dialog. `key` is the engine
 * field name from config_knob, `value` the chosen option. The value is
 * already stored in app->config by the caller (yai_config_set); the per-turn
 * engines read that struct on every spawn, so the change takes effect on the
 * next turn. The base default therefore does nothing. Engines with a live
 * protocol override this (claude pushes the new permission mode into the
 * running session immediately). */"
    local: true
    oneway: false
    return_payload_type: null
  - slot: on_child_exit
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: exit_status
        type: int64_t
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: on_child_eof
    domain: yai
    owning_class: engine
    return_type: struct yetty_ycore_void_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
    doc: null
    local: true
    oneway: false
    return_payload_type: null
  - slot: feed_byte
    domain: yai
    owning_class: editor
    return_type: struct yetty_ycore_int_result
    args:
      - name: obj
        type: "struct yetty_yclass_object *"
      - name: app
        type: "struct yai_app *"
      - name: byte
        type: int
    doc: null
    local: true
    oneway: false
    return_payload_type: int
